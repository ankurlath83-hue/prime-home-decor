त्यक्त्वा फलं चैव स त्यागः सात्त्विको मतः॥","kāryam ity eva yat karma niyataṁ kriyate ‘rjuna\nsaṅgaṁ tyaktvā phalaṁ chaiva sa tyāgaḥ sāttviko mataḥ"],[18,10,"न द्वेष्ट्यकुशलं कर्म कुशले नानुषज्जते।त्यागी सत्त्वसमाविष्टो मेधावी छिन्नसंशयः॥","na dveṣhṭy akuśhalaṁ karma kuśhale nānuṣhajjate\ntyāgī sattva-samāviṣhṭo medhāvī chhinna-sanśhayaḥ"],[18,11,"न हि देहभृता शक्यं त्यक्तुं कर्माण्यशेषतः।यस्तु कर्मफलत्यागी स त्यागीत्यभिधीयते॥","na hi deha-bhṛitā śhakyaṁ tyaktuṁ karmāṇy aśheṣhataḥ\nyas tu karma-phala-tyāgī sa tyāgīty abhidhīyate"],[18,12,"अनिष्टमिष्टं मिश्रं च त्रिविधं कर्मणः फलम्।भवत्यत्यागिनां प्रेत्य न तु संन्यासिनां क्वचित्॥","aniṣhṭam iṣhṭaṁ miśhraṁ cha tri-vidhaṁ karmaṇaḥ phalam\nbhavaty atyāgināṁ pretya na tu sannyāsināṁ kvachit"],[18,13,"पञ्चैतानि महाबाहो कारणानि निबोध मे।सांख्ये कृतान्ते प्रोक्तानि सिद्धये सर्वकर्मणाम्॥","pañchaitāni mahā-bāho kāraṇāni nibodha me\nsānkhye kṛitānte proktāni siddhaye sarva-karmaṇām"],[18,14,"अधिष्ठानं तथा कर्ता करणं च पृथग्विधम्।विविधाश्च पृथक्चेष्टा दैवं चैवात्र पञ्चमम्॥","adhiṣhṭhānaṁ tathā kartā karaṇaṁ cha pṛithag-vidham\nvividhāśh cha pṛithak cheṣhṭā daivaṁ chaivātra pañchamam"],[18,15,"शरीरवाङ्मनोभिर्यत्कर्म प्रारभते नरः।न्याय्यं वा विपरीतं वा पञ्चैते तस्य हेतवः॥","śharīra-vāṅ-manobhir yat karma prārabhate naraḥ\nnyāyyaṁ vā viparītaṁ vā pañchaite tasya hetavaḥ"],[18,16,"तत्रैवं सति कर्तारमात्मानं केवलं तु यः।पश्यत्यकृतबुद्धित्वान्न स पश्यति दुर्मतिः॥","tatraivaṁ sati kartāram ātmānaṁ kevalaṁ tu yaḥ\npaśhyaty akṛita-buddhitvān na sa paśhyati durmatiḥ"],[18,17,"यस्य नाहंकृतो भावो बुद्धिर्यस्य न लिप्यते।हत्वापि स इमाँल्लोकान्न हन्ति न निबध्यते॥","yasya nāhankṛito bhāvo buddhir yasya na lipyate\nhatvā ‘pi sa imāl lokān na hanti na nibadhyate"],[18,18,"ज्ञानं ज्ञेयं परिज्ञाता त्रिविधा कर्मचोदना।करणं कर्म कर्तेति त्रिविधः कर्मसंग्रहः॥","jñānaṁ jñeyaṁ parijñātā tri-vidhā karma-chodanā\nkaraṇaṁ karma karteti tri-vidhaḥ karma-saṅgrahaḥ"],[18,19,"ज्ञानं कर्म च कर्ता च त्रिधैव गुणभेदतः।प्रोच्यते गुणसंख्याने यथावच्छृणु तान्यपि॥","jñānaṁ karma cha kartā cha tridhaiva guṇa-bhedataḥ\nprochyate guṇa-saṅkhyāne yathāvach chhṛiṇu tāny api"],[18,20,"सर्वभूतेषु येनैकं भावमव्ययमीक्षते।अविभक्तं विभक्तेषु तज्ज्ञानं विद्धि सात्त्विकम्॥","sarva-bhūteṣhu yenaikaṁ bhāvam avyayam īkṣhate\navibhaktaṁ vibhakteṣhu taj jñānaṁ viddhi sāttvikam"],[18,21,"पृथक्त्वेन तु यज्ज्ञानं नानाभावान्पृथग्विधान्।वेत्ति सर्वेषु भूतेषु तज्ज्ञानं विद्धि राजसम्॥","pṛithaktvena tu yaj jñānaṁ nānā-bhāvān pṛithag-vidhān\nvetti sarveṣhu bhūteṣhu taj jñānaṁ viddhi rājasam"],[18,22,"यत्तु कृत्स्नवदेकस्मिन्कार्ये सक्तमहैतुकम्।अतत्त्वार्थवदल्पं च तत्तामसमुदाहृतम्॥","yat tu kṛitsna-vad ekasmin kārye saktam ahaitukam\natattvārtha-vad alpaṁ cha tat tāmasam udāhṛitam"],[18,23,"नियतं सङ्गरहितमरागद्वेषतः कृतम्।अफलप्रेप्सुना कर्म यत्तत्सात्त्विकमुच्यते॥","niyataṁ saṅga-rahitam arāga-dveṣhataḥ kṛitam\naphala-prepsunā karma yat tat sāttvikam uchyate"],[18,24,"यत्तु कामेप्सुना कर्म साहङ्कारेण वा पुनः।क्रियते बहुलायासं तद्राजसमुदाहृतम्॥","yat tu kāmepsunā karma sāhankāreṇa vā punaḥ\nkriyate bahulāyāsaṁ tad rājasam udāhṛitam"],[18,25,"अनुबन्धं क्षयं हिंसामनपेक्ष्य च पौरुषम्।मोहादारभ्यते कर्म यत्तत्तामसमुच्यते॥","anubandhaṁ kṣhayaṁ hinsām anapekṣhya cha pauruṣham\nmohād ārabhyate karma yat tat tāmasam uchyate"],[18,26,"मुक्तसङ्गोऽनहंवादी धृत्युत्साहसमन्वितः।सिद्ध्यसिद्ध्योर्निर्विकारः कर्ता सात्त्विक उच्यते॥","mukta-saṅgo ‘nahaṁ-vādī dhṛity-utsāha-samanvitaḥ\nsiddhy-asiddhyor nirvikāraḥ kartā sāttvika uchyate"],[18,27,"रागी कर्मफलप्रेप्सुर्लुब्धो हिंसात्मकोऽशुचिः।हर्षशोकान्वितः कर्ता राजसः परिकीर्तितः॥","rāgī karma-phala-prepsur lubdho hinsātmako ‘śhuchiḥ\nharṣha-śhokānvitaḥ kartā rājasaḥ parikīrtitaḥ"],[18,28,"अयुक्तः प्राकृतः स्तब्धः शठो नैष्कृतिकोऽलसः।विषादी दीर्घसूत्री च कर्ता तामस उच्यते॥","ayuktaḥ prākṛitaḥ stabdhaḥ śhaṭho naiṣhkṛitiko ‘lasaḥ\nviṣhādī dīrgha-sūtrī cha kartā tāmasa uchyate"],[18,29,"बुद्धेर्भेदं धृतेश्चैव गुणतस्त्रिविधं श्रृणु।प्रोच्यमानमशेषेण पृथक्त्वेन धनञ्जय॥","buddher bhedaṁ dhṛiteśh chaiva guṇatas tri-vidhaṁ śhṛiṇu\nprochyamānam aśheṣheṇa pṛithaktvena dhanañjaya"],[18,30,"प्रवृत्तिं च निवृत्तिं च कार्याकार्ये भयाभये।बन्धं मोक्षं च या वेत्ति बुद्धिः सा पार्थ सात्त्विकी॥","pravṛittiṁ cha nivṛittiṁ cha kāryākārye bhayābhaye\nbandhaṁ mokṣhaṁ cha yā vetti buddhiḥ sā pārtha sāttvikī"],[18,31,"यया धर्ममधर्मं च कार्यं चाकार्यमेव च।अयथावत्प्रजानाति बुद्धिः सा पार्थ राजसी॥","yayā dharmam adharmaṁ cha kāryaṁ chākāryam eva cha\nayathāvat prajānāti buddhiḥ sā pārtha rājasī"],[18,32,"अधर्मं धर्ममिति या मन्यते तमसाऽऽवृता।सर्वार्थान्विपरीतांश्च बुद्धिः सा पार्थ तामसी॥","adharmaṁ dharmam iti yā manyate tamasāvṛitā\nsarvārthān viparītānśh cha buddhiḥ sā pārtha tāmasī"],[18,33,"धृत्या यया धारयते मनःप्राणेन्द्रियक्रियाः।योगेनाव्यभिचारिण्या धृतिः सा पार्थ सात्त्विकी॥","dhṛityā yayā dhārayate manaḥ-prāṇendriya-kriyāḥ\nyogenāvyabhichāriṇyā dhṛitiḥ sā pārtha sāttvikī"],[18,34,"यया तु धर्मकामार्थान् धृत्या धारयतेऽर्जुन।प्रसङ्गेन फलाकाङ्क्षी धृतिः सा पार्थ राजसी॥","yayā tu dharma-kāmārthān dhṛityā dhārayate ‘rjuna\nprasaṅgena phalākāṅkṣhī dhṛitiḥ sā pārtha rājasī"],[18,35,"यया स्वप्नं भयं शोकं विषादं मदमेव च।न विमुञ्चति दुर्मेधा धृतिः सा पार्थ तामसी॥","yayā svapnaṁ bhayaṁ śhokaṁ viṣhādaṁ madam eva cha\nna vimuñchati durmedhā dhṛitiḥ sā pārtha tāmasī"],[18,36,"सुखं त्विदानीं त्रिविधं श्रृणु मे भरतर्षभ।अभ्यासाद्रमते यत्र दुःखान्तं च निगच्छति॥","sukhaṁ tv idānīṁ tri-vidhaṁ śhṛiṇu me bharatarṣhabha\nabhyāsād ramate yatra duḥkhāntaṁ cha nigachchhati\n yat tad agre viṣham iva pariṇāme ‘mṛitopamam\ntat sukhaṁ sāttvikaṁ proktam ātma-buddhi-prasāda-jam"],[18,37,"यत्तदग्रे विषमिव परिणामेऽमृतोपमम्।तत्सुखं सात्त्विकं प्रोक्तमात्मबुद्धिप्रसादजम्॥","yat  tad agre    viṣam   iva pariṇāme    'mṛtopamam  tat sukhaṁ  sāttvikaṁ   proktam ātma-buddhi-prasāda-jam"],[18,38,"विषयेन्द्रियसंयोगाद्यत्तदग्रेऽमृतोपमम्।परिणामे विषमिव तत्सुखं राजसं स्मृतम्॥","viṣhayendriya-sanyogād yat tad agre ’mṛitopamam\npariṇāme viṣham iva tat sukhaṁ rājasaṁ smṛitam"],[18,39,"यदग्रे चानुबन्धे च सुखं मोहनमात्मनः।निद्रालस्यप्रमादोत्थं तत्तामसमुदाहृतम्॥","yad agre chānubandhe cha sukhaṁ mohanam ātmanaḥ\nnidrālasya-pramādotthaṁ tat tāmasam udāhṛitam"],[18,40,"न तदस्ति पृथिव्यां वा दिवि देवेषु वा पुनः।सत्त्वं प्रकृतिजैर्मुक्तं यदेभिः स्यात्ित्रभिर्गुणैः॥","na tad asti pṛithivyāṁ vā divi deveṣhu vā punaḥ\nsattvaṁ prakṛiti-jair muktaṁ yad ebhiḥ syāt tribhir guṇaiḥ"],[18,41,"ब्राह्मणक्षत्रियविशां शूद्राणां च परंतप।कर्माणि प्रविभक्तानि स्वभावप्रभवैर्गुणैः॥","brāhmaṇa-kṣhatriya-viśhāṁ śhūdrāṇāṁ cha parantapa\nkarmāṇi pravibhaktāni svabhāva-prabhavair guṇaiḥ"],[18,42,"शमो दमस्तपः शौचं क्षान्तिरार्जवमेव च।ज्ञानं विज्ञानमास्तिक्यं ब्रह्मकर्म स्वभावजम्॥","śhamo damas tapaḥ śhauchaṁ kṣhāntir ārjavam eva cha\njñānaṁ vijñānam āstikyaṁ brahma-karma svabhāva-jam"],[18,43,"शौर्यं तेजो धृतिर्दाक्ष्यं युद्धे चाप्यपलायनम्।दानमीश्वरभावश्च क्षात्रं कर्म स्वभावजम्॥","śhauryaṁ tejo dhṛitir dākṣhyaṁ yuddhe chāpy apalāyanam\ndānam īśhvara-bhāvaśh cha kṣhātraṁ karma svabhāva-jam"],[18,44,"कृषिगौरक्ष्यवाणिज्यं वैश्यकर्म स्वभावजम्।परिचर्यात्मकं कर्म शूद्रस्यापि स्वभावजम्॥","kṛiṣhi-gau-rakṣhya-vāṇijyaṁ vaiśhya-karma svabhāva-jam\nparicharyātmakaṁ karma śhūdrasyāpi svabhāva-jam"],[18,45,"स्वे स्वे कर्मण्यभिरतः संसिद्धिं लभते नरः।स्वकर्मनिरतः सिद्धिं यथा विन्दति तच्छृणु॥","sve sve karmaṇy abhirataḥ sansiddhiṁ labhate naraḥ\nsva-karma-nirataḥ siddhiṁ yathā vindati tach chhṛiṇu"],[18,46,"यतः प्रवृत्तिर्भूतानां येन सर्वमिदं ततम्।स्वकर्मणा तमभ्यर्च्य सिद्धिं विन्दति मानवः॥","yataḥ pravṛittir bhūtānāṁ yena sarvam idaṁ tatam\nsva-karmaṇā tam abhyarchya siddhiṁ vindati mānavaḥ"],[18,47,"श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात्।स्वभावनियतं कर्म कुर्वन्नाप्नोति किल्बिषम्॥","śhreyān swa-dharmo viguṇaḥ para-dharmāt sv-anuṣhṭhitāt\nsvabhāva-niyataṁ karma kurvan nāpnoti kilbiṣham"],[18,48,"सहजं कर्म कौन्तेय सदोषमपि न त्यजेत्।सर्वारम्भा हि दोषेण धूमेनाग्निरिवावृताः॥","saha-jaṁ karma kaunteya sa-doṣham api na tyajet\nsarvārambhā hi doṣheṇa dhūmenāgnir ivāvṛitāḥ"],[18,49,"असक्तबुद्धिः सर्वत्र जितात्मा विगतस्पृहः।नैष्कर्म्यसिद्धिं परमां संन्यासेनाधिगच्छति॥","asakta-buddhiḥ sarvatra jitātmā vigata-spṛihaḥ\nnaiṣhkarmya-siddhiṁ paramāṁ sannyāsenādhigachchhati"],[18,50,"सिद्धिं प्राप्तो यथा ब्रह्म तथाप्नोति निबोध मे।समासेनैव कौन्तेय निष्ठा ज्ञानस्य या परा॥","siddhiṁ prāpto yathā brahma tathāpnoti nibodha me\nsamāsenaiva kaunteya niṣhṭhā jñānasya yā parā"],[18,51,"बुद्ध्या विशुद्धया युक्तो धृत्याऽऽत्मानं नियम्य च।शब्दादीन् विषयांस्त्यक्त्वा रागद्वेषौ व्युदस्य च॥","buddhyā viśhuddhayā yukto dhṛityātmānaṁ niyamya cha\nśhabdādīn viṣhayāns tyaktvā rāga-dveṣhau vyudasya cha"],[18,52,"विविक्तसेवी लघ्वाशी यतवाक्कायमानसः।ध्यानयोगपरो नित्यं वैराग्यं समुपाश्रितः॥","vivikta-sevī laghv-āśhī yata-vāk-kāya-mānasaḥ\ndhyāna-yoga-paro nityaṁ vairāgyaṁ samupāśhritaḥ"],[18,53,"अहङ्कारं बलं दर्पं कामं क्रोधं परिग्रहम्।विमुच्य निर्ममः शान्तो ब्रह्मभूयाय कल्पते॥","ahankāraṁ balaṁ darpaṁ kāmaṁ krodhaṁ parigraham\nvimuchya nirmamaḥ śhānto brahma-bhūyāya kalpate"],[18,54,"ब्रह्मभूतः प्रसन्नात्मा न शोचति न काङ्क्षति।समः सर्वेषु भूतेषु मद्भक्तिं लभते पराम्॥","brahma-bhūtaḥ prasannātmā na śhochati na kāṅkṣhati\nsamaḥ sarveṣhu bhūteṣhu mad-bhaktiṁ labhate parām"],[18,55,"भक्त्या मामभिजानाति यावान्यश्चास्मि तत्त्वतः।ततो मां तत्त्वतो ज्ञात्वा विशते तदनन्तरम्॥","bhaktyā mām abhijānāti yāvān yaśh chāsmi tattvataḥ\ntato māṁ tattvato jñātvā viśhate tad-anantaram"],[18,56,"सर्वकर्माण्यपि सदा कुर्वाणो मद्व्यपाश्रयः।मत्प्रसादादवाप्नोति शाश्वतं पदमव्ययम्॥","sarva-karmāṇy api sadā kurvāṇo mad-vyapāśhrayaḥ\nmat-prasādād avāpnoti śhāśhvataṁ padam avyayam"],[18,57,"चेतसा सर्वकर्माणि मयि संन्यस्य मत्परः।बुद्धियोगमुपाश्रित्य मच्चित्तः सततं भव॥","chetasā sarva-karmāṇi mayi sannyasya mat-paraḥ\nbuddhi-yogam upāśhritya mach-chittaḥ satataṁ bhava"],[18,58,"मच्चित्तः सर्वदुर्गाणि मत्प्रसादात्तरिष्यसि।अथ चेत्त्वमहङ्कारान्न श्रोष्यसि विनङ्क्ष्यसि॥","mach-chittaḥ sarva-durgāṇi mat-prasādāt tariṣhyasi\natha chet tvam ahankārān na śhroṣhyasi vinaṅkṣhyasi"],[18,59,"यदहङ्कारमाश्रित्य न योत्स्य इति मन्यसे।मिथ्यैष व्यवसायस्ते प्रकृतिस्त्वां नियोक्ष्यति॥","yad ahankāram āśhritya na yotsya iti manyase\nmithyaiṣha vyavasāyas te prakṛitis tvāṁ niyokṣhyati"],[18,60,"स्वभावजेन कौन्तेय निबद्धः स्वेन कर्मणा।कर्तुं नेच्छसि यन्मोहात्करिष्यस्यवशोऽपि तत्॥","swbhāva-jena kaunteya nibaddhaḥ svena karmaṇā\nkartuṁ nechchhasi yan mohāt kariṣhyasy avaśho ’pi tat"],[18,61,"ईश्वरः सर्वभूतानां हृद्देशेऽर्जुन तिष्ठति।भ्रामयन्सर्वभूतानि यन्त्रारूढानि मायया॥","īśhvaraḥ sarva-bhūtānāṁ hṛid-deśhe ‘rjuna tiṣhṭhati\nbhrāmayan sarva-bhūtāni yantrārūḍhāni māyayā"],[18,62,"तमेव शरणं गच्छ सर्वभावेन भारत।तत्प्रसादात्परां शान्तिं स्थानं प्राप्स्यसि शाश्वतम्॥","tam eva śharaṇaṁ gachchha sarva-bhāvena bhārata\ntat-prasādāt parāṁ śhāntiṁ sthānaṁ prāpsyasi śhāśhvatam"],[18,63,"इति ते ज्ञानमाख्यातं गुह्याद्गुह्यतरं मया।विमृश्यैतदशेषेण यथेच्छसि तथा कुरु॥","iti te jñānam ākhyātaṁ guhyād guhyataraṁ mayā\nvimṛiśhyaitad aśheṣheṇa yathechchhasi tathā kuru"],[18,64,"सर्वगुह्यतमं भूयः श्रृणु मे परमं वचः।इष्टोऽसि मे दृढमिति ततो वक्ष्यामि ते हितम्॥","sarva-guhyatamaṁ bhūyaḥ śhṛiṇu me paramaṁ vachaḥ\niṣhṭo ‘si me dṛiḍham iti tato vakṣhyāmi te hitam"],[18,65,"मन्मना भव मद्भक्तो मद्याजी मां नमस्कुरु।मामेवैष्यसि सत्यं ते प्रतिजाने प्रियोऽसि मे॥","man-manā bhava mad-bhakto mad-yājī māṁ namaskuru\nmām evaiṣhyasi satyaṁ te pratijāne priyo ‘si me"],[18,66,"सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज।अहं त्वा सर्वपापेभ्यो मोक्षयिष्यामि मा शुचः॥","sarva-dharmān parityajya mām ekaṁ śharaṇaṁ vraja\nahaṁ tvāṁ sarva-pāpebhyo mokṣhayiṣhyāmi mā śhuchaḥ"],[18,67,"इदं ते नातपस्काय नाभक्ताय कदाचन।न चाशुश्रूषवे वाच्यं न च मां योऽभ्यसूयति॥","idaṁ te nātapaskyāya nābhaktāya kadāchana\nna chāśhuśhruṣhave vāchyaṁ na cha māṁ yo ‘bhyasūtayi"],[18,68,"य इमं परमं गुह्यं मद्भक्तेष्वभिधास्यति।भक्ितं मयि परां कृत्वा मामेवैष्यत्यसंशयः॥","ya idaṁ paramaṁ guhyaṁ mad-bhakteṣhv abhidhāsyati\nbhaktiṁ mayi parāṁ kṛitvā mām evaiṣhyaty asanśhayaḥ"],[18,69,"न च तस्मान्मनुष्येषु कश्िचन्मे प्रियकृत्तमः।भविता न च मे तस्मादन्यः प्रियतरो भुवि॥","na cha tasmān manuṣhyeṣhu kaśhchin me priya-kṛittamaḥ\nbhavitā na cha me tasmād anyaḥ priyataro bhuvi"],[18,70,"अध्येष्यते च य इमं धर्म्यं संवादमावयोः।ज्ञानयज्ञेन तेनाहमिष्टः स्यामिति मे मतिः॥","adhyeṣhyate cha ya imaṁ dharmyaṁ saṁvādam āvayoḥ\njñāna-yajñena tenāham iṣhṭaḥ syām iti me matiḥ"],[18,71,"श्रद्धावाननसूयश्च श्रृणुयादपि यो नरः।सोऽपि मुक्तः शुभाँल्लोकान्प्राप्नुयात्पुण्यकर्मणाम्॥","śhraddhāvān anasūyaśh cha śhṛiṇuyād api yo naraḥ\nso ‘pi muktaḥ śhubhāl lokān prāpnuyāt puṇya-karmaṇām"],[18,72,"कच्चिदेतच्छ्रुतं पार्थ त्वयैकाग्रेण चेतसा।कच्चिदज्ञानसंमोहः प्रनष्टस्ते धनञ्जय॥","kachchid etach chhrutaṁ pārtha tvayaikāgreṇa chetasā\nkachchid ajñāna-sammohaḥ pranaṣhṭas te dhanañjaya"],[18,73,"अर्जुन उवाचनष्टो मोहः स्मृतिर्लब्धा त्वत्प्रसादान्मयाच्युत।स्थितोऽस्मि गतसन्देहः करिष्ये वचनं तव॥","arjuna uvācha\nnaṣhṭo mohaḥ smṛitir labdhā tvat-prasādān mayāchyuta\nsthito ‘smi gata-sandehaḥ kariṣhye vachanaṁ tava"],[18,74,"सञ्जय उवाचइत्यहं वासुदेवस्य पार्थस्य च महात्मनः।संवादमिममश्रौषमद्भुतं रोमहर्षणम्॥","sañjaya uvācha\nity ahaṁ vāsudevasya pārthasya cha mahātmanaḥ\nsaṁvādam imam aśhrauṣham adbhutaṁ roma-harṣhaṇam"],[18,75,"व्यासप्रसादाच्छ्रुतवानेतद्गुह्यमहं परम्।योगं योगेश्वरात्कृष्णात्साक्षात्कथयतः स्वयम्॥","vyāsa-prasādāch chhrutavān etad guhyam ahaṁ param\nyogaṁ yogeśhvarāt kṛiṣhṇāt sākṣhāt kathayataḥ svayam"],[18,76,"राजन्संस्मृत्य संस्मृत्य संवादमिममद्भुतम्।केशवार्जुनयोः पुण्यं हृष्यामि च मुहुर्मुहुः॥","rājan sansmṛitya sansmṛitya saṁvādam imam adbhutam\nkeśhavārjunayoḥ puṇyaṁ hṛiṣhyāmi cha muhur muhuḥ"],[18,77,"तच्च संस्मृत्य संस्मृत्य रूपमत्यद्भुतं हरेः।\nविस्मयो मे महान् राजन् हृष्यामि च पुनः पुनः॥","tach cha sansmṛitya saṁsmṛitya rūpam aty-adbhutaṁ hareḥ\nvismayo ye mahān rājan hṛiṣhyāmi cha punaḥ punaḥ"],[18,78,"यत्र योगेश्वरः कृष्णो यत्र पार्थो धनुर्धरः।\nतत्र श्रीर्विजयो भूतिर्ध्रुवा नीतिर्मतिर्मम॥","yatra yogeśhvaraḥ kṛiṣhṇo yatra pārtho dhanur-dharaḥ\ntatra śhrīr vijayo bhūtir dhruvā nītir matir mama"]];

const SYNC_CHUNK=80000,SYNC_MAXP=40;

async function push(){
  if(NATIVE){nativePush();return}
  if(!remote) return; if(writing){pending=true;return}
  const json=JSON.stringify(state),parts=Math.ceil(json.length/SYNC_CHUNK);
  if(parts>SYNC_MAXP){setSync('big');return}
  writing=true;
  try{
    /* large diaries are split across several documents so the khata and cash book keep syncing as they grow */
    if(parts<=1)await remote.set({json,updatedAt:state.updatedAt,parts:0});
    else{for(let i=0;i<parts;i++)await remotePart(i).set({json:json.slice(i*SYNC_CHUNK,(i+1)*SYNC_CHUNK),updatedAt:state.updatedAt});
      await remote.set({json:'',parts,updatedAt:state.updatedAt})}
    setSync('ok')}catch(e){setSync('err')}

let syncMode='device',savedAt=Date.now();

function paintSync(){
  const el=document.getElementById('sync');if(!el)return;
  el.className='sync'+(syncMode==='ok'?' ok':'');

  const ago=s<10?'saved just now':s<60?`saved ${s}s ago`:s<3600?`saved ${Math.round(s/60)} min ago`:`saved ${Math.round(s/3600)} hr ago`;
  el.querySelector('span').textContent=(syncMode==='ok'?'Account':syncMode==='big'?'This device only — too large to sync':'This device')+' · '+ago;
}

  if(timed.length)return {tag:'Now',icon:'⏰',title:timed[0][0].title,sub:`Due at ${timed[0][0].time} — do it until it's done`,id:timed[0][0].id};

  if(pr)return {tag:'Focus',icon:'🎯',title:pr.t,sub:next?`Next block: ${next.name} at ${next.start}`:'Your top priority for today',late:late.length};

/* ---------- Gantt chart (Plan → Gantt) ---------- */
function gSpan(t){const a=t.start||t.date||'',b=t.end||t.date||t.start||'';if(!a&&!b)return null;const s=a||b,e=b||a;return s<=e?[s,e]:[e,s]}
function vGantt(){
  autoLinkMaps();
  const T=today(),zoom=ui.gZoom||'month';
  const DW={week:46,month:26,quarter:9}[zoom],span={week:14,month:35,quarter:98}[zoom];
  const base=addDays(parseDk(T),-Math.round(span*.2)+(ui.gOff||0)*Math.round(span*.6));
  const days=[...Array(span)].map((_,i)=>dk(addDays(base,i))),d0=days[0],dN=days[span-1],W=span*DW;
  const dx=s=>Math.round((parseDk(s)-parseDk(d0))/864e5);
  const bar=(s,e,cls,label,attrs,prog)=>{
    if(e<d0||s>dN)return `<button class="g-off ${s>dN?'r':'l'}" ${attrs}>${s>dN?prettyDate(s)+' ›':'‹ '+prettyDate(e)}</button>`;
    const a=Math.max(0,dx(s)),b=Math.min(span-1,dx(e)),w=(b-a+1)*DW,narrow=w<90;
    return `<button class="g-bar ${cls}${narrow?' narrow':''}${s<d0?' cut-l':''}${e>dN?' cut-r':''}" style="left:${a*DW+2}px;width:${w-4}px" ${attrs}>${prog!=null?`<i class="g-prog" style="width:${prog}%"></i>`:''}<span>${esc(label)}</span></button>`;
  };
  const status=(t,sp)=>t.done?'done':sp[1]<T?'late':sp[0]<=T?'now':'next';
  const showDone=!!ui.showDone,tiX=days.indexOf(T),anyX=tiX>=0?tiX*DW+DW+6:8;
  const active=state.projects.filter(p=>!p.arch);
  const groups=[...active.map(p=>({p,tasks:state.tasks.filter(t=>t.proj===p.id)})),{p:null,tasks:state.tasks.filter(t=>!t.proj||!active.some(p=>p.id===t.proj))}];
  const taskRow=t=>{
    const sp=gSpan(t),st=sp?status(t,sp):(t.done?'done':'any'),len=sp?dx(sp[1])-dx(sp[0])+1:0;
    const when=sp?`${st==='late'?'Overdue · ':''}${prettyDate(sp[0])}${sp[1]!==sp[0]?' – '+prettyDate(sp[1]):''}${t.time?' · '+esc(t.time):''}`:'Anytime';
    return `<div class="g-row ${t.done?'is-done':''}"><div class="g-name g-task"><button class="check sm ${t.done?'on':''}" data-a="taskDone" data-id="${t.id}" aria-label="Mark ${esc(t.title)} done">${t.done?'✓':''}</button>
      <div class="g-tx"><span class="g-tl"><button class="g-tname ${t.done?'done':''}" data-a="gEdit" data-id="${t.id}">${esc(t.title)}</button></span><small class="${st==='late'?'late':''}">${when}${t.deferred>0&&!t.done?` · deferred ${t.deferred}×`:''}</small></div></div>
      <div class="g-track">${sp?bar(sp[0],sp[1],st,t.title,`data-a="gEdit" data-id="${t.id}" aria-label="${esc(t.title)}"`):`<button class="g-any" style="left:${anyX}px" data-a="gEdit" data-id="${t.id}">Anytime · tap to schedule</button>`}</div></div>`;
  };
  let rows='';
  for(const g of groups){
    const vis=g.tasks.filter(t=>showDone||!t.done);
    if(!g.p&&!vis.length)continue;
    vis.sort((x,y)=>{const a=gSpan(x),b=gSpan(y);if(a&&b)return a[0].localeCompare(b[0]);return a?-1:b?1:0});
    if(g.p){
      const all=g.tasks.length,dn=g.tasks.filter(t=>t.done).length,pc=all?Math.round(dn/all*100):0;
      const sch=g.tasks.map(gSpan).filter(Boolean),ps=sch.map(x=>x[0]).sort()[0],pe=sch.map(x=>x[1]).sort().pop();
      const next=g.tasks.find(t=>!t.done);
      rows+=`<div class="g-row g-proj"><div class="g-name"><b>📁 ${esc(g.p.name)}</b><small>${dn}/${all} done · ${pc}%${next?'':' · <span class="late">no next action</span>'}</small>
        <div class="g-pacts"><button class="link" data-a="projMenu" data-id="${g.p.id}" aria-label="More for ${esc(g.p.name)}">⋯ More</button></div></div>
        <div class="g-track">${ps?bar(ps,pe,'proj',`${g.p.name} · ${pc}%`,'tabindex="-1"',pc):'<span class="g-off l">Add dates to see the project bar</span>'}</div></div>`;
      rows+=vis.map(taskRow).join('');

function parseQuick(raw){
  let txt=' '+raw+' ',proj='',date='',end='',time='';const T=parseDk(today()),low=()=>txt.toLowerCase();
  const ps=[...state.projects.filter(p=>!p.arch)].sort((a,b)=>b.name.length-a.name.length);
  for(const p of ps){const re=new RegExp('#'+p.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'[\\s_-]*'),'i');if(re.test(txt)){proj=p.id;txt=txt.replace(re,' ');break}}
  if(!proj){const m=txt.match(/#([\w-]+)/);if(m){const p=ps.find(p=>p.name.toLowerCase().replace(/\s+/g,'').startsWith(m[1].toLowerCase().replace(/[_-]/g,'')));if(p){proj=p.id;txt=txt.replace(m[0],' ')}}}
  let m=txt.match(/\b(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/i);
  if(m){let hh=+m[1]%12;if(/pm/i.test(m[3]))hh+=12;time=`${pad(hh)}:${m[2]||'00'}`;txt=txt.replace(m[0],' ')}
  else if((m=txt.match(/\b(?:at\s+)?([01]?\d|2[0-3]):([0-5]\d)\b/))){time=`${pad(+m[1])}:${m[2]}`;txt=txt.replace(m[0],' ')}
  const MON=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'],WD=['sun','mon','tue','wed','thu','fri','sat'];
  const dateRe='(today|tomorrow|tmrw|day after tomorrow|next week|(?:next\\s+)?(?:sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues?|wed|thu(?:rs?)?|fri|sat)\\b|\\d{1,2}[\\/.-]\\d{1,2}(?:[\\/.-]\\d{2,4})?|\\d{1,2}\\s*(?:january|february|march|april|june|july|august|september|october|november|december|jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)\\b|(?:january|february|march|april|june|july|august|september|october|november|december|jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)\\s*\\d{1,2}\\b)';
  const toDate=w=>{w=w.toLowerCase().trim();let d=null;
    if(w==='today')d=T;else if(w==='tomorrow'||w==='tmrw')d=addDays(T,1);else if(w==='day after tomorrow')d=addDays(T,2);else if(w==='next week')d=addDays(T,7);
    else if(/^(next\s+)?(sun|mon|tue|wed|thu|fri|sat)/.test(w)){const nx=/^next/.test(w),k=WD.indexOf(w.replace(/^next\s+/,'').slice(0,3));let diff=(k-T.getDay()+7)%7;if(nx&&diff===0)diff=7;d=addDays(T,diff)}
    else if(/^\d{1,2}[\/.-]\d{1,2}/.test(w)){const [a,b,c]=w.split(/[\/.-]/).map(Number);let y=c?(c<100?2000+c:c):T.getFullYear();d=new Date(y,b-1,a);if(!c&&d<addDays(T,-60))d=new Date(y+1,b-1,a)}
    else{const mm=w.match(/(\d{1,2})\s*([a-z]+)|([a-z]+)\s*(\d{1,2})/);if(mm){const dd=+(mm[1]||mm[4]),mo=MON.indexOf((mm[2]||mm[3]).slice(0,3));if(mo>=0){d=new Date(T.getFullYear(),mo,dd);if(d<addDays(T,-60))d=new Date(T.getFullYear()+1,mo,dd)}}}
    return d?dk(d):''};
  let r=new RegExp('\\b(?:from\\s+)?'+dateRe+'\\s*(?:to|till|until|-|–)\\s*'+dateRe+'\\b','i');
  if((m=txt.match(r))){date=toDate(m[1]);end=toDate(m[2]);txt=txt.replace(m[0],' ')}
  else if((m=txt.match(new RegExp('\\b(?:by|before|on)?\\s*'+dateRe+'\\b','i')))){date=toDate(m[1]);txt=txt.replace(m[0],' ')}
  if((m=txt.match(/\b(?:for\s+)?(\d{1,3})\s*(day|days|week|weeks)\b/i))){const n=+m[1]*(/week/i.test(m[2])?7:1);if(!date)date=today();end=dk(addDays(parseDk(date),n-1));txt=txt.replace(m[0],' ')}
  else if((m=txt.match(/\bin\s+(\d{1,3})\s*(day|days|week|weeks)\b/i))){date=dk(addDays(T,+m[1]*(/week/i.test(m[2])?7:1)));txt=txt.replace(m[0],' ')}
  if(time&&!date)date=today();
  if(end&&end<date)[date,end]=[end,date];
  return {title:txt.replace(/\s+/g,' ').trim(),date,end,time,proj};
}

  for(const e of state.ledger) if(e.pid===pid) b+=e.type==='gave'?Number(e.amt):-Number(e.amt);

const mmKids=(m,id)=>m.nodes.filter(n=>n.pid===id);

/* horizontal mind-map layout: branches split left and right of the centre, each subtree stacked in its own band */
const MM_ROW=58,MM_COL=215;
const MM_TYPES={mind:['🧠','Mind map','Branches left and right of the centre'],logic:['➡️','Logic chart','Everything flows to the right'],tree:['🌳','Org tree','Top-down hierarchy'],
  radial:['🌞','Radial','Ideas circle the centre'],timeline:['⏳','Timeline','Steps along a line in order'],fish:['🐟','Fishbone','Causes feed into one effect'],free:['✋','Free canvas','Place ideas anywhere']};
const mmH=n=>n.img?3.2:n.audio?1.3:1;
function mmLayout(m){
  const root=mmRoot(m);if(!root)return;root.x=0;root.y=0;const type=m.type||'mind';if(type==='free'){m.auto=false;return}
  const memo={};const leaves=id=>memo[id]??(memo[id]=(k=>k.length?k.reduce((s,c)=>s+leaves(c.id),0):mmH(mmNode(m,id)))(mmKids(m,id)));
  const kids=mmKids(m,root.id);
  const stack=(n,depth,side,top,xOf)=>{const h=leaves(n.id)*MM_ROW;n.x=side*xOf(depth);n.y=Math.round(top+h/2);let t=top;mmKids(m,n.id).forEach(c=>{stack(c,depth+1,side,t,xOf);t+=leaves(c.id)*MM_ROW})};
  const xm=d=>d===1?MM_COL:MM_COL+(d-1)*185;
  if(type==='mind'){const total=kids.reduce((s,c)=>s+leaves(c.id),0),right=[],left=[];let acc=0;kids.forEach(k=>{(acc<total/2?right:left).push(k);acc+=leaves(k.id)});
    [[right,1],[left,-1]].forEach(([arr,side])=>{const h=arr.reduce((s,c)=>s+leaves(c.id),0)*MM_ROW;let t=-h/2;arr.forEach(c=>{stack(c,1,side,t,xm);t+=leaves(c.id)*MM_ROW})})}
  else if(type==='logic'){const h=kids.reduce((s,c)=>s+leaves(c.id),0)*MM_ROW;let t=-h/2;kids.forEach(c=>{stack(c,1,1,t,xm);t+=leaves(c.id)*MM_ROW})}
  else if(type==='tree'){const W=190,place=(n,depth,left)=>{const w=leaves(n.id)*W;n.x=Math.round(left+w/2);n.y=depth*130;let l=left;mmKids(m,n.id).forEach(c=>{place(c,depth+1,l);l+=leaves(c.id)*W})};
    const w=kids.reduce((s,c)=>s+leaves(c.id),0)*W;let l=-w/2;kids.forEach(c=>{place(c,1,l);l+=leaves(c.id)*W})}
  else if(type==='radial'){const place=(id,a0,a1,depth)=>{const k=mmKids(m,id);if(!k.length)return;const tot=k.reduce((s,c)=>s+leaves(c.id),0);let a=a0;
      k.forEach(c=>{const w=(a1-a0)*leaves(c.id)/tot,mid=a+w/2,r=190+(depth-1)*165;c.x=Math.round(Math.cos(mid)*r*1.1);c.y=Math.round(Math.sin(mid)*r*.9);place(c.id,a,a+w,depth+1);a+=w})};
    place(root.id,-Math.PI/2,Math.PI*1.5,1)}
  else if(type==='timeline'){kids.forEach((c,i)=>{c.x=260+i*230;c.y=0;const up=i%2===0;let t=0;
      const walk=(n,d)=>mmKids(m,n.id).forEach(g=>{t+=mmH(g)*MM_ROW;g.x=c.x+(d-1)*40;g.y=up?-40-t:40+t-MM_ROW+20;walk(g,d+1)});walk(c,1)})}
  else if(type==='fish'){root.x=0;root.y=0;kids.forEach((c,i)=>{const col=Math.floor(i/2),up=i%2===0;c.x=-240-col*260;c.y=up?-190:190;let t=0;
      mmKids(m,c.id).forEach(g=>{t+=1;g.x=c.x+60+t*34;g.y=up?c.y+t*MM_ROW*.9:c.y-t*MM_ROW*.9;const walk=n=>mmKids(m,n.id).forEach(h=>{t+=1;h.x=g.x+170;h.y=up?c.y+t*MM_ROW*.9:c.y-t*MM_ROW*.9;walk(h)});walk(g)})})}
  m.auto=true;
}
function mmNew(tpl,type){
  const t=MM_TEMPLATES[tpl]||MM_TEMPLATES.blank,root={id:uid(),pid:null,text:t.title,x:0,y:0},nodes=[root];
  t.kids.forEach((k,i)=>nodes.push({id:uid(),pid:root.id,text:k,x:0,y:0,color:MM_COLORS[i%MM_COLORS.length]}));
  const m={id:uid(),type:type||'mind',nodes,created:Date.now(),updated:Date.now()};mmLayout(m);return m;
}
function mmPlace(m,parent){
  const kids=mmKids(m,parent.id),root=mmRoot(m);
  let side;if(!parent.pid){const r=kids.filter(k=>k.x>=0).length,l=kids.length-r;side=r<=l?1:-1}else side=parent.x>=root.x?1:-1;
  const same=parent.pid?kids:kids.filter(k=>(k.x>=root.x?1:-1)===side);
  const x=parent.x+side*(parent.pid?185:MM_COL),y=same.length?Math.max(...same.map(k=>k.y))+MM_ROW:parent.y;
  return [Math.round(x),Math.round(y)];
}
function mmAdd(m,parent,text){
  const [x,y]=mmPlace(m,parent),n={id:uid(),pid:parent.id,text,x,y};
  if(!parent.pid)n.color=MM_COLORS[mmKids(m,parent.id).length%MM_COLORS.length];
  m.nodes.push(n);m.updated=Date.now();ui.mmNew=n.id;if(m.auto!==false&&(m.type||'mind')!=='free'){mmLayout(m);mmMount.ease=true}return n;
}
function mmLinks(m){
  const type=m.type||'mind',root=mmRoot(m);let s='';
  if(type==='timeline'&&root){const k=mmKids(m,root.id),end=k.length?Math.max(...k.map(c=>c.x))+80:260;s+=`<path d="M${root.x} ${root.y}H${end}" stroke="var(--line)" stroke-width="8" stroke-linecap="round"/><path d="M${end-10} ${root.y-12}L${end+14} ${root.y}L${end-10} ${root.y+12}" fill="var(--line)"/>`;
    k.forEach(c=>s+=`<circle cx="${c.x}" cy="${root.y}" r="9" fill="${mmColor(m,c)}" stroke="var(--surface)" stroke-width="3"/>`)}
  if(type==='fish'&&root){const k=mmKids(m,root.id),tail=k.length?Math.min(...k.map(c=>c.x))-60:-300;s+=`<path d="M${tail} 0H${root.x}" stroke="var(--forest)" stroke-width="7" stroke-linecap="round"/><path d="M${tail} 0l-34 -30v60z" fill="var(--forest)" opacity=".7"/>`}
  for(const n of m.nodes){if(!n.pid)continue;const p=mmNode(m,n.pid);if(!p)continue;const d=mmDepth(m,n),mx=(p.x+n.x)/2,my=(p.y+n.y)/2;
    let path=`M${p.x} ${p.y}C${mx} ${p.y},${mx} ${n.y},${n.x} ${n.y}`;
    if(type==='tree')path=`M${p.x} ${p.y}C${p.x} ${my},${n.x} ${my},${n.x} ${n.y}`;
    else if(type==='radial')path=`M${p.x} ${p.y}L${n.x} ${n.y}`;
    else if(type==='timeline')path=d===1?`M${n.x} ${p.y}L${n.x} ${p.y}`:`M${p.x} ${p.y}C${p.x} ${my},${n.x} ${my},${n.x} ${n.y}`;
    else if(type==='fish')path=d===1?`M${n.x} ${n.y}L${n.x+200} 0`:`M${p.x+(n.y-p.y)*.2} ${n.y}L${n.x} ${n.y}`;
    s+=`<path ${n.id===ui.mmNew?'class="new" pathLength="1"':''} d="${path}" fill="none" stroke="${mmColor(m,n)}" stroke-width="${d===1?6:d===2?3.5:2.4}" stroke-linecap="round" opacity=".85"/>`}
  return s;
}

function shareText(txt,phone){
  const ph=String(phone||'').replace(/\D/g,''),num=ph.length===10?'91'+ph:ph;
  if(NATIVE&&NATIVE.share&&!num){NATIVE.share(txt);return}
  if(num){window.open(`https://wa.me/${num}?text=${encodeURIComponent(txt)}`,'_blank');return}
  if(navigator.share){navigator.share({text:txt}).catch(()=>{});return}
  window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`,'_blank');
}

/* ---------- patterns: the app learns from your own history ---------- */
function insights(){
  const out=[],T=parseDk(today());
  const logged=Object.keys(state.habitLog).filter(d=>Object.values(state.habitLog[d]||{}).some(Boolean)).sort();
  if(logged.length>=10){
    const first=parseDk(logged[0]),W=['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'];
    for(const h of state.habits){const miss=Array(7).fill(0),seen=Array(7).fill(0);let done=0,tot=0;
      for(let i=1;i<=56;i++){const d=addDays(T,-i);if(d<first)break;const k=dk(d),wd=d.getDay();seen[wd]++;tot++;if(habitDone(k,h.id))done++;else miss[wd]++}
      if(tot<14)continue;const rate=done/tot;let worst=-1,wr=0;for(let w=0;w<7;w++)if(seen[w]>=3&&miss[w]/seen[w]>wr){wr=miss[w]/seen[w];worst=w}
      if(worst>=0&&wr>=.7&&rate>=.4)out.push({k:'habit',icon:h.icon,text:`You usually miss ${h.name} on ${W[worst]} (${Math.round(wr*100)}%). Plan it earlier that day.`,score:wr});
      else if(rate>=.9&&tot>=21)out.push({k:'habit',icon:'🔥',text:`${h.name} is solid — ${Math.round(rate*100)}% over ${tot} days.`,score:.5});
    }
  }
  const dn=state.tasks.filter(t=>t.done&&t.doneAt&&t.date);
  if(dn.length>=5){const late=dn.map(t=>Math.round((new Date(t.doneAt).setHours(0,0,0,0)-parseDk(t.date))/864e5));const avg=late.reduce((s,x)=>s+x,0)/late.length;
    if(avg>=1)out.push({k:'slip',icon:'⏳',text:`Tasks usually finish ${avg.toFixed(1)} days after their date. New dates get a hint to add buffer.`,score:.8,days:Math.round(avg)});
    else out.push({k:'slip',icon:'🎯',text:`You finish tasks on time — ${Math.round(late.filter(x=>x<=0).length/late.length*100)}% by their date.`,score:.4});}
  const hrs=state.tasks.filter(t=>t.done&&t.doneAt).map(t=>new Date(t.doneAt).getHours());
  if(hrs.length>=8){const c=Array(24).fill(0);hrs.forEach(h=>{c[h]++;c[(h+1)%24]+=.5});const best=c.indexOf(Math.max(...c));out.push({k:'time',icon:'⚡',text:`You get most done around ${best%12||12}${best<12?' am':' pm'}. Put deep work there.`,score:.6})}
  const mk=today().slice(0,7),prev=dk(addDays(parseDk(mk+'-01'),-1)).slice(0,7),cat=(m)=>{const o={};state.cash.filter(c=>c.type==='out'&&c.date.startsWith(m)).forEach(c=>o[c.cat]=(o[c.cat]||0)+Number(c.amt));return o};
  const a=cat(mk),b=cat(prev);for(const k in a)if(b[k]&&a[k]>b[k]*1.5&&a[k]-b[k]>=1000)out.push({k:'money',icon:'💸',text:`${k} spending is ${INR(a[k])} this month vs ${INR(b[k])} last month.`,score:.7});
  const js=japaStreak();if(js>=7)out.push({k:'japa',icon:'📿',text:`${js}-day japa streak. हर हर महादेव.`,score:.5});
  return out.sort((x,y)=>y.score-x.score);
}

function mmLeaves(m,n){const kids=m.nodes.filter(x=>x.pid===n.id);return kids.length?kids.flatMap(k=>mmLeaves(m,k)):[n]}

/* ---------- ✨ read a mind map and turn it into a project plan ---------- */
const MAP_KINDS=[
  ['goal',/\b(goals?|aims?|objectives?|purpose|vision|mission|why)\b/i],
  ['budget',/\b(budget|costs?|price|pricing|margins?|money|expenses?|revenue|profit|funds?)\b|₹/i],
  ['note',/\b(problems?|pain|customers?|audience|market|users?|who|insights?|context|background|pros|cons|strengths?|weakness(es)?|opportunit(y|ies)|threats?|notes?|ideas?|references?|links?|inspiration|misc)\b/i],
  ['milestone',/\b(milestones?|deadlines?|launch|phases?|stages?)\b/i],
  ['find',/\b(unknowns?|questions?|doubts?|research|explore|find out|learn)\b/i],
  ['risk',/\b(risks?|challenges?|concerns?|issues?)\b/i],
  ['buy',/\b(parts?|materials?|buy|purchase|shopping|components?|tools?|equipment|supplies)\b/i],
  ['channel',/\b(channels?|platforms?|marketing|social|promotion|distribution)\b/i],
  ['make',/\b(products?|offers?|services?|content|features?|deliverables?)\b/i],
  ['task',/\b(tasks?|to ?do|steps?|actions?|work|plan|process)\b/i]];
const KIND_LABEL={find:'To find out',risk:'Risks to handle',buy:'To get',make:'To create',task:'Tasks',channel:'To set up',milestone:'Milestones'};
const KIND_PREFIX={buy:[/^(buy|get|order|arrange|purchase)\b/i,'Get '],find:[/\?$|^find/i,'Find out: '],risk:[/^(plan|handle|avoid|reduce)\b/i,'Plan for: '],channel:[/^(set ?up|start|open|post)\b/i,'Set up '],make:[/^(make|create|build|write|design)\b/i,'Create: '],milestone:[/^🏁/,'🏁 ']};
function mapPlan(m){
  const root=mmRoot(m),out={name:(root.text||'New project').trim(),goal:[],budget:[],notes:[],items:[]};
  const clean=t=>String(t||'').replace(/\s+/g,' ').trim();
  for(const br of m.nodes.filter(n=>n.pid===root.id)){
    const kind=(MAP_KINDS.find(([,re])=>re.test(br.text))||['task'])[0],kids=m.nodes.filter(n=>n.pid===br.id),leaves=kids.length?mmLeaves(m,br):[];
    if(kind==='goal'){leaves.forEach(n=>out.goal.push(clean(n.text)));continue}
    if(kind==='budget'){leaves.forEach(n=>out.budget.push(clean(n.text)));continue}
    if(kind==='note'){if(leaves.length)out.notes.push([clean(br.text),leaves.map(n=>clean(n.text))]);continue}
    const list=kids.length?leaves:(kind==='task'&&!/^tasks?$/i.test(br.text.trim())?[br]:[]);
    for(const n of list){
      if(n.task&&state.tasks.some(t=>t.id===n.task))continue;
      const q=parseQuick(n.text);let title=clean(q.title||n.text);const pf=KIND_PREFIX[kind];
      if(pf&&!pf[0].test(title))title=pf[1]+title;
      out.items.push({node:n,kind,title,start:q.date||'',end:q.end||q.date||'',time:q.time||''});
    }
  }
  const order={find:0,risk:1,buy:2,make:3,task:3,channel:4,milestone:5};out.items.sort((a,b)=>order[a.kind]-order[b.kind]);
  return out;
}

function sprintLeft(){if(!ui.sprint)return '';const s=Math.max(0,Math.ceil((ui.sprint.end-Date.now())/1000));return `${Math.floor(s/60)}:${pad(s%60)}`}
function mmFitView(m,st){
  const r=st.getBoundingClientRect();let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const n of m.nodes){x0=Math.min(x0,n.x-95);x1=Math.max(x1,n.x+95);y0=Math.min(y0,n.y-30);y1=Math.max(y1,n.y+30)}
  const z=Math.max(.3,Math.min(1.15,Math.min((r.width-40)/(x1-x0),(r.height-70)/(y1-y0))));
  return {z,x:-((x0+x1)/2)*z,y:-((y0+y1)/2)*z};
}
function mmMount(){
  const st=document.getElementById('mmStage'),layer=document.getElementById('mmLayer'),m=curMap();if(!st||!m)return;
  if(!ui.mmView[m.id])ui.mmView[m.id]=mmFitView(m,st);
  const V=ui.mmView[m.id];
  const apply=()=>{const r=st.getBoundingClientRect();layer.style.transform=`translate(${r.width/2+V.x}px,${r.height/2+V.y}px) scale(${V.z})`};
  apply();ui.mmNew=null;
  if(mmMount.ease){layer.classList.add('ease');void layer.offsetWidth;mmMount.ease=false;setTimeout(()=>layer.classList.remove('ease'),600)}
  const zoomAt=(cx,cy,nz)=>{nz=Math.max(.25,Math.min(2.6,nz));const r=st.getBoundingClientRect(),ox=cx-r.left-r.width/2,oy=cy-r.top-r.height/2;
    const wx=(ox-V.x)/V.z,wy=(oy-V.y)/V.z;V.z=nz;V.x=ox-wx*nz;V.y=oy-wy*nz;apply()};
  const pts=new Map();let drag=null,pinch=null;
  st.addEventListener('pointerdown',e=>{
    try{st.setPointerCapture(e.pointerId)}catch(_){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){const[a,b]=[...pts.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:V.z};if(drag&&drag.el)drag.el.classList.remove('dragging');drag=null;return}
    const el=e.target.closest('.mm-node'),n=el&&mmNode(m,el.dataset.id);
    drag={el,n,sx:e.clientX,sy:e.clientY,ox:n?n.x:V.x,oy:n?n.y:V.y,moved:false,play:e.target.closest('[data-play]')};
    if(!n)st.classList.add('grab');
  });
  st.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch&&pts.size>=2){const[a,b]=[...pts.values()];zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.z*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d);return}
    if(!drag)return;const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
    if(!drag.moved&&Math.hypot(dx,dy)<5)return;
    if(!drag.moved){drag.moved=true;if(drag.el)drag.el.classList.add('dragging')}
    if(drag.n){drag.n.x=Math.round(drag.ox+dx/V.z);drag.n.y=Math.round(drag.oy+dy/V.z);drag.el.style.left=drag.n.x+'px';drag.el.style.top=drag.n.y+'px';
      /* children travel with their parent */
      if(!drag.kids){drag.kids=[];const walk=id=>mmKids(m,id).forEach(k=>{drag.kids.push({k,x:k.x,y:k.y,el:st.querySelector(`.mm-node[data-id="${k.id}"]`)});walk(k.id)});walk(drag.n.id)}
      for(const c of drag.kids){c.k.x=Math.round(c.x+dx/V.z);c.k.y=Math.round(c.y+dy/V.z);if(c.el){c.el.style.left=c.k.x+'px';c.el.style.top=c.k.y+'px'}}
      document.getElementById('mmLinks').innerHTML=mmLinks(m);}
    else{V.x=drag.ox+dx;V.y=drag.oy+dy;apply()}
  });
  const end=e=>{
    pts.delete(e.pointerId);st.classList.remove('grab');
    if(pinch){if(pts.size<2)pinch=null;return}
    if(!drag)return;const d=drag;drag=null;
    if(d.el)d.el.classList.remove('dragging');
    if(d.moved){if(d.n){m.auto=false;m.updated=Date.now();saveLazy();SFX.play('tick')}return}
    if(e.type==='pointercancel')return;
    if(d.play){playMedia(d.play.dataset.play,d.play);return}
    if(d.n){const now=Date.now(),dbl=mmMount.last&&mmMount.last.id===d.n.id&&now-mmMount.last.t<380;mmMount.last={id:d.n.id,t:now};
      if(dbl){ui.mmSel=d.n.id;A.mmEdit();return}
      if(ui.mmSel!==d.n.id){ui.mmSel=d.n.id;SFX.play('tick');render()}}
    else if(ui.mmSel){ui.mmSel=null;render()}
  };
  st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
  st.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,V.z*Math.exp(-e.deltaY*.0016))},{passive:false});
}

const EX_KINDS=[['walk','🚶','Walk','min'],['gym','🏋️','Gym','min'],['yoga','🧘','Yoga','min'],['surya','☀️','Surya namaskar','rounds'],['run','🏃','Run','min'],['sport','🏸','Sport','min'],['stretch','🤸','Stretch','min']];
function EX(){if(!state.ex)state.ex={log:{},goal:30};if(!state.ex.log)state.ex.log={};return state.ex}
function exMin(e){return e.kind==='surya'?Math.round((+e.n||0)*0.5):(+e.n||0)}
function exDayMin(d){return ((state.ex&&state.ex.log[d])||[]).reduce((s,e)=>s+exMin(e),0)}
function exStreak(){let n=0,d=new Date();if(!exDayMin(today()))d=addDays(d,-1);while(exDayMin(dk(d))>0){n++;d=addDays(d,-1)}return n}
function exHabit(){return state.habits.find(h=>/workout|exercise|gym|walk|yoga/i.test(h.name))}
function vExercise(){
  const T=today(),X=EX(),goal=+X.goal||30,m=exDayMin(T),pc=Math.min(100,Math.round(m/goal*100)),list=X.log[T]||[];
  const kind=ui.exKind||'walk',K=EX_KINDS.find(k=>k[0]===kind);
  const week=[...Array(7)].map((_,i)=>{const d=addDays(new Date(),i-6),k=dk(d);return [DAYS[d.getDay()].slice(0,2),exDayMin(k),k===T]});
  const wk=week.reduce((s,w)=>s+w[1],0),mx=Math.max(goal,...week.map(w=>w[1])),wh=exHabit();

    <div class="ex-txt"><h2>${pc>=100?'Body offered 🙏':m?'Keep moving':'Move today'}</h2><p class="small muted" lang="sa">शरीरमाद्यं खलु धर्मसाधनम्</p>
    <p class="small" style="margin-top:6px"><b>${exStreak()}</b> day streak · <b>${wk}</b> min this week${wh?` · ${habitDone(T,wh.id)?'✓ '+esc(wh.name)+' done':esc(wh.name)+' ticks itself'}`:''}</p></div></section>
  <div class="sec-head"><h2>Log exercise</h2></div>
  <div class="card"><div class="cats" style="margin-top:0">${EX_KINDS.map(([k,i,l])=>`<button class="${k===kind?'on':''}" data-a="exKind" data-v="${k}">${i} ${l}</button>`).join('')}</div>

    ${(K[3]==='rounds'?[6,12,24,108]:[10,20,30,45]).map(v=>`<button class="btn sm" data-a="exPreset" data-v="${v}">${v}</button>`).join('')}</div>

  html+=`<div class="sec-head"><h2>This week</h2><span class="small muted">Goal ${goal} min/day · <button class="link" data-a="exGoal">change</button></span></div>
  <div class="card ex-week">${week.map(([l,v,t],i)=>`<div class="${t?'t':''}"><span>${v||''}</span><i style="height:${Math.round(v/mx*72)}%;--i:${i}" class="${v>=goal?'ok':''}"></i><small>${l}</small></div>`).join('')}</div>`;

/* ---------- Lab (Saraswati): build projects — items, stock, images, cost, sale, theory, notes ---------- */
const LAB_STATUS=[['idea','💡 Idea'],['build','🔧 Building'],['test','🧪 Testing'],['done','✅ Done'],['sold','💰 Selling']];
function LAB(){if(!state.lab)state.lab={projects:[],stock:[]};state.lab.projects=state.lab.projects||[];state.lab.stock=state.lab.stock||[];return state.lab}
const labNorm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9ऀ-ॿ]+/g,' ').trim();
function labStock(name){return LAB().stock.find(x=>labNorm(x.name)===labNorm(name))}
function labCost(p){return (p.items||[]).reduce((s,i)=>s+(+i.qty||0)*(+i.rate||0),0)}
function labSales(p){return (p.sales||[]).reduce((s,x)=>s+(+x.amt||0),0)}
function labNeed(i){const st=labStock(i.name),have=st?+st.qty||0:0,need=Math.max(0,(+i.qty||0)-(+i.used||0)-have);return {have,need,st}}
function vLab(){
  const L=LAB(),sub=ui.labSub||'projects';
  if(ui.labId&&L.projects.some(p=>p.id===ui.labId))return vLabProject(L.projects.find(p=>p.id===ui.labId));

  if(sub==='projects'){
    const P=L.projects,cost=P.reduce((s,p)=>s+labCost(p),0),sale=P.reduce((s,p)=>s+labSales(p),0);
    html+=`<div class="stats" style="margin-top:12px"><div class="stat"><span>Projects</span><b>${P.length}</b></div><div class="stat"><span>Spent</span><b class="neg">${INR(cost)}</b></div><div class="stat"><span>Sales</span><b class="pos">${INR(sale)}</b></div></div>
    <div class="card" style="margin-top:12px"><div class="row" style="gap:8px"><input class="field" id="labName" placeholder="New lab project, e.g. Tie-dye machine"><button class="btn green" data-a="labNew">Add</button></div></div>`;
    html+=P.length?P.slice().reverse().map(p=>{const st=LAB_STATUS.find(s=>s[0]===p.status)||LAB_STATUS[0],c=labCost(p),sl=labSales(p),short=(p.items||[]).filter(i=>labNeed(i).need>0).length;
      return `<button class="card lab-card" data-a="labOpen" data-id="${p.id}">${p.images&&p.images[0]?`<img data-media="${p.images[0]}" alt="">`:`<span class="lab-ph">🔬</span>`}
      <span class="lab-c"><b>${esc(p.name)}</b><span class="pill">${st[1]}</span><span class="small muted">${(p.items||[]).length} items${short?` · <b class="neg">${short} to buy</b>`:''} · cost ${INR(c)}${sl?` · sale ${INR(sl)} · <b class="${sl-c>=0?'pos':'neg'}">${sl-c>=0?'+':'−'}${INR(Math.abs(sl-c))}</b>`:''}</span></span><span class="go">›</span></button>`}).join('')
      :`<div class="empty" style="margin-top:12px">Your workshop notebook. Add a project to track parts, stock, photos, cost, sales, theory and notes.</div>`;
  }
  if(sub==='stock'){
    html+=`<div class="card" style="margin-top:12px"><div class="row" style="gap:6px;flex-wrap:wrap"><input class="field" id="stN" placeholder="Item, e.g. NEMA 17 motor" style="flex:2 1 150px"><input class="field" id="stQ" type="number" inputmode="decimal" placeholder="Qty" style="flex:1 1 60px"><input class="field" id="stU" placeholder="Unit" style="flex:1 1 60px"><input class="field" id="stR" type="number" inputmode="decimal" placeholder="₹ each" style="flex:1 1 70px"></div>
    <button class="btn green block" style="margin-top:8px" data-a="stAdd">Add to stock</button></div>`;
    const S=L.stock.slice().sort((a,b)=>a.name.localeCompare(b.name)),val=S.reduce((s,x)=>s+(+x.qty||0)*(+x.rate||0),0);
    html+=S.length?`<div class="sec-head"><h2>In stock</h2><span class="small muted">${S.length} items · worth ${INR(val)}</span></div><div class="card">${S.map(x=>{const used=L.projects.filter(p=>(p.items||[]).some(i=>labNorm(i.name)===labNorm(x.name))).map(p=>p.name);
      return `<div class="item"><div class="t"><div class="ttl">${esc(x.name)}</div><div class="meta"><span>${x.rate?INR(+x.rate)+' each':''}</span>${used.length?`<span>for ${esc(used.join(', '))}</span>`:''}</div></div>

  }
  return html;
}

/* ---------- merge data from Lath Pocket (Cardputer) ---------- */
function mergePocket(p){
  const n={parties:0,ledger:0,cash:0,habit:0,beads:0};
  const idMap={};
  for(const pp of (p.parties||[])){
    const nm=String(pp.name||'').trim().toLowerCase();
    const ex=state.parties.find(x=>x.id===pp.id)||state.parties.find(x=>String(x.name||'').trim().toLowerCase()===nm);
    if(ex){idMap[pp.id]=ex.id}
    else{state.parties.push({id:pp.id,name:pp.name||'Party',place:pp.place||'',phone:pp.phone||'',open:Number(pp.open)||0});idMap[pp.id]=pp.id;n.parties++}
  }
  for(const e of (p.ledger||[])){if(state.ledger.some(x=>x.id===e.id))continue;state.ledger.push({id:e.id,pid:idMap[e.pid]||e.pid,type:e.type,amt:Number(e.amt)||0,date:e.date,note:e.note||''});n.ledger++}
  for(const c of (p.cash||[])){if(state.cash.some(x=>x.id===c.id))continue;state.cash.push({id:c.id,type:c.type,amt:Number(c.amt)||0,date:c.date,cat:c.cat||'Other',note:c.note||''});n.cash++}
  for(const c of (p.counts||[])){if(!state.counts.some(x=>x.id===c.id))state.counts.push(c)}
  for(const [d,o] of Object.entries(p.habitLog||{}))for(const [h,v] of Object.entries(o||{}))if(v){state.habitLog[d]=state.habitLog[d]||{};if(!state.habitLog[d][h]){state.habitLog[d][h]=true;n.habit++}}
  for(const [d,o] of Object.entries(p.japa||{}))for(const [m,v] of Object.entries(o||{})){state.japa[d]=state.japa[d]||{};const cur=Number(state.japa[d][m])||0,val=Number(v)||0;if(val>cur){n.beads+=val-cur;state.japa[d][m]=val}}
  return n;
}

async function readRemote(snap){
  const d = snap.data(); if (!d) return null;

  if (d.parts > 0){ json = ''; for (let i = 0; i < d.parts; i++){ const p = await getDoc(partRef(i)); json += (p.data() || {}).json || ''; } }
  try { return json ? JSON.parse(json) : null; } catch(e){ return null; }
}
async function pull(snap){
  const d = snap.exists() ? snap.data() : null;
  if (!d || !(d.updatedAt > (state.updatedAt || 0))) return false;
  const r = await readRemote(snap); if (!r) return false;
  state = migrate(r); saveLocal(); try { render(); } catch(e){}
  return true;
}

    const du = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
    const b64 = du.slice(du.indexOf(',') + 1), parts = Math.ceil(b64.length / CH), id = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    for (let i = 0; i < parts; i++) await setDoc(doc(fs, 'diaries', uid, 'media', id, 'chunks', String(i)), {d: b64.slice(i*CH, (i+1)*CH)});
    await setDoc(doc(fs, 'diaries', uid, 'media', id), {type: blob.type || 'application/octet-stream', parts, size: blob.size, at: Date.now()});
    return {id};
  },
  delete: async (id) => {
    if (!uid) return; const m = await getDoc(doc(fs, 'diaries', uid, 'media', id)).catch(() => null);
    const n = m && m.exists() ? (m.data().parts || 0) : 0;
    for (let i = 0; i < n; i++) deleteDoc(doc(fs, 'diaries', uid, 'media', id, 'chunks', String(i))).catch(() => {});
    deleteDoc(doc(fs, 'diaries', uid, 'media', id)).catch(() => {});
  }
};
window.DIARY_MEDIA = async (id) => {
  if (!uid) return null;
  try {
    const m = await getDoc(doc(fs, 'diaries', uid, 'media', id)); if (!m.exists()) return null;
    const {type, parts} = m.data(); let b64 = '';
    for (let i = 0; i < parts; i++){ const c = await getDoc(doc(fs, 'diaries', uid, 'media', id, 'chunks', String(i))); b64 += (c.data() || {}).d || ''; }
    const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return new Blob([a], {type});
  } catch(e){ return null; }
};

/* saving a file (backup, CSV): phones get the share sheet ("Save to Files"), computers a download */
window.DIARY_DOWNLOADS = { save: ({filename, data}) => new Promise((resolve, reject) => {
  const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith('.csv') ? 'text/csv' : 'application/json'});
  const kb = blob.size / 1024, size = kb > 1024 ? (kb/1024).toFixed(1) + ' MB' : Math.max(1, Math.round(kb)) + ' KB';
  const w = document.createElement('div');
  w.style.cssText = 'position:fixed;inset:0;z-index:320;display:grid;place-items:center;padding:16px;background:rgba(10,25,16,.6)';
  w.innerHTML = `<div class="card" style="width:min(380px,100%);display:grid;gap:10px"><h3>File ready</h3><p class="small"><b>${h(filename)}</b> · ${size}</p><p class="small muted">On iPhone, choose <b>Save to Files</b> on the next screen.</p><div class="yn"><button class="btn" data-x="no">Cancel</button><button class="btn primary" data-x="go">Save file</button></div></div>`;
  document.body.appendChild(w);
  w.addEventListener('click', async e => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    if (b.dataset.x === 'no'){ w.remove(); reject(new Error('declined')); return; }
    const file = new File([blob], filename, {type: blob.type});
    try {
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file]});
      else { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); }
      w.remove(); resolve({status:'saved'});
    } catch(x){ w.remove(); reject(x); }
  });
})};

/* who is signed in decides whose diary is shown */
onAuthStateChanged(auth, async user => {
  if (unsub){ unsub(); unsub = null; }
  if (!user){ uid = null; remote = null; remotePart = null; window.DIARY_USER = null; show('signin'); return; }
  show('loading');
  uid = user.uid; window.DIARY_USER = user.email;
  let owner = null; try { owner = localStorage.getItem('lathdiary.owner'); } catch(e){}
  if (owner !== uid){
    // a different person on this device: start from a clean diary, never show someone else's
    state = migrate(defaults()); state.updatedAt = 0;
    const nm = (user.email || '').split('@')[0].replace(/[._\d]+/g, ' ').trim();
    state.name = (user.email||'').toLowerCase() === 'ankurlath83@gmail.com' ? 'Ankur' : (nm ? nm.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ') : 'Friend');
    try { localStorage.setItem('lathdiary.owner', uid); } catch(e){}
    saveLocal();
  }
  remote = { set: o => setDoc(mainRef(), o) };
  remotePart = i => ({ set: o => setDoc(partRef(i), o) });
  try {
    const snap = await getDoc(mainRef());
    const got = await pull(snap);
    if (!got && (state.updatedAt || 0) > ((snap.exists() && snap.data().updatedAt) || 0)) push();
    setSync('ok');
  } catch(e){ setSync('err'); }
  gate.style.display = 'none';
  try { render(); } catch(e){}
  // changes made on another phone or computer appear here by themselves
  unsub = onSnapshot(mainRef(), s => { if (!s.metadata.hasPendingWrites) pull(s).then(ch => { if (ch) toast('Updated from your other device'); }); });
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
