<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lath Diary</title>
<meta name="theme-color" content="#17402C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lath Diary">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&family=Noto+Serif+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --forest:#17402C; --leaf:#3E8E41; --leaf-2:#7DBB5A; --saffron:#EE7A12; --marigold:#FFB547;
  --bg:#F5F7EF; --surface:#FFFFFF; --surface-2:#EDF3E6; --peach:#FFF0DF; --ink:#1B2A20; --muted:#5E6E62; --line:#DCE5D4;
  --on-accent:#FFFFFF; --shadow:0 1px 0 rgba(23,64,44,.06), 0 6px 18px -10px rgba(23,64,44,.25);
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A13; --surface:#15261C; --surface-2:#1B3024; --peach:#2E2112; --ink:#E8F0E6; --muted:#9DB0A1; --line:#27402F;
    --forest:#9FD58A; --leaf:#6FBF5B; --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A13; --surface:#15261C; --surface-2:#1B3024; --peach:#2E2112; --ink:#E8F0E6; --muted:#9DB0A1; --line:#27402F;
  --forest:#9FD58A; --leaf:#6FBF5B; --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 20px -12px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);padding-bottom:88px}
img{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--saffron);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;color:var(--forest)}
.brand b span{color:var(--saffron)}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--marigold);display:inline-block}
.sync.ok i{background:var(--leaf)}

/* sections */
section{margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.sec-head h2{font-size:1.2rem}

/* hero */
.hero{background:linear-gradient(180deg,var(--peach),var(--surface) 70%);border:1px solid var(--line);border-radius:28px;padding:18px 16px 16px;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(1.7rem,6.5vw,2.3rem);font-weight:800;color:var(--forest)}
.hero .date{color:var(--muted);margin-top:2px}
.arc{display:block;width:100%;height:auto;margin-top:6px}
.now{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.now .tag{font-size:.75rem;font-weight:700;color:var(--on-accent);background:var(--saffron);padding:3px 9px;border-radius:99px;white-space:nowrap}
.now .tag.next{background:var(--leaf)}
.warn{font-size:.85rem;color:var(--muted);margin-top:4px}
.warn b{color:var(--saffron)}

/* buttons */
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--saffron);color:#fff}
.btn.green{background:var(--leaf);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:.86rem;border-radius:10px}
.btn.block{width:100%}
.btn.big{padding:15px 18px;font-size:1.05rem;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.link{background:none;border:0;color:var(--leaf);font-weight:700;padding:4px}
.x{background:none;border:0;color:var(--muted);font-size:1.1rem;padding:4px 8px;border-radius:8px}

/* inputs */
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px}
textarea.field{min-height:84px;resize:vertical;line-height:1.45}
label.lbl{display:block;font-size:.84rem;font-weight:600;color:var(--muted);margin:10px 2px 5px}

/* chips/habits */
.habit-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chip{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;min-height:52px}
.chip .em{font-size:1.25rem}
.chip.on{border-color:var(--leaf);background:var(--surface-2)}
.chip.on .nm::after{content:" ✓";color:var(--leaf);font-weight:800}
.chip .nm{font-weight:600;font-size:.92rem;line-height:1.25}
.score{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--forest)}
.score small{font-size:.9rem;color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--marigold));border-radius:99px}

/* priorities */
.prio{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center}
.prio + .prio{margin-top:8px}
.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--display);border:2px solid var(--saffron);color:var(--saffron);background:transparent}
.num.done{background:var(--leaf);border-color:var(--leaf);color:#fff}

/* segmented */
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:14px;margin-top:16px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 10px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--forest);box-shadow:var(--shadow)}

/* month grid */
.grid-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface)}
table.hg{border-collapse:separate;border-spacing:0;font-size:.8rem}
table.hg th,table.hg td{padding:0;text-align:center;border-bottom:1px solid var(--line)}
table.hg th.hn,table.hg td.hn{position:sticky;left:0;background:var(--surface);text-align:left;padding:6px 10px;min-width:132px;max-width:150px;border-right:1px solid var(--line);z-index:1;font-weight:600;line-height:1.2}
table.hg thead th{font-weight:700;color:var(--muted);height:30px;min-width:30px}
table.hg thead th.today{color:var(--saffron)}
table.hg td.c{width:30px;height:34px}
.cell{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);background:transparent;padding:0;display:block;margin:auto}
.cell.on{background:var(--leaf);border-color:var(--leaf)}
.cell.today{border-color:var(--saffron)}
.cell.future{opacity:.35}
table.hg tr.sc td{font-weight:800;color:var(--forest);height:30px;border-bottom:0}
.weeks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.wk{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;background:var(--surface)}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--forest)}
.pill.o{background:var(--peach);color:var(--saffron)}
.pill.b{background:var(--saffron);color:#fff}

/* 100 days */
.hundred{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.hd{aspect-ratio:1;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:.62rem;color:var(--muted);display:grid;place-items:center;padding:0}
.hd.l1{background:#FFE3C2;border-color:#FFD29E;color:#8a4a07}
.hd.l2{background:#FFC98A;border-color:#FFB547;color:#6d3905}
.hd.l3{background:#B7DB9C;border-color:#8CC46A;color:#1d4a1f}
.hd.l4{background:var(--leaf);border-color:var(--leaf);color:#fff}
.hd.cur{outline:2.5px solid var(--saffron);outline-offset:1px}
.hd.sel{outline:2.5px solid var(--forest);outline-offset:1px}
.hd.fut{opacity:.45}

/* lists */
.item{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.check{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--leaf);background:transparent;display:grid;place-items:center;color:#fff;font-weight:800;padding:0;margin-top:1px}
.check.on{background:var(--leaf)}
.item .t{flex:1;min-width:0}
.item .t .ttl{font-weight:600;overflow-wrap:anywhere}
.item.done .ttl{text-decoration:line-through;color:var(--muted)}
.meta{font-size:.8rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.badge{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--peach);color:var(--saffron)}
.badge.g{background:var(--surface-2);color:var(--leaf)}
.acts{display:flex;gap:4px;flex:none}
.empty{padding:14px;border:1.5px dashed var(--line);border-radius:var(--r-md);color:var(--muted);text-align:center;font-size:.92rem}

/* blocks */
.blk{display:grid;grid-template-columns:8px 1fr auto;gap:12px;align-items:stretch;padding:12px 0;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0}
.blk .stripe{border-radius:99px}
.blk.live{background:linear-gradient(90deg,var(--peach),transparent);border-radius:12px;padding-left:6px}
.blk .when{font-family:var(--display);font-weight:700;text-align:right;white-space:nowrap;font-size:.95rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.84rem;margin-top:4px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.bedit{display:flex;gap:8px;margin-top:8px}
.bedit input{max-width:130px}

/* goals */
.goal{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);overflow:hidden}
.goal + .goal{margin-top:10px}
.goal>button{width:100%;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:12px 14px}
.goal .gi{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:1.3rem}
.goal .gbody{padding:0 14px 14px;border-top:1px solid var(--line)}
.smarter{display:grid;grid-template-columns:34px 1fr;gap:10px;margin-top:12px;align-items:start}
.smarter .L{width:34px;height:34px;border-radius:10px;background:var(--forest);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;margin-top:22px}
.smarter .L.o{background:var(--saffron);color:#fff}
.yn{display:flex;gap:6px}
.yn button{flex:1}
.yn .on{background:var(--leaf);color:#fff}
input[type=range]{width:100%;accent-color:var(--saffron)}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--saffron) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:.78rem;font-weight:800}

/* books & wisdom */
.book{display:grid;grid-template-columns:58px 1fr;gap:14px}
.spine{height:84px;border-radius:6px 10px 10px 6px;display:flex;align-items:flex-end;padding:6px;color:#fff;font-family:var(--display);font-weight:800;font-size:.7rem;line-height:1.1;box-shadow:inset 5px 0 0 rgba(0,0,0,.15)}
.facts{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.idea{padding-left:14px;position:relative;font-size:.92rem}
.idea::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--saffron)}
.idea + .idea{margin-top:4px}
.jp{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.jp:last-child{border-bottom:0}
.kanji{font-size:1.25rem;font-weight:700;color:var(--saffron);text-align:center;line-height:1.2;align-self:center}
.lesson{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lesson:last-child{border-bottom:0}
.verse{padding:12px 0;border-bottom:1px solid var(--line)}
.verse:last-child{border-bottom:0}
.verse .dev{font-size:1.05rem;line-height:1.85;margin:7px 0 4px}
.verse .idea{margin-top:8px}
.lesson .n{font-family:var(--display);font-weight:800;color:var(--leaf);font-size:1.05rem}
.quote{background:linear-gradient(135deg,#17402C,#0C2B1C);color:#F2EFE2;border-radius:var(--r-lg);padding:16px}
.quote h3{color:var(--marigold);font-size:.95rem;margin-bottom:6px}
.quote p{font-family:var(--display);font-size:1.12rem;font-weight:500;line-height:1.35}

/* money */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:11px}
.stat b{font-family:var(--display);font-size:1.02rem;display:block;margin-top:2px;overflow-wrap:anywhere}
.stat span{font-size:.76rem;color:var(--muted)}
.pos{color:var(--leaf)} .neg{color:#C8452F}
.amt{font-family:var(--display);font-weight:800;white-space:nowrap}
.den{display:grid;grid-template-columns:62px 1fr 96px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.den:last-of-type{border-bottom:0}
.den .dn{font-family:var(--display);font-weight:800;color:var(--forest);font-size:1.02rem}
.den .dn small{display:block;font-size:.66rem;color:var(--muted);font-weight:600}
.stepper{display:flex;gap:6px;align-items:center;justify-content:center}
.stepper button{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);font-weight:800;font-size:1.1rem;padding:0}
.stepper input{width:58px;text-align:center;padding:8px 4px;min-height:36px}
.den .tot{text-align:right;font-weight:700;color:var(--muted)}
.den.has .tot{color:var(--ink)}
.grand{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:12px;border-top:2px solid var(--forest)}
.grand b{font-family:var(--display);font-size:1.7rem;color:var(--forest)}
.typeset{display:flex;gap:6px}
.typeset button{flex:1}
.typeset .btn.give{background:#C8452F;color:#fff}.typeset .btn.get{background:var(--leaf);color:#fff}
.typeset .on.give{background:#C8452F;color:#fff}
.typeset .on.get{background:var(--leaf);color:#fff}
.cats{display:flex;flex-wrap:wrap;gap:8px;padding-bottom:4px;margin-top:10px}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.84rem;font-weight:600;white-space:nowrap;flex:0 0 auto;min-height:38px;padding:7px 14px;color:var(--ink)}
.cats button.on{background:var(--forest);color:var(--bg);border-color:var(--forest)}
.day-head{font-size:.78rem;font-weight:700;color:var(--muted);padding:10px 0 2px}

/* nav — base (phone): bottom bar. Declared BEFORE the screen-size rules so the side rail can override it */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{position:relative;background:none;border:0;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.62rem;font-weight:700;color:var(--muted);transition:color .2s,background-color .25s}
nav.tabs button svg{width:24px;height:24px;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
nav.tabs button.on{color:var(--saffron)}
nav.tabs button.on svg{transform:translateY(-2px) scale(1.1)}
nav.tabs button::after{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--saffron),var(--marigold));transform:scaleX(0);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
nav.tabs button.on::after{transform:scaleX(1)}

/* ---------- Galaxy Z Fold and other dual-size screens ---------- */
/* cover screen: very narrow */
@media (max-width:372px){
  .wrap{padding:0 12px}
  body{font-size:15px}
  .hero{padding:16px 13px 14px;border-radius:22px}
  .card{padding:14px;border-radius:19px}
  .habit-chips{grid-template-columns:1fr}
  .stats{gap:6px}
  .stat{padding:9px}
  .stat b{font-size:.88rem}
  .stat span{font-size:.7rem}
  .seg button{padding:8px 6px;font-size:.84rem}
  .den{grid-template-columns:52px 1fr 82px;gap:6px}
  .stepper button{width:32px;height:32px}
  .stepper input{width:46px}
  .weeks{gap:6px}
  .wk{padding:10px}
  .book{grid-template-columns:44px 1fr;gap:10px}
  nav.tabs button{font-size:.53rem;gap:2px;padding:8px 0 9px;letter-spacing:-.01em}
  nav.tabs button svg{width:19px;height:19px}
  .beadring{width:180px;height:180px}
  .beadring>span{width:154px;height:154px}
  .beadring .n{font-size:2.6rem}
  .toast{bottom:calc(78px + env(safe-area-inset-bottom,0px))}
}
/* main screen unfolded: nav becomes a side rail */
@media (min-width:620px){
  body{padding-bottom:28px;padding-left:96px}
  .wrap{max-width:1160px;margin:0 auto;padding:0 26px}
  nav.tabs{top:0;bottom:0;right:auto;width:96px;border-top:0;border-right:1px solid var(--line);
    background:linear-gradient(180deg,var(--surface) 0%,var(--surface-2) 100%);
    display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
  nav.tabs .in{display:flex;flex-direction:column;gap:6px;width:100%;max-width:none;margin:auto 0;padding:14px 10px}
  nav.tabs button{width:100%;padding:12px 4px;font-size:.72rem;border-radius:16px}
  nav.tabs button svg{width:26px;height:26px}
  nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
  nav.tabs button.on{background:var(--peach);color:var(--saffron)}
  nav.tabs button.on svg{transform:scale(1.12)}
  nav.tabs button::after{top:24%;bottom:24%;left:-10px;right:auto;width:4px;height:auto;border-radius:0 4px 4px 0;background:linear-gradient(180deg,var(--saffron),var(--marigold));transform:scaleY(0)}
  nav.tabs button.on::after{transform:scaleY(1)}
  .toast{left:calc(50% + 48px);bottom:28px}
  .weeks{grid-template-columns:repeat(4,1fr)}
  .habit-chips{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}
  .hero h1{font-size:2.2rem}
  .arc{max-width:520px;margin-inline:auto}
  .scrim{align-items:center}
  .hundred{gap:7px}
}
/* wide enough for two columns: unfolded landscape, desktop */
@media (min-width:780px){
  #view{columns:2;column-gap:24px}
  #view>*{break-inside:avoid-column}
  .hero,.seg,.book{column-span:all}
  .sec-head{break-after:avoid-column;break-inside:avoid-column}

.g-card{padding:0;overflow:hidden}

.alt-mala .cnt b{display:block;font:700 clamp(2rem,9vw,2.6rem)/1 "Rajdhani",var(--display);color:var(--amber);text-shadow:0 0 14px rgba(238,122,18,.55);font-variant-numeric:tabular-nums}
.alt-mala .cnt b small{color:#E0E6E8;font-size:.62em;font-weight:600;text-shadow:none}
.alt-mala .cnt b .n{font:inherit;color:inherit}
.alt-mala .cnt>span{font:600 .95rem "Rajdhani",var(--body);color:#C9D2D6}
.alt-mala:active svg{transform:scale(.985)}
.alt-dnr{margin:12px 14px;border:1.5px solid rgba(0,230,118,.5);border-radius:4px;padding:10px 10px 12px;text-align:center;position:relative;box-shadow:inset 0 0 18px rgba(0,230,118,.1)}
.alt-dnr canvas{width:100%;height:44px;display:block}
.alt-dnr b{position:absolute;left:50%;top:10px;transform:translateX(-50%);font:700 1.9rem/44px "Rajdhani",var(--display);color:var(--tulsi);text-shadow:0 0 12px rgba(0,230,118,.6);padding:0 8px;background:rgba(18,26,30,.9)}
.alt-dnr p{font:600 .9rem/1.2 "Rajdhani",var(--body);letter-spacing:.06em;color:var(--tulsi);text-transform:uppercase;margin-top:6px}
.alt-dnr.idle{border-color:rgba(255,255,255,.18)}.alt-dnr.idle b,.alt-dnr.idle p{color:#8FA3AD;text-shadow:none}
.alt-stats{padding:4px 16px 12px}
.alt-stats div{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font:600 1.05rem "Rajdhani",var(--body);color:#D5DEE2}
.alt-stats div:last-child{border-bottom:0}
.alt-stats b{color:var(--tulsi);font-size:1.15rem;font-variant-numeric:tabular-nums}
.alt-who{margin-top:12px;border:1px solid rgba(255,255,255,.1);background:rgba(14,20,25,.92);border-radius:6px;padding:12px 14px}
.alt-whohd{display:flex;justify-content:space-between;align-items:center;font:700 .9rem "Rajdhani",var(--body);letter-spacing:.08em;color:#80DEEA}
.altar .who{background:transparent;border:0;box-shadow:none;padding:0}
.alt-pop{position:absolute;z-index:6;pointer-events:none;font:700 1rem/1.1 "Rajdhani",var(--display);color:var(--amber);text-align:center;transform:translate(-50%,-100%);text-shadow:0 0 10px rgba(238,122,18,.7);white-space:nowrap}
.alt-pop b{display:block;font-size:2em;color:#FFE29A}
@media (min-width:900px){
  .altar{column-span:all}
  .alt-grid{grid-template-columns:1fr 310px}
  .alt-right{padding:16px 18px 18px 0}
  .alt-left{padding:20px 20px 0 24px}
}
@media (max-width:372px){.alt-ctl .row1{font-size:.9rem}.alt-bar{padding:9px 12px;font-size:.7rem}}
/* motion */
.alt-spin{transform-box:view-box;transform-origin:300px 255px}
.alt-flame{transform-box:fill-box;transform-origin:50% 100%}
@media (prefers-reduced-motion: no-preference){
  html:not(.calm) .altar:not(.still) .alt-spin.a{animation:spin 90s linear infinite}
  html:not(.calm) .altar:not(.still) .alt-spin.b{animation:spin 140s linear infinite reverse}
  html:not(.calm) .altar:not(.still) .alt-flame{animation:altFl 1.1s ease-in-out infinite alternate}
  html:not(.calm) .altar:not(.still) .alt-flame:nth-of-type(2n){animation-duration:.8s;animation-delay:-.3s}
  html:not(.calm) .altar:not(.still) .alt-flame:nth-of-type(3n){animation-duration:1.4s;animation-delay:-.6s}
  html:not(.calm) .altar:not(.still) .alt-beam{animation:altBeam 3.4s ease-in-out infinite alternate}
  html:not(.calm) .altar:not(.still) .alt-core{animation:altCore 4s ease-in-out infinite}
  html:not(.calm) .altar:not(.still) .alt-hood{animation:altHood 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
  html:not(.calm) .altar:not(.still) .alt-inv{animation:altInv 2.6s ease-in-out infinite}
  .alt-pop{animation:altPop 1.6s cubic-bezier(.22,1,.36,1) forwards}
  html:not(.calm) .alt-leaf-new{animation:altLand .6s cubic-bezier(.34,1.56,.64,1)}
}
@keyframes altFl{from{transform:scale(1,.82) skewX(-4deg);opacity:.75}to{transform:scale(.92,1.12) skewX(4deg);opacity:1}}
@keyframes altBeam{from{opacity:.35}to{opacity:.85}}
@keyframes altCore{50%{opacity:.6}}
@keyframes altHood{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) translateY(-2px)}}
@keyframes altInv{50%{box-shadow:0 0 28px rgba(244,196,48,.55),0 0 40px rgba(0,230,118,.4),inset 0 0 14px rgba(0,230,118,.4)}}
@keyframes altPop{0%{opacity:0;margin-top:10px}15%{opacity:1}75%{opacity:1}100%{opacity:0;margin-top:-34px}}
@keyframes altLand{from{opacity:0}}

/* media shelf */

/* ================= Sacred Sci-Fi theme (layer on top of dark) ================= */
:root.scifi[data-theme="dark"]{
  --bg:#04080A; --surface:#0B1519; --surface-2:#122229; --peach:#24170A; --ink:#E4F1EC; --muted:#8FA6AE; --line:#24363A;
  --forest:#F4C430; --leaf:#00C85A; --leaf-2:#00E676; --saffron:#FF7A12; --marigold:#F4C430;
  --sf-gold:#F4C430; --sf-green:#00E676; --sf-teal:#5FE3D0;
  --shadow:0 0 0 1px rgba(0,0,0,.35),0 12px 28px -16px rgba(0,0,0,.9);
  color-scheme:dark;
}
html.scifi body{background:
  radial-gradient(1.2px 1.2px at 12% 18%,rgba(200,240,255,.7),transparent 60%),
  radial-gradient(1px 1px at 72% 34%,rgba(255,230,170,.6),transparent 60%),
  radial-gradient(1.4px 1.4px at 38% 76%,rgba(200,240,255,.5),transparent 60%),
  radial-gradient(1px 1px at 88% 82%,rgba(160,255,200,.55),transparent 60%),
  radial-gradient(circle at 18% 22%,rgba(255,122,18,.10),transparent 38%),
  radial-gradient(circle at 82% 30%,rgba(0,200,90,.09),transparent 40%),
  radial-gradient(circle at 50% 110%,rgba(95,227,208,.08),transparent 50%),
  #04080A;background-attachment:fixed}
html.scifi .wrap{position:relative;z-index:1}
html.scifi h1,html.scifi h2,html.scifi h3,html.scifi .score,html.scifi .stat b,html.scifi .grand b,html.scifi .amt{font-family:"Rajdhani",var(--display);letter-spacing:.02em}
html.scifi h2{font-weight:700}
html.scifi .sec-head h2{text-transform:uppercase;letter-spacing:.08em;color:var(--sf-gold);text-shadow:0 0 12px rgba(244,196,48,.35);font-size:1.1rem}
html.scifi .sec-head h2::before{content:"◈ ";color:var(--sf-green);text-shadow:0 0 8px rgba(0,230,118,.6)}
html.scifi .brand b{color:#F4C430;font-family:"Rajdhani",var(--display);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 10px rgba(244,196,48,.4)}
html.scifi .brand b span{color:var(--sf-green);text-shadow:0 0 10px rgba(0,230,118,.5)}
html.scifi .brand svg{filter:drop-shadow(0 0 8px rgba(255,122,18,.5))}
html.scifi .icon-btn{background:rgba(10,20,24,.85);border-color:rgba(244,196,48,.35);color:var(--sf-gold);box-shadow:0 0 12px -4px rgba(244,196,48,.4)}

/* HUD glass panels with gold corner brackets */
html.scifi .card,html.scifi .goal,html.scifi .stat,html.scifi .wk,html.scifi .tpl,html.scifi .grid-scroll,html.scifi .now,html.scifi .fun-hero,html.scifi .deity-card,html.scifi .mm-wrap{
  --bk:rgba(244,196,48,.85);
  background:
   linear-gradient(var(--bk),var(--bk)) top left/14px 1.5px no-repeat,linear-gradient(var(--bk),var(--bk)) top left/1.5px 14px no-repeat,
   linear-gradient(var(--bk),var(--bk)) top right/14px 1.5px no-repeat,linear-gradient(var(--bk),var(--bk)) top right/1.5px 14px no-repeat,
   linear-gradient(var(--bk),var(--bk)) bottom left/14px 1.5px no-repeat,linear-gradient(var(--bk),var(--bk)) bottom left/1.5px 14px no-repeat,
   linear-gradient(var(--bk),var(--bk)) bottom right/14px 1.5px no-repeat,linear-gradient(var(--bk),var(--bk)) bottom right/1.5px 14px no-repeat,
   linear-gradient(160deg,rgba(15,27,32,.94),rgba(6,11,14,.96));
  border:1px solid rgba(95,227,208,.17);border-radius:12px;
  box-shadow:0 0 0 1px rgba(0,0,0,.35),0 14px 30px -18px rgba(0,0,0,.9),inset 0 0 26px rgba(0,230,118,.035)}
html.scifi .mm-wrap{background:radial-gradient(circle,rgba(95,227,208,.16) 1.1px,transparent 1.4px) 0 0/24px 24px,linear-gradient(160deg,#0B161A,#05090C)}
html.scifi .stat span{text-transform:uppercase;letter-spacing:.08em;font-size:.68rem}
html.scifi .stat b{color:var(--sf-green);text-shadow:0 0 10px rgba(0,230,118,.35);font-size:1.15rem}
html.scifi .goal .gi{background:rgba(244,196,48,.1);box-shadow:inset 0 0 0 1px rgba(244,196,48,.3)}
html.scifi .deity-card{overflow:hidden}
html.scifi .deity-cap b{color:var(--sf-gold);font-family:"Rajdhani",var(--display);letter-spacing:.06em;text-transform:uppercase}

/* hero */
html.scifi .hero{border-radius:16px;border:1px solid rgba(244,196,48,.4);
  background:radial-gradient(circle at 85% 0%,rgba(255,122,18,.22),transparent 45%),radial-gradient(circle at 0% 100%,rgba(0,200,90,.16),transparent 45%),linear-gradient(160deg,#0E1A1F,#05090C);
  box-shadow:0 0 30px -12px rgba(255,122,18,.45),inset 0 0 30px rgba(244,196,48,.05)}
html.scifi .hero h1{color:var(--sf-gold);text-transform:uppercase;letter-spacing:.04em;text-shadow:0 0 16px rgba(244,196,48,.45)}
html.scifi .quote{background:radial-gradient(circle at 100% 0,rgba(0,230,118,.14),transparent 50%),linear-gradient(135deg,#0E1F18,#05090C);border:1px solid rgba(0,230,118,.35);box-shadow:0 0 22px -10px rgba(0,230,118,.5)}
html.scifi .shrine{background:radial-gradient(circle at 50% 18%,rgba(255,181,71,.25),transparent 45%),linear-gradient(165deg,#0E2A1C,#04080A);border:1px solid rgba(244,196,48,.45);box-shadow:0 0 30px -10px rgba(255,122,18,.4)}

/* segmented controls & chips */
html.scifi .seg{background:rgba(6,12,15,.85);border:1px solid rgba(244,196,48,.25);border-radius:10px}
html.scifi .seg button{color:#8FA6AE;font-family:"Rajdhani",var(--body);font-size:1.02rem;letter-spacing:.04em;border-radius:7px}
html.scifi .seg button.on{background:linear-gradient(180deg,rgba(0,200,90,.24),rgba(0,200,90,.07));color:var(--sf-green);box-shadow:inset 0 0 0 1px rgba(0,230,118,.55),0 0 14px -2px rgba(0,230,118,.35);text-shadow:0 0 8px rgba(0,230,118,.5)}
html.scifi .chip{background:rgba(9,17,21,.9);border-color:rgba(95,227,208,.18);border-radius:10px}
html.scifi .chip.on{background:linear-gradient(135deg,rgba(0,200,90,.2),rgba(9,17,21,.9));border-color:var(--sf-green);box-shadow:0 0 14px -4px rgba(0,230,118,.55)}
html.scifi .cats button{background:rgba(9,17,21,.9);border-color:rgba(95,227,208,.2);color:var(--ink)}
html.scifi .cats button.on{background:rgba(244,196,48,.16);color:var(--sf-gold);border-color:var(--sf-gold);box-shadow:0 0 12px -3px rgba(244,196,48,.5)}
html.scifi .pill{background:rgba(0,200,90,.12);color:var(--sf-green);box-shadow:inset 0 0 0 1px rgba(0,230,118,.3)}
html.scifi .pill.o,html.scifi .badge{background:rgba(255,122,18,.13);color:#FFB547;box-shadow:inset 0 0 0 1px rgba(255,122,18,.3)}

/* buttons & inputs */
html.scifi .btn{background:rgba(18,34,41,.95);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(95,227,208,.18);border-radius:10px}
html.scifi .btn.primary{background:linear-gradient(135deg,#FF8A1E,#C2410C);color:#fff;box-shadow:0 0 18px -4px rgba(255,122,18,.65),inset 0 0 0 1px rgba(255,214,130,.45)}
html.scifi .btn.green{background:linear-gradient(135deg,#00C85A,#0A7A3A);color:#fff;box-shadow:0 0 18px -4px rgba(0,230,118,.6),inset 0 0 0 1px rgba(160,255,200,.35)}
html.scifi .btn.ghost{background:transparent;border:1px solid rgba(244,196,48,.35);box-shadow:none}
html.scifi .btn.on,html.scifi .yn .on{background:linear-gradient(135deg,#00C85A,#0A7A3A);color:#fff}
html.scifi .field{background:rgba(3,8,10,.85);border-color:rgba(95,227,208,.22);color:var(--ink);border-radius:9px}
html.scifi .field:focus{outline:none;border-color:var(--sf-green);box-shadow:0 0 0 3px rgba(0,230,118,.15),0 0 14px -4px rgba(0,230,118,.5)}
html.scifi .link{color:var(--sf-green)}
html.scifi .num{border-color:var(--saffron);color:#FFB547;box-shadow:0 0 10px -3px rgba(255,122,18,.6)}
html.scifi .num.done,html.scifi .check.on,html.scifi .cell.on{box-shadow:0 0 10px -2px rgba(0,230,118,.7)}
html.scifi .bar{background:rgba(255,255,255,.06)}
html.scifi .bar>i{box-shadow:0 0 10px rgba(0,230,118,.5)}
html.scifi table.hg th.hn,html.scifi table.hg td.hn{background:#0B1519}

/* nav */
html.scifi nav.tabs{background:rgba(4,8,10,.94);border-color:rgba(244,196,48,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 -6px 24px -10px rgba(244,196,48,.25)}
html.scifi nav.tabs button{color:#7E949C;font-family:"Rajdhani",var(--body);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}

html.scifi .empty{border-color:rgba(95,227,208,.2)}
html.scifi .who{border-color:rgba(244,196,48,.4)}

/* fixed decorative HUD layer */
.sf-deco{display:none}
html.scifi .sf-deco{display:block;position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sf-frame{position:absolute;inset:6px;border:1px solid rgba(244,196,48,.28);border-radius:14px}
.sf-frame::before,.sf-frame::after{content:"";position:absolute;width:44px;height:44px;border:2px solid rgba(244,196,48,.75)}
.sf-frame::before{top:-1px;left:-1px;border-width:2px 0 0 2px;border-radius:14px 0 0 0}
.sf-frame::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0;border-radius:0 0 14px 0}
.sf-title{position:absolute;top:0;left:50%;transform:translateX(-50%);padding:5px 34px 6px;font:700 .78rem/1 "Rajdhani",sans-serif;letter-spacing:.2em;color:#F4C430;text-transform:uppercase;white-space:nowrap;
  background:linear-gradient(180deg,#0A1216,#05090B);border:1px solid rgba(244,196,48,.55);border-top:0;clip-path:polygon(0 0,100% 0,94% 100%,6% 100%);text-shadow:0 0 10px rgba(244,196,48,.5)}
.sf-yantra{position:absolute;width:190px;height:190px;opacity:.16}
.sf-yantra.a{top:40px;right:-30px}.sf-yantra.b{bottom:70px;left:-40px}
.sf-yantra.g{color:#00E676}.sf-yantra.o{color:#F4C430}
.sf-rail{position:absolute;top:50%;writing-mode:vertical-rl;font-family:"Noto Serif Devanagari",serif;font-weight:700;font-size:1.05rem;letter-spacing:.3em;color:rgba(244,196,48,.55);text-shadow:0 0 10px rgba(255,122,18,.45);transform:translateY(-50%);display:none}
.sf-rail.r{right:12px}.sf-rail.l{left:108px;transform:translateY(-50%) rotate(180deg)}
.sf-om{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-family:"Noto Serif Devanagari",serif;font-size:1.3rem;color:#F4C430;text-shadow:0 0 12px rgba(255,122,18,.7);display:none}
.sf-star{position:absolute;width:2px;height:2px;border-radius:50%;background:#CFF6FF}

वेषु यथाभागमवस्थिताः।\nभीष्ममेवाभिरक्षन्तु भवन्तः सर्व एव हि॥","ayaneṣhu cha sarveṣhu yathā-bhāgamavasthitāḥ\nbhīṣhmamevābhirakṣhantu bhavantaḥ sarva eva hi"],[1,12,"तस्य संजनयन्हर्षं कुरुवृद्धः पितामहः।\nसिंहनादं विनद्योच्चैः शङ्खं दध्मौ प्रतापवान्॥","tasya sañjanayan harṣhaṁ kuru-vṛiddhaḥ pitāmahaḥ\nsiṁha-nādaṁ vinadyochchaiḥ śhaṅkhaṁ dadhmau pratāpavān"],[1,13,"ततः शङ्खाश्च भेर्यश्च पणवानकगोमुखाः।\nसहसैवाभ्यहन्यन्त स शब्दस्तुमुलोऽभवत्॥","tataḥ śhaṅkhāśhcha bheryaśhcha paṇavānaka-gomukhāḥ\nsahasaivābhyahanyanta sa śhabdastumulo ’bhavat"],[1,14,"ततः श्वेतैर्हयैर्युक्ते महति स्यन्दने स्थितौ।\nमाधवः पाण्डवश्चैव दिव्यौ शङ्खौ प्रदध्मतुः॥","tataḥ śhvetairhayairyukte mahati syandane sthitau\nmādhavaḥ pāṇḍavaśhchaiva divyau śhaṅkhau pradadhmatuḥ"],[1,15,"पाञ्चजन्यं हृषीकेशो देवदत्तं धनंजयः।\nपौण्ड्रं दध्मौ महाशङ्खं भीमकर्मा वृकोदरः॥","pāñchajanyaṁ hṛiṣhīkeśho devadattaṁ dhanañjayaḥ\npauṇḍraṁ dadhmau mahā-śhaṅkhaṁ bhīma-karmā vṛikodaraḥ"],[1,16,"अनन्तविजयं राजा कुन्तीपुत्रो युधिष्ठिरः।\nनकुलः सहदेवश्च सुघोषमणिपुष्पकौ॥","anantavijayaṁ rājā kuntī-putro yudhiṣhṭhiraḥ\nnakulaḥ sahadevaśhcha sughoṣha-maṇipuṣhpakau"],[1,17,"काश्यश्च परमेष्वासः शिखण्डी च महारथः।\nधृष्टद्युम्नो विराटश्च सात्यकिश्चापराजितः॥","kāśhyaśhcha parameṣhvāsaḥ śhikhaṇḍī cha mahā-rathaḥ\ndhṛiṣhṭadyumno virāṭaśhcha sātyakiśh chāparājitaḥ"],[1,18,"द्रुपदो द्रौपदेयाश्च सर्वशः पृथिवीपते।\nसौभद्रश्च महाबाहुः शङ्खान्दध्मुः पृथक्पृथक्॥","drupado draupadeyāśhcha sarvaśhaḥ pṛithivī-pate\nsaubhadraśhcha mahā-bāhuḥ śhaṅkhāndadhmuḥ pṛithak pṛithak"],[1,19,"स घोषो धार्तराष्ट्राणां हृदयानि व्यदारयत्।\nनभश्च पृथिवीं चैव तुमुलो व्यनुनादयन्॥","sa ghoṣho dhārtarāṣhṭrāṇāṁ hṛidayāni vyadārayat\nnabhaśhcha pṛithivīṁ chaiva tumulo nunādayan"],[1,20,"अथ व्यवस्थितान् दृष्ट्वा धार्तराष्ट्रान्कपिध्वजः।\nप्रवृत्ते शस्त्रसंपाते धनुरुद्यम्य पाण्डवः॥","atha vyavasthitān dṛiṣhṭvā dhārtarāṣhṭrān kapi-dhwajaḥ\npravṛitte śhastra-sampāte dhanurudyamya pāṇḍavaḥ\nhṛiṣhīkeśhaṁ tadā vākyam idam āha mahī-pate"],[1,21,"अर्जुन उवाच\nहृषीकेशं तदा वाक्यमिदमाह महीपते।\nसेनयोरुभयोर्मध्ये रथं स्थापय मेऽच्युत॥","arjuna uvācha\nsenayor ubhayor madhye rathaṁ sthāpaya me ’chyuta"],[1,22,"यावदेतान्निरीक्षेऽहं योद्धुकामानवस्थितान्।\nकैर्मया सह योद्धव्यमस्मिन्रणसमुद्यमे॥","yāvadetān nirīkṣhe ’haṁ yoddhu-kāmān avasthitān\nkairmayā saha yoddhavyam asmin raṇa-samudyame"],[1,23,"योत्स्यमानानवेक्षेऽहं य एतेऽत्र समागताः।\nधार्तराष्ट्रस्य दुर्बुद्धेर्युद्धे प्रियचिकीर्षवः॥","yotsyamānān avekṣhe ’haṁ ya ete ’tra samāgatāḥ\ndhārtarāṣhṭrasya durbuddher yuddhe priya-chikīrṣhavaḥ"],[1,24,"संजय उवाच\nएवमुक्तो हृषीकेशो गुडाकेशेन भारत।\nसेनयोरुभयोर्मध्ये स्थापयित्वा रथोत्तमम्॥","sañjaya uvācha\nevam ukto hṛiṣhīkeśho guḍākeśhena bhārata\nsenayor ubhayor madhye sthāpayitvā rathottamam"],[1,25,"भीष्मद्रोणप्रमुखतः सर्वेषां च महीक्षिताम्।\nउवाच पार्थ पश्यैतान्समवेतान्कुरूनिति॥","bhīṣhma-droṇa-pramukhataḥ sarveṣhāṁ cha mahī-kṣhitām\nuvācha pārtha paśhyaitān samavetān kurūn iti"],[1,26,"तत्रापश्यत्स्थितान्पार्थः पितृ़नथ पितामहान्।\nआचार्यान्मातुलान्भ्रातृ़न्पुत्रान्पौत्रान्सखींस्तथा॥","tatrāpaśhyat sthitān pārthaḥ pitṝīn atha pitāmahān\nāchāryān mātulān bhrātṝīn putrān pautrān sakhīṁs tathā\nśhvaśhurān suhṛidaśh chaiva senayor ubhayor api"],[1,27,"श्वशुरान्सुहृदश्चैव सेनयोरुभयोरपि।\nतान्समीक्ष्य स कौन्तेयः सर्वान्बन्धूनवस्थितान्॥","tān samīkṣhya sa kaunteyaḥ sarvān bandhūn avasthitān\nkṛipayā parayāviṣhṭo viṣhīdann idam abravīt"],[1,28,"अर्जुन उवाच\nकृपया परयाऽऽविष्टो विषीदन्निदमब्रवीत्।\nदृष्ट्वेमं स्वजनं कृष्ण युयुत्सुं समुपस्थितम्॥","arjuna uvācha\ndṛiṣhṭvemaṁ sva-janaṁ kṛiṣhṇa yuyutsuṁ samupasthitam"],[1,29,"सीदन्ति मम गात्राणि मुखं च परिशुष्यति।\nवेपथुश्च शरीरे मे रोमहर्षश्च जायते॥","sīdanti mama gātrāṇi mukhaṁ cha pariśhuṣhyati\nvepathuśh cha śharīre me roma-harṣhaśh cha jāyate"],[1,30,"गाण्डीवं स्रंसते हस्तात्त्वक्चैव परिदह्यते।\nन च शक्नोम्यवस्थातुं भ्रमतीव च मे मनः॥","gāṇḍīvaṁ sraṁsate hastāt tvak chaiva paridahyate\nna cha śhaknomy avasthātuṁ bhramatīva cha me manaḥ"],[1,31,"निमित्तानि च पश्यामि विपरीतानि केशव।\nन च श्रेयोऽनुपश्यामि हत्वा स्वजनमाहवे॥","nimittāni cha paśhyāmi viparītāni keśhava\nna cha śhreyo ’nupaśhyāmi hatvā sva-janam āhave"],[1,32,"न काङ्क्षे विजयं कृष्ण न च राज्यं सुखानि च।\nकिं नो राज्येन गोविन्द किं भोगैर्जीवितेन वा॥","na kāṅkṣhe vijayaṁ kṛiṣhṇa na cha rājyaṁ sukhāni cha\nkiṁ no rājyena govinda kiṁ bhogair jīvitena vā"],[1,33,"येषामर्थे काङ्क्षितं नो राज्यं भोगाः सुखानि च।\nत इमेऽवस्थिता युद्धे प्राणांस्त्यक्त्वा धनानि च॥","yeṣhām arthe kāṅkṣhitaṁ no rājyaṁ bhogāḥ sukhāni cha\nta ime ’vasthitā yuddhe prāṇāṁs tyaktvā dhanāni cha"],[1,34,"आचार्याः पितरः पुत्रास्तथैव च पितामहाः।\nमातुलाः श्चशुराः पौत्राः श्यालाः सम्बन्धिनस्तथा॥","āchāryāḥ pitaraḥ putrās tathaiva cha pitāmahāḥ\nmātulāḥ śhvaśhurāḥ pautrāḥ śhyālāḥ sambandhinas tathā"],[1,35,"एतान्न हन्तुमिच्छामि घ्नतोऽपि मधुसूदन।\nअपि त्रैलोक्यराज्यस्य हेतोः किं नु महीकृते॥","etān na hantum ichchhāmi ghnato ’pi madhusūdana\napi trailokya-rājyasya hetoḥ kiṁ nu mahī-kṛite"],[1,36,"निहत्य धार्तराष्ट्रान्नः का प्रीतिः स्याज्जनार्दन।\nपापमेवाश्रयेदस्मान्हत्वैतानाततायिनः॥","nihatya dhārtarāṣhṭrān naḥ kā prītiḥ syāj janārdana\npāpam evāśhrayed asmān hatvaitān ātatāyinaḥ"],[1,37,"तस्मान्नार्हा वयं हन्तुं धार्तराष्ट्रान्स्वबान्धवान्।\nस्वजनं हि कथं हत्वा सुखिनः स्याम माधव॥","tasmān nārhā vayaṁ hantuṁ dhārtarāṣhṭrān sa-bāndhavān \nsva-janaṁ hi kathaṁ hatvā sukhinaḥ syāma mādhava"],[1,38,"यद्यप्येते न पश्यन्ति लोभोपहतचेतसः।\nकुलक्षयकृतं दोषं मित्रद्रोहे च पातकम्॥","yady apy ete na paśhyanti lobhopahata-chetasaḥ\nkula-kṣhaya-kṛitaṁ doṣhaṁ mitra-drohe cha pātakam"],[1,39,"कथं न ज्ञेयमस्माभिः पापादस्मान्निवर्तितुम्।\nकुलक्षयकृतं दोषं प्रपश्यद्भिर्जनार्दन॥","kathaṁ na jñeyam asmābhiḥ pāpād asmān nivartitum\nkula-kṣhaya-kṛitaṁ doṣhaṁ prapaśhyadbhir janārdana"],[1,40,"कुलक्षये प्रणश्यन्ति कुलधर्माः सनातनाः।\nधर्मे नष्टे कुलं कृत्स्नमधर्मोऽभिभवत्युत॥","kula-kṣhaye praṇaśhyanti kula-dharmāḥ sanātanāḥ\ndharme naṣhṭe kulaṁ kṛitsnam adharmo ’bhibhavaty uta"],[1,41,"अधर्माभिभवात्कृष्ण प्रदुष्यन्ति कुलस्त्रियः।\nस्त्रीषु दुष्टासु वार्ष्णेय जायते वर्णसङ्करः॥","adharmābhibhavāt kṛiṣhṇa praduṣhyanti kula-striyaḥ\nstrīṣhu duṣhṭāsu vārṣhṇeya jāyate varṇa-saṅkaraḥ"],[1,42,"सङ्करो नरकायैव कुलघ्नानां कुलस्य च।\nपतन्ति पितरो ह्येषां लुप्तपिण्डोदकक्रियाः॥","saṅkaro narakāyaiva kula-ghnānāṁ kulasya cha\npatanti pitaro hy eṣhāṁ lupta-piṇḍodaka-kriyāḥ"],[1,43,"दोषैरेतैः कुलघ्नानां वर्णसङ्करकारकैः।\nउत्साद्यन्ते जातिधर्माः कुलधर्माश्च शाश्वताः॥","doṣhair etaiḥ kula-ghnānāṁ varṇa-saṅkara-kārakaiḥ\nutsādyante jāti-dharmāḥ kula-dharmāśh cha śhāśhvatāḥ"],[1,44,"उत्सन्नकुलधर्माणां मनुष्याणां जनार्दन।\nनरकेऽनियतं वासो भवतीत्यनुशुश्रुम॥","utsanna-kula-dharmāṇāṁ manuṣhyāṇāṁ janārdana\nnarake ‘niyataṁ vāso bhavatītyanuśhuśhruma"],[1,45,"अहो बत महत्पापं कर्तुं व्यवसिता वयम्।\nयद्राज्यसुखलोभेन हन्तुं स्वजनमुद्यताः॥","aho bata mahat pāpaṁ kartuṁ vyavasitā vayam\nyad rājya-sukha-lobhena hantuṁ sva-janam udyatāḥ"],[1,46,"यदि मामप्रतीकारमशस्त्रं शस्त्रपाणयः।\nधार्तराष्ट्रा रणे हन्युस्तन्मे क्षेमतरं भवेत्॥","yadi mām apratīkāram aśhastraṁ śhastra-pāṇayaḥ\ndhārtarāṣhṭrā raṇe hanyus tan me kṣhemataraṁ bhavet"],[1,47,"सञ्जय उवाच\nएवमुक्त्वाऽर्जुनः संख्ये रथोपस्थ उपाविशत्।\nविसृज्य सशरं चापं शोकसंविग्नमानसः॥","sañjaya uvācha\nevam uktvārjunaḥ saṅkhye rathopastha upāviśhat\nvisṛijya sa-śharaṁ chāpaṁ śhoka-saṁvigna-mānasaḥ"],[2,1,"सञ्जय उवाच\nतं तथा कृपयाऽविष्टमश्रुपूर्णाकुलेक्षणम्।\nविषीदन्तमिदं वाक्यमुवाच मधुसूदनः॥","sañjaya uvācha\ntaṁ tathā kṛipayāviṣhṭamaśhru pūrṇākulekṣhaṇam\nviṣhīdantamidaṁ vākyam uvācha madhusūdanaḥ"],[2,2,"श्री भगवानुवाच\nकुतस्त्वा कश्मलमिदं विषमे समुपस्थितम्।\nअनार्यजुष्टमस्वर्ग्यमकीर्तिकरमर्जुन॥","śhrī bhagavān uvācha\nkutastvā kaśhmalamidaṁ viṣhame samupasthitam\nanārya-juṣhṭamaswargyam akīrti-karam arjuna"],[2,3,"क्लैब्यं मा स्म गमः पार्थ नैतत्त्वय्युपपद्यते।\nक्षुद्रं हृदयदौर्बल्यं त्यक्त्वोत्तिष्ठ परन्तप॥","klaibyaṁ mā sma gamaḥ pārtha naitat tvayyupapadyate\nkṣhudraṁ hṛidaya-daurbalyaṁ tyaktvottiṣhṭha parantapa"],[2,4,"अर्जुन उवाच\nकथं भीष्ममहं संख्ये द्रोणं च मधुसूदन।\nइषुभिः प्रतियोत्स्यामि पूजार्हावरिसूदन॥","arjuna uvācha\nkathaṁ bhīṣhmam ahaṁ sankhye droṇaṁ cha madhusūdana\niṣhubhiḥ pratiyotsyāmi pūjārhāvari-sūdana"],[2,5,"गुरूनहत्वा हि महानुभावान्\nश्रेयो भोक्तुं भैक्ष्यमपीह लोके।\nहत्वार्थकामांस्तु गुरूनिहैव\nभुञ्जीय भोगान् रुधिरप्रदिग्धान्॥","gurūnahatvā hi mahānubhāvān\nśhreyo bhoktuṁ bhaikṣhyamapīha loke\nhatvārtha-kāmāṁstu gurūnihaiva\nbhuñjīya bhogān rudhira-pradigdhān"],[2,6,"न चैतद्विद्मः कतरन्नो गरीयो\nयद्वा जयेम यदि वा नो जयेयुः।\nयानेव हत्वा न जिजीविषाम\nस्तेऽवस्थिताः प्रमुखे धार्तराष्ट्राः॥","na chaitadvidmaḥ kataranno garīyo\nyadvā jayema yadi vā no jayeyuḥ\nyāneva hatvā na jijīviṣhāmas\nte ’vasthitāḥ pramukhe dhārtarāṣhṭrāḥ"],[2,7,"कार्पण्यदोषोपहतस्वभावः\nपृच्छामि त्वां धर्मसंमूढचेताः।\nयच्छ्रेयः स्यान्निश्िचतं ब्रूहि तन्मे\nशिष्यस्तेऽहं शाधि मां त्वां प्रपन्नम्॥","kārpaṇya-doṣhopahata-svabhāvaḥ\npṛichchhāmi tvāṁ dharma-sammūḍha-chetāḥ\nyach-chhreyaḥ syānniśhchitaṁ brūhi tanme\nśhiṣhyaste ’haṁ śhādhi māṁ tvāṁ prapannam"],[2,8,"न हि प्रपश्यामि ममापनुद्या\nद्यच्छोकमुच्छोषणमिन्द्रियाणाम्।\nअवाप्य भूमावसपत्नमृद्धम्\nराज्यं सुराणामपि चाधिपत्यम्॥","na hi prapaśhyāmi mamāpanudyād\nyach-chhokam uchchhoṣhaṇam-indriyāṇām\navāpya bhūmāv-asapatnamṛiddhaṁ\nrājyaṁ surāṇāmapi chādhipatyam"],[2,9,"सञ्जय उवाच\nएवमुक्त्वा हृषीकेशं गुडाकेशः परन्तप।\nन योत्स्य इति गोविन्दमुक्त्वा तूष्णीं बभूव ह॥","sañjaya uvācha\nevam-uktvā hṛiṣhīkeśhaṁ guḍākeśhaḥ parantapa\nna yotsya iti govindam uktvā tūṣhṇīṁ babhūva ha"],[2,10,"तमुवाच हृषीकेशः प्रहसन्निव भारत।\nसेनयोरुभयोर्मध्ये विषीदन्तमिदं वचः॥","tam-uvācha hṛiṣhīkeśhaḥ prahasanniva bhārata\nsenayorubhayor-madhye viṣhīdantam-idaṁ vachaḥ"],[2,11,"श्री भगवानुवाच\nअशोच्यानन्वशोचस्त्वं प्रज्ञावादांश्च भाषसे।\nगतासूनगतासूंश्च नानुशोचन्ति पण्डिताः॥","śhrī bhagavān uvācha\naśhochyān-anvaśhochas-tvaṁ prajñā-vādānśh cha bhāṣhase\ngatāsūn-agatāsūnśh-cha nānuśhochanti paṇḍitāḥ"],[2,12,"न त्वेवाहं जातु नासं न त्वं नेमे जनाधिपाः।\nन चैव न भविष्यामः सर्वे वयमतः परम्॥","na tvevāhaṁ jātu nāsaṁ na tvaṁ neme janādhipāḥ\nna chaiva na bhaviṣhyāmaḥ sarve vayamataḥ param"],[2,13,"देहिनोऽस्मिन्यथा देहे कौमारं यौवनं जरा।\nतथा देहान्तरप्राप्तिर्धीरस्तत्र न मुह्यति॥","dehino ’smin yathā dehe kaumāraṁ yauvanaṁ jarā\ntathā dehāntara-prāptir dhīras tatra na muhyati"],[2,14,"मात्रास्पर्शास्तु कौन्तेय शीतोष्णसुखदुःखदाः।\nआगमापायिनोऽनित्यास्तांस्तितिक्षस्व भारत॥","mātrā-sparśhās tu kaunteya śhītoṣhṇa-sukha-duḥkha-dāḥ\nāgamāpāyino ’nityās tans-titikṣhasva bhārata"],[2,15,"यं हि न व्यथयन्त्येते पुरुषं पुरुषर्षभ।\nसमदुःखसुखं धीरं सोऽमृतत्वाय कल्पते॥","yaṁ hi na vyathayantyete puruṣhaṁ puruṣharṣhabha\nsama-duḥkha-sukhaṁ dhīraṁ so ’mṛitatvāya kalpate"],[2,16,"नासतो विद्यते भावो नाभावो विद्यते सतः।\nउभयोरपि दृष्टोऽन्तस्त्वनयोस्तत्त्वदर्शिभिः॥","nāsato vidyate bhāvo nābhāvo vidyate sataḥ\nubhayorapi dṛiṣhṭo ’nta stvanayos tattva-darśhibhiḥ"],[2,17,"अविनाशि तु तद्विद्धि येन सर्वमिदं ततम्।\nविनाशमव्ययस्यास्य न कश्चित् कर्तुमर्हति॥","avināśhi tu tadviddhi yena sarvam idaṁ tatam\nvināśham avyayasyāsya na kaśhchit kartum arhati"],[2,18,"अन्तवन्त इमे देहा नित्यस्योक्ताः शरीरिणः।\nअनाशिनोऽप्रमेयस्य तस्माद्युध्यस्व भारत॥","antavanta ime dehā nityasyoktāḥ śharīriṇaḥ\nanāśhino ’prameyasya tasmād yudhyasva bhārata"],[2,19,"य एनं वेत्ति हन्तारं यश्चैनं मन्यते हतम्।\nउभौ तौ न विजानीतो नायं हन्ति न हन्यते॥","ya enaṁ vetti hantāraṁ yaśh chainaṁ manyate hatam\nubhau tau na vijānīto nāyaṁ hanti na hanyate"],[2,20,"न जायते म्रियते वा कदाचि\nन्नायं भूत्वा भविता वा न भूयः।\nअजो नित्यः शाश्वतोऽयं पुराणो\nन हन्यते हन्यमाने शरीरे॥","na jāyate mriyate vā kadāchin\nnāyaṁ bhūtvā bhavitā vā na bhūyaḥ\najo nityaḥ śhāśhvato ’yaṁ purāṇo\nna hanyate hanyamāne śharīre"],[2,21,"वेदाविनाशिनं नित्यं य एनमजमव्ययम्।\nकथं स पुरुषः पार्थ कं घातयति हन्ति कम्॥","vedāvināśhinaṁ nityaṁ ya enam ajam avyayam\nkathaṁ sa puruṣhaḥ pārtha kaṁ ghātayati hanti kam"],[2,22,"वासांसि जीर्णानि यथा विहाय\nनवानि गृह्णाति नरोऽपराणि।\nतथा शरीराणि विहाय जीर्णा\nन्यन्यानि संयाति नवानि देही॥","vāsānsi jīrṇāni yathā vihāya\nnavāni gṛihṇāti naro ’parāṇi\ntathā śharīrāṇi vihāya jīrṇānya\nnyāni sanyāti navāni dehī"],[2,23,"नैनं छिन्दन्ति शस्त्राणि नैनं दहति पावकः।\nन चैनं क्लेदयन्त्यापो न शोषयति मारुतः॥","nainaṁ chhindanti śhastrāṇi nainaṁ dahati pāvakaḥ\nna chainaṁ kledayantyāpo na śhoṣhayati mārutaḥ"],[2,24,"अच्छेद्योऽयमदाह्योऽयमक्लेद्योऽशोष्य एव च।\nनित्यः सर्वगतः स्थाणुरचलोऽयं सनातनः॥","achchhedyo ’yam adāhyo ’yam akledyo ’śhoṣhya eva cha\nnityaḥ sarva-gataḥ sthāṇur achalo ’yaṁ sanātanaḥ"],[2,25,"अव्यक्तोऽयमचिन्त्योऽयमविकार्योऽयमुच्यते।\nतस्मादेवं विदित्वैनं नानुशोचितुमर्हसि॥","avyakto ’yam achintyo ’yam avikāryo ’yam uchyate\ntasmādevaṁ viditvainaṁ nānuśhochitum arhasi"],[2,26,"अथ चैनं नित्यजातं नित्यं वा मन्यसे मृतम्।\nतथापि त्वं महाबाहो नैवं शोचितुमर्हसि॥","atha chainaṁ nitya-jātaṁ nityaṁ vā manyase mṛitam\ntathāpi tvaṁ mahā-bāho naivaṁ śhochitum arhasi"],[2,27,"जातस्य हि ध्रुवो मृत्युर्ध्रुवं जन्म मृतस्य च।\nतस्मादपरिहार्येऽर्थे न त्वं शोचितुमर्हसि॥","jātasya hi dhruvo mṛityur dhruvaṁ janma mṛitasya cha\ntasmād aparihārye ’rthe na tvaṁ śhochitum arhasi"],[2,28,"अव्यक्तादीनि भूतानि व्यक्तमध्यानि भारत।\nअव्यक्तनिधनान्येव तत्र का परिदेवना॥","avyaktādīni bhūtāni vyakta-madhyāni bhārata\navyakta-nidhanānyeva tatra kā paridevanā"],[2,29,"आश्चर्यवत्पश्यति कश्चिदेन\nमाश्चर्यवद्वदति तथैव चान्यः।\nआश्चर्यवच्चैनमन्यः श्रृणोति\nश्रुत्वाप्येनं वेद न चैव कश्चित्॥","āśhcharya-vat paśhyati kaśhchid enan\nāśhcharya-vad vadati tathaiva chānyaḥ\nāśhcharya-vach chainam anyaḥ śhṛiṇoti\nśhrutvāpyenaṁ veda na chaiva kaśhchit"],[2,30,"देही नित्यमवध्योऽयं देहे सर्वस्य भारत।\nतस्मात्सर्वाणि भूतानि न त्वं शोचितुमर्हसि॥","dehī nityam avadhyo ’yaṁ dehe sarvasya bhārata\ntasmāt sarvāṇi bhūtāni na tvaṁ śhochitum arhasi"],[2,31,"स्वधर्ममपि चावेक्ष्य न विकम्पितुमर्हसि।\nधर्म्याद्धि युद्धाछ्रेयोऽन्यत्क्षत्रियस्य न विद्यते॥","swa-dharmam api chāvekṣhya na vikampitum arhasi\ndharmyāddhi yuddhāch chhreyo ’nyat kṣhatriyasya na vidyate"],[2,32,"यदृच्छया चोपपन्नं स्वर्गद्वारमपावृतम्।\nसुखिनः क्षत्रियाः पार्थ लभन्ते युद्धमीदृशम्॥","yadṛichchhayā chopapannaṁ swarga-dvāram apāvṛitam\nsukhinaḥ kṣhatriyāḥ pārtha labhante yuddham īdṛiśham"],[2,33,"अथ चैत्त्वमिमं धर्म्यं संग्रामं न करिष्यसि।\nततः स्वधर्मं कीर्तिं च हित्वा पापमवाप्स्यसि॥","atha chet tvam imaṁ dharmyaṁ saṅgrāmaṁ na kariṣhyasi\ntataḥ sva-dharmaṁ kīrtiṁ cha hitvā pāpam avāpsyasi"],[2,34,"अकीर्तिं चापि भूतानि कथयिष्यन्ति तेऽव्ययाम्।\nसंभावितस्य चाकीर्तिर्मरणादतिरिच्यते॥","akīrtiṁ chāpi bhūtāni\nkathayiṣhyanti te ’vyayām\nsambhāvitasya chākīrtir\nmaraṇād atirichyate"],[2,35,"भयाद्रणादुपरतं मंस्यन्ते त्वां महारथाः।\nयेषां च त्वं बहुमतो भूत्वा यास्यसि लाघवम्॥","bhayād raṇād uparataṁ mansyante tvāṁ mahā-rathāḥ\nyeṣhāṁ cha tvaṁ bahu-mato bhūtvā yāsyasi lāghavam"],[2,36,"अवाच्यवादांश्च बहून् वदिष्यन्ति तवाहिताः।\nनिन्दन्तस्तव सामर्थ्यं ततो दुःखतरं नु किम्॥","avāchya-vādānśh cha bahūn vadiṣhyanti tavāhitāḥ\nnindantastava sāmarthyaṁ tato duḥkhataraṁ nu kim"],[2,37,"हतो वा प्राप्स्यसि स्वर्गं जित्वा वा भोक्ष्यसे महीम्।\nतस्मादुत्तिष्ठ कौन्तेय युद्धाय कृतनिश्चयः॥","hato vā prāpsyasi swargaṁ jitvā vā bhokṣhyase mahīm\ntasmād uttiṣhṭha kaunteya yuddhāya kṛita-niśhchayaḥ"],[2,38,"सुखदुःखे समे कृत्वा लाभालाभौ जयाजयौ।\nततो युद्धाय युज्यस्व नैवं पापमवाप्स्यसि॥","sukha-duḥkhe same kṛitvā lābhālābhau jayājayau\ntato yuddhāya yujyasva naivaṁ pāpam avāpsyasi"],[2,39,"एषा तेऽभिहिता सांख्ये बुद्धिर्योगे त्विमां श्रृणु।\nबुद्ध्यायुक्तो यया पार्थ कर्मबन्धं प्रहास्यसि॥","eṣhā te ’bhihitā sānkhye\nbuddhir yoge tvimāṁ śhṛiṇu\nbuddhyā yukto yayā pārtha\nkarma-bandhaṁ prahāsyasi"],[2,40,"नेहाभिक्रमनाशोऽस्ति प्रत्यवायो न विद्यते।\nस्वल्पमप्यस्य धर्मस्य त्रायते महतो भयात्॥","nehābhikrama-nāśho ’sti pratyavāyo na vidyate\nsvalpam apyasya dharmasya trāyate mahato bhayāt"],[2,41,"व्यवसायात्मिका बुद्धिरेकेह कुरुनन्दन।\nबहुशाखा ह्यनन्ताश्च बुद्धयोऽव्यवसायिनाम्॥","vyavasāyātmikā buddhir ekeha kuru-nandana\nbahu-śhākhā hyanantāśh cha buddhayo ’vyavasāyinām"],[2,42,"यामिमां पुष्पितां वाचं प्रवदन्त्यविपश्चितः।\nवेदवादरताः पार्थ नान्यदस्तीति वादिनः॥","yāmimāṁ puṣhpitāṁ vāchaṁ pravadanty-avipaśhchitaḥ\nveda-vāda-ratāḥ pārtha nānyad astīti vādinaḥ\n kāmātmānaḥ swarga-parā janma-karma-phala-pradām\nkriyā-viśheṣha-bahulāṁ bhogaiśhwarya-gatiṁ prati"],[2,43,"कामात्मानः स्वर्गपरा जन्मकर्मफलप्रदाम्।\nक्रियाविशेषबहुलां भोगैश्वर्यगतिं प्रति॥","kāmātmānaḥ svarga-parā \n janma-karma-phala-pradām\n kriyā-viśeṣa-bahulāṁ\n bhogaiśvarya-gatiṁ prati"],[2,44,"भोगैश्वर्यप्रसक्तानां तयापहृतचेतसाम्।\nव्यवसायात्मिका बुद्धिः समाधौ न विधीयते॥","bhogaiśwvarya-prasaktānāṁ tayāpahṛita-chetasām\nvyavasāyātmikā buddhiḥ samādhau na vidhīyate"],[2,45,"त्रैगुण्यविषया वेदा निस्त्रैगुण्यो भवार्जुन।\nनिर्द्वन्द्वो नित्यसत्त्वस्थो निर्योगक्षेम आत्मवान्॥","trai-guṇya-viṣhayā vedā nistrai-guṇyo bhavārjuna\nnirdvandvo nitya-sattva-stho niryoga-kṣhema ātmavān"],[2,46,"यावानर्थ उदपाने सर्वतः संप्लुतोदके।\nतावान्सर्वेषु वेदेषु ब्राह्मणस्य विजानतः॥","yāvān artha udapāne sarvataḥ samplutodake\ntāvānsarveṣhu vedeṣhu brāhmaṇasya vijānataḥ"],[2,47,"कर्मण्येवाधिकारस्ते मा फलेषु कदाचन।\nमा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि॥","karmaṇy-evādhikāras te mā phaleṣhu kadāchana\nmā karma-phala-hetur bhūr mā te saṅgo ’stvakarmaṇi"],[2,48,"योगस्थः कुरु कर्माणि सङ्गं त्यक्त्वा धनञ्जय।\nसिद्ध्यसिद्ध्योः समो भूत्वा समत्वं योग उच्यते॥","yoga-sthaḥ kuru karmāṇi saṅgaṁ tyaktvā dhanañjaya\nsiddhy-asiddhyoḥ samo bhūtvā samatvaṁ yoga uchyate"],[2,49,"दूरेण ह्यवरं कर्म बुद्धियोगाद्धनञ्जय।\nबुद्धौ शरणमन्विच्छ कृपणाः फलहेतवः॥","dūreṇa hy-avaraṁ karma buddhi-yogād dhanañjaya\nbuddhau śharaṇam anvichchha kṛipaṇāḥ phala-hetavaḥ"],[2,50,"बुद्धियुक्तो जहातीह उभे सुकृतदुष्कृते।\nतस्माद्योगाय युज्यस्व योगः कर्मसु कौशलम्॥","buddhi-yukto jahātīha ubhe sukṛita-duṣhkṛite\ntasmād yogāya yujyasva yogaḥ karmasu kauśhalam"],[2,51,"कर्मजं बुद्धियुक्ता हि फलं त्यक्त्वा मनीषिणः।\nजन्मबन्धविनिर्मुक्ताः पदं गच्छन्त्यनामयम्॥","karma-jaṁ buddhi-yuktā hi phalaṁ tyaktvā manīṣhiṇaḥ\njanma-bandha-vinirmuktāḥ padaṁ gachchhanty-anāmayam"],[2,52,"यदा ते मोहकलिलं बुद्धिर्व्यतितरिष्यति।\nतदा गन्तासि निर्वेदं श्रोतव्यस्य श्रुतस्य च॥","yadā te moha-kalilaṁ buddhir vyatitariṣhyati\ntadā gantāsi nirvedaṁ śhrotavyasya śhrutasya cha"],[2,53,"श्रुतिविप्रतिपन्ना ते यदा स्थास्यति निश्चला।\nसमाधावचला बुद्धिस्तदा योगमवाप्स्यसि॥","śhruti-vipratipannā te yadā sthāsyati niśhchalā\nsamādhāv-achalā buddhis tadā yogam avāpsyasi"],[2,54,"अर्जुन उवाच\nस्थितप्रज्ञस्य का भाषा समाधिस्थस्य केशव।\nस्थितधीः किं प्रभाषेत किमासीत व्रजेत किम्॥","arjuna uvācha\nsthita-prajñasya kā bhāṣhā samādhi-sthasya keśhava\nsthita-dhīḥ kiṁ prabhāṣheta kim āsīta vrajeta kim"],[2,55,"श्री भगवानुवाच\nप्रजहाति यदा कामान् सर्वान् पार्थ मनोगतान्।\nआत्मन्येवात्मना तुष्टः स्थितप्रज्ञस्तदोच्यते॥","śhrī bhagavān uvācha\nprajahāti yadā kāmān sarvān pārtha mano-gatān\nātmany-evātmanā tuṣhṭaḥ sthita-prajñas tadochyate"],[2,56,"दुःखेष्वनुद्विग्नमनाः सुखेषु विगतस्पृहः।\nवीतरागभयक्रोधः स्थितधीर्मुनिरुच्यते॥","duḥkheṣhv-anudvigna-manāḥ sukheṣhu vigata-spṛihaḥ\nvīta-rāga-bhaya-krodhaḥ sthita-dhīr munir uchyate"],[2,57,"यः सर्वत्रानभिस्नेहस्तत्तत्प्राप्य शुभाशुभम्।\nनाभिनन्दति न द्वेष्टि तस्य प्रज्ञा प्रतिष्ठिता॥","yaḥ sarvatrānabhisnehas tat tat prāpya śhubhāśhubham\nnābhinandati na dveṣhṭi tasya prajñā pratiṣhṭhitā"],[2,58,"यदा संहरते चायं कूर्मोऽङ्गानीव सर्वशः।\nइन्द्रियाणीन्द्रियार्थेभ्यस्तस्य प्रज्ञा प्रतिष्ठिता॥","yadā sanharate chāyaṁ kūrmo ’ṅgānīva sarvaśhaḥ\nindriyāṇīndriyārthebhyas tasya prajñā pratiṣhṭhitā"],[2,59,"विषया विनिवर्तन्ते निराहारस्य देहिनः।\nरसवर्जं रसोऽप्यस्य परं दृष्ट्वा निवर्तते॥","viṣhayā vinivartante nirāhārasya dehinaḥ\nrasa-varjaṁ raso ’pyasya paraṁ dṛiṣhṭvā nivartate"],[2,60,"यततो ह्यपि कौन्तेय पुरुषस्य विपश्चितः।\nइन्द्रियाणि प्रमाथीनि हरन्ति प्रसभं मनः॥","yatato hyapi kaunteya puruṣhasya vipaśhchitaḥ\nindriyāṇi pramāthīni haranti prasabhaṁ manaḥ"],[2,61,"तानि सर्वाणि संयम्य युक्त आसीत मत्परः।\nवशे हि यस्येन्द्रियाणि तस्य प्रज्ञा प्रतिष्ठिता॥","tāni sarvāṇi sanyamya yukta āsīta mat-paraḥ\nvaśhe hi yasyendriyāṇi tasya prajñā pratiṣhṭhitā"],[2,62,"ध्यायतो विषयान्पुंसः सङ्गस्तेषूपजायते।\nसङ्गात् संजायते कामः कामात्क्रोधोऽभिजायते॥","dhyāyato viṣhayān puṁsaḥ saṅgas teṣhūpajāyate\nsaṅgāt sañjāyate kāmaḥ kāmāt krodho ’bhijāyate"],[2,63,"क्रोधाद्भवति संमोहः संमोहात्स्मृतिविभ्रमः।\nस्मृतिभ्रंशाद् बुद्धिनाशो बुद्धिनाशात्प्रणश्यति॥","krodhād bhavati sammohaḥ sammohāt smṛiti-vibhramaḥ\nsmṛiti-bhranśhād buddhi-nāśho buddhi-nāśhāt praṇaśhyati"],[2,64,"रागद्वेषवियुक्तैस्तु विषयानिन्द्रियैश्चरन्।\nआत्मवश्यैर्विधेयात्मा प्रसादमधिगच्छति॥","rāga-dveṣha-viyuktais tu viṣhayān indriyaiśh charan\nātma-vaśhyair-vidheyātmā prasādam adhigachchhati"],[2,65,"प्रसादे सर्वदुःखानां हानिरस्योपजायते।\nप्रसन्नचेतसो ह्याशु बुद्धिः पर्यवतिष्ठते॥","prasāde sarva-duḥkhānāṁ hānir asyopajāyate\nprasanna-chetaso hyāśhu buddhiḥ paryavatiṣhṭhate"],[2,66,"नास्ति बुद्धिरयुक्तस्य न चायुक्तस्य भावना।\nन चाभावयतः शान्तिरशान्तस्य कुतः सुखम्॥","nāsti buddhir-ayuktasya na chāyuktasya bhāvanā\nna chābhāvayataḥ śhāntir aśhāntasya kutaḥ sukham"],[2,67,"इन्द्रियाणां हि चरतां यन्मनोऽनुविधीयते।\nतदस्य हरति प्रज्ञां वायुर्नावमिवाम्भसि॥","indriyāṇāṁ hi charatāṁ yan mano ’nuvidhīyate\ntadasya harati prajñāṁ vāyur nāvam ivāmbhasi"],[2,68,"तस्माद्यस्य महाबाहो निगृहीतानि सर्वशः।\nइन्द्रियाणीन्द्रियार्थेभ्यस्तस्य प्रज्ञा प्रतिष्ठिता॥","tasmād yasya mahā-bāho nigṛihītāni sarvaśhaḥ\nindriyāṇīndriyārthebhyas tasya prajñā pratiṣhṭhitā"],[2,69,"या निशा सर्वभूतानां तस्यां जागर्ति संयमी।\nयस्यां जाग्रति भूतानि सा निशा पश्यतो मुनेः॥","yā niśhā sarva-bhūtānāṁ tasyāṁ jāgarti sanyamī\nyasyāṁ jāgrati bhūtāni sā niśhā paśhyato muneḥ"],[2,70,"आपूर्यमाणमचलप्रतिष्ठं\nसमुद्रमापः प्रविशन्ति यद्वत्।\nतद्वत्कामा यं प्रविशन्ति सर्वे\nस शान्तिमाप्नोति न कामकामी॥","āpūryamāṇam achala-pratiṣhṭhaṁ\nsamudram āpaḥ praviśhanti yadvat\ntadvat kāmā yaṁ praviśhanti sarve\nsa śhāntim āpnoti na kāma-kāmī"],[2,71,"विहाय कामान्यः सर्वान्पुमांश्चरति निःस्पृहः।\nनिर्ममो निरहंकारः स शांतिमधिगच्छति॥","vihāya kāmān yaḥ sarvān pumānśh charati niḥspṛihaḥ\nnirmamo nirahankāraḥ sa śhāntim adhigachchhati"],[2,72,"एषा ब्राह्मी स्थितिः पार्थ नैनां प्राप्य विमुह्यति।\nस्थित्वाऽस्यामन्तकालेऽपि ब्रह्मनिर्वाणमृच्छति॥","eṣhā brāhmī sthitiḥ pārtha naināṁ prāpya vimuhyati\nsthitvāsyām anta-kāle ’pi brahma-nirvāṇam ṛichchhati"],[3,1,"अर्जुन उवाच\nज्यायसी चेत्कर्मणस्ते मता बुद्धिर्जनार्दन।\nतत्किं कर्मणि घोरे मां नियोजयसि केशव॥","arjuna uvācha\njyāyasī chet karmaṇas te matā buddhir janārdana\ntat kiṁ karmaṇi ghore māṁ niyojayasi keśhava"],[3,2,"व्यामिश्रेणेव वाक्येन बुद्धिं मोहयसीव मे।\nतदेकं वद निश्िचत्य येन श्रेयोऽहमाप्नुयाम्॥","vyāmiśhreṇeva vākyena buddhiṁ mohayasīva me\ntad ekaṁ vada niśhchitya yena śhreyo ’ham āpnuyām"],[3,3,"श्री भगवानुवाच\nलोकेऽस्मिन्द्विविधा निष्ठा पुरा प्रोक्ता मयानघ।\nज्ञानयोगेन सांख्यानां कर्मयोगेन योगिनाम्॥","śhrī bhagavān uvācha\nloke’smin dvi-vidhā niṣhṭhā purā proktā mayānagha\njñāna-yogena sāṅkhyānāṁ karma-yogena yoginām"],[3,4,"न कर्मणामनारम्भान्नैष्कर्म्यं पुरुषोऽश्नुते।\nन च संन्यसनादेव सिद्धिं समधिगच्छति॥","na karmaṇām anārambhān naiṣhkarmyaṁ puruṣho ’śhnute\nna cha sannyasanād eva siddhiṁ samadhigachchhati"],[3,5,"न हि कश्िचत्क्षणमपि जातु तिष्ठत्यकर्मकृत्।\nकार्यते ह्यवशः कर्म सर्वः प्रकृतिजैर्गुणैः॥","na hi kaśhchit kṣhaṇam api jātu tiṣhṭhatyakarma-kṛit\nkāryate hyavaśhaḥ karma sarvaḥ prakṛiti-jair guṇaiḥ"],[3,6,"कर्मेन्द्रियाणि संयम्य य आस्ते मनसा स्मरन्।\nइन्द्रियार्थान्विमूढात्मा मिथ्याचारः स उच्यते॥","karmendriyāṇi sanyamya ya āste manasā smaran\nindriyārthān vimūḍhātmā mithyāchāraḥ sa uchyate"],[3,7,"यस्त्विन्द्रियाणि मनसा नियम्यारभतेऽर्जुन।\nकर्मेन्द्रियैः कर्मयोगमसक्तः स विशिष्यते॥","yas tvindriyāṇi manasā niyamyārabhate ’rjuna\nkarmendriyaiḥ karma-yogam asaktaḥ sa viśhiṣhyate"],[3,8,"नियतं कुरु कर्म त्वं कर्म ज्यायो ह्यकर्मणः।\nशरीरयात्रापि च ते न प्रसिद्ध्येदकर्मणः॥","niyataṁ kuru karma tvaṁ karma jyāyo hyakarmaṇaḥ\nśharīra-yātrāpi cha te na prasiddhyed akarmaṇaḥ"],[3,9,"यज्ञार्थात्कर्मणोऽन्यत्र लोकोऽयं कर्मबन्धनः।\nतदर्थं कर्म कौन्तेय मुक्तसंगः समाचर॥","yajñārthāt karmaṇo ’nyatra loko ’yaṁ karma-bandhanaḥ\ntad-arthaṁ karma kaunteya mukta-saṅgaḥ samāchara"],[3,10,"सहयज्ञाः प्रजाः सृष्ट्वा पुरोवाच प्रजापतिः।\nअनेन प्रसविष्यध्वमेष वोऽस्त्विष्टकामधुक्॥","saha-yajñāḥ prajāḥ sṛiṣhṭvā purovācha prajāpatiḥ\nanena prasaviṣhyadhvam eṣha vo ’stviṣhṭa-kāma-dhuk"],[3,11,"देवान्भावयतानेन ते देवा भावयन्तु वः।\nपरस्परं भावयन्तः श्रेयः परमवाप्स्यथ॥","devān bhāvayatānena te devā bhāvayantu vaḥ\nparasparaṁ bhāvayantaḥ śhreyaḥ param avāpsyatha"],[3,12,"इष्टान्भोगान्हि वो देवा दास्यन्ते यज्ञभाविताः।\nतैर्दत्तानप्रदायैभ्यो यो भुङ्क्ते स्तेन एव सः॥","iṣhṭān bhogān hi vo devā dāsyante yajña-bhāvitāḥ\ntair dattān apradāyaibhyo yo bhuṅkte stena eva saḥ"],[3,13,"यज्ञशिष्टाशिनः सन्तो मुच्यन्ते सर्वकिल्बिषैः।\nभुञ्जते ते त्वघं पापा ये पचन्त्यात्मकारणात्॥","yajña-śhiṣhṭāśhinaḥ santo muchyante sarva-kilbiṣhaiḥ\nbhuñjate te tvaghaṁ pāpā ye pachantyātma-kāraṇāt"],[3,14,"अन्नाद्भवन्ति भूतानि पर्जन्यादन्नसम्भवः।\nयज्ञाद्भवति पर्जन्यो यज्ञः कर्मसमुद्भवः॥","annād bhavanti bhūtāni parjanyād anna-sambhavaḥ\nyajñād bhavati parjanyo yajñaḥ karma-samudbhavaḥ"],[3,15,"कर्म ब्रह्मोद्भवं विद्धि ब्रह्माक्षरसमुद्भवम्।\nतस्मात्सर्वगतं ब्रह्म नित्यं यज्ञे प्रतिष्ठितम्॥","karma brahmodbhavaṁ viddhi brahmākṣhara-samudbhavam\ntasmāt sarva-gataṁ brahma nityaṁ yajñe pratiṣhṭhitam"],[3,16,"एवं प्रवर्तितं चक्रं नानुवर्तयतीह यः।\nअघायुरिन्द्रियारामो मोघं पार्थ स जीवति॥","evaṁ pravartitaṁ chakraṁ nānuvartayatīha yaḥ\naghāyur indriyārāmo moghaṁ pārtha sa jīvati"],[3,17,"यस्त्वात्मरतिरेव स्यादात्मतृप्तश्च मानवः।\nआत्मन्येव च सन्तुष्टस्तस्य कार्यं न विद्यते॥","yas tvātma-ratir eva syād ātma-tṛiptaśh cha mānavaḥ\nātmanyeva cha santuṣhṭas tasya kāryaṁ na vidyate"],[3,18,"नैव तस्य कृतेनार्थो नाकृतेनेह कश्चन।\nन चास्य सर्वभूतेषु कश्िचदर्थव्यपाश्रयः॥","naiva tasya kṛitenārtho nākṛiteneha kaśhchana\nna chāsya sarva-bhūteṣhu kaśhchid artha-vyapāśhrayaḥ"],[3,19,"तस्मादसक्तः सततं कार्यं कर्म समाचर।\nअसक्तो ह्याचरन्कर्म परमाप्नोति पूरुषः॥","tasmād asaktaḥ satataṁ kāryaṁ karma samāchara\nasakto hyācharan karma param āpnoti pūruṣhaḥ"],[3,20,"कर्मणैव हि संसिद्धिमास्थिता जनकादयः।\nलोकसंग्रहमेवापि संपश्यन्कर्तुमर्हसि॥","karmaṇaiva hi sansiddhim āsthitā janakādayaḥ\nloka-saṅgraham evāpi sampaśhyan kartum arhasi"],[3,21,"यद्यदाचरति श्रेष्ठस्तत्तदेवेतरो जनः।\nस यत्प्रमाणं कुरुते लोकस्तदनुवर्तते॥","yad yad ācharati śhreṣhṭhas tat tad evetaro janaḥ\nsa yat pramāṇaṁ kurute lokas tad anuvartate"],[3,22,"न मे पार्थास्ति कर्तव्यं त्रिषु लोकेषु किञ्चन।\nनानवाप्तमवाप्तव्यं वर्त एव च कर्मणि॥","na me pārthāsti kartavyaṁ triṣhu lokeṣhu kiñchana\nnānavāptam avāptavyaṁ varta eva cha karmaṇi"],[3,23,"यदि ह्यहं न वर्तेयं जातु कर्मण्यतन्द्रितः।\nमम वर्त्मानुवर्तन्ते मनुष्याः पार्थ सर्वशः॥","yadi hyahaṁ na varteyaṁ jātu karmaṇyatandritaḥ\nmama vartmānuvartante manuṣhyāḥ pārtha sarvaśhaḥ"],[3,24,"उत्सीदेयुरिमे लोका न कुर्यां कर्म चेदहम्।\nसङ्करस्य च कर्ता स्यामुपहन्यामिमाः प्रजाः॥","utsīdeyur ime lokā na kuryāṁ karma ched aham\nsankarasya cha kartā syām upahanyām imāḥ prajāḥ"],[3,25,"सक्ताः कर्मण्यविद्वांसो यथा कुर्वन्ति भारत।\nकुर्याद्विद्वांस्तथासक्तश्िचकीर्षुर्लोकसंग्रहम्॥","saktāḥ karmaṇyavidvānso yathā kurvanti bhārata\nkuryād vidvāns tathāsaktaśh chikīrṣhur loka-saṅgraham"],[3,26,"न बुद्धिभेदं जनयेदज्ञानां कर्मसङ्गिनाम्।\nजोषयेत्सर्वकर्माणि विद्वान् युक्तः समाचरन्॥","na buddhi-bhedaṁ janayed ajñānāṁ karma-saṅginām\njoṣhayet sarva-karmāṇi vidvān yuktaḥ samācharan"],[3,27,"प्रकृतेः क्रियमाणानि गुणैः कर्माणि सर्वशः।\nअहङ्कारविमूढात्मा कर्ताऽहमिति मन्यते॥","prakṛiteḥ kriyamāṇāni guṇaiḥ karmāṇi sarvaśhaḥ\nahankāra-vimūḍhātmā kartāham iti manyate"],[3,28,"तत्त्ववित्तु महाबाहो गुणकर्मविभागयोः।\nगुणा गुणेषु वर्तन्त इति मत्वा न सज्जते॥","tattva-vit tu mahā-bāho guṇa-karma-vibhāgayoḥ\nguṇā guṇeṣhu vartanta iti matvā na sajjate"],[3,29,"प्रकृतेर्गुणसम्मूढाः सज्जन्ते गुणकर्मसु।\nतानकृत्स्नविदो मन्दान्कृत्स्नविन्न विचालयेत्॥","prakṛiter guṇa-sammūḍhāḥ sajjante guṇa-karmasu\ntān akṛitsna-vido mandān kṛitsna-vin na vichālayet"],[3,30,"मयि सर्वाणि कर्माणि संन्यस्याध्यात्मचेतसा।\nनिराशीर्निर्ममो भूत्वा युध्यस्व विगतज्वरः॥","mayi sarvāṇi karmāṇi sannyasyādhyātma-chetasā\nnirāśhīr nirmamo bhūtvā yudhyasva vigata-jvaraḥ"],[3,31,"ये मे मतमिदं नित्यमनुतिष्ठन्ति मानवाः।\nश्रद्धावन्तोऽनसूयन्तो मुच्यन्ते तेऽपि कर्मभिः॥","ye me matam idaṁ nityam anutiṣhṭhanti mānavāḥ\nśhraddhāvanto ’nasūyanto muchyante te ’pi karmabhiḥ"],[3,32,"ये त्वेतदभ्यसूयन्तो नानुतिष्ठन्ति मे मतम्।\nसर्वज्ञानविमूढांस्तान्विद्धि नष्टानचेतसः॥","ye tvetad abhyasūyanto nānutiṣhṭhanti me matam\nsarva-jñāna-vimūḍhāns tān viddhi naṣhṭān achetasaḥ"],[3,33,"सदृशं चेष्टते स्वस्याः प्रकृतेर्ज्ञानवानपि।\nप्रकृतिं यान्ति भूतानि निग्रहः किं करिष्यति॥","sadṛiśhaṁ cheṣhṭate svasyāḥ prakṛiter jñānavān api\nprakṛitiṁ yānti bhūtāni nigrahaḥ kiṁ kariṣhyati"],[3,34,"इन्द्रियस्येन्द्रियस्यार्थे रागद्वेषौ व्यवस्थितौ।\nतयोर्न वशमागच्छेत्तौ ह्यस्य परिपन्थिनौ॥","indriyasyendriyasyārthe rāga-dveṣhau vyavasthitau\ntayor na vaśham āgachchhet tau hyasya paripanthinau"],[3,35,"श्रेयान्स्वधर्मो विगुणः परधर्मात्स्वनुष्ठितात्।\nस्वधर्मे निधनं श्रेयः परधर्मो भयावहः॥","śhreyān swa-dharmo viguṇaḥ para-dharmāt sv-anuṣhṭhitāt\nswa-dharme nidhanaṁ śhreyaḥ para-dharmo bhayāvahaḥ"],[3,36,"अर्जुन उवाच\nअथ केन प्रयुक्तोऽयं पापं चरति पूरुषः।\nअनिच्छन्नपि वार्ष्णेय बलादिव नियोजितः॥","arjuna uvācha\natha kena prayukto ’yaṁ pāpaṁ charati pūruṣhaḥ\nanichchhann api vārṣhṇeya balād iva niyojitaḥ"],[3,37,"श्री भगवानुवाच\nकाम एष क्रोध एष रजोगुणसमुद्भवः।\nमहाशनो महापाप्मा विद्ध्येनमिह वैरिणम्॥","śhrī bhagavān uvācha\nkāma eṣha krodha eṣha rajo-guṇa-samudbhavaḥ\nmahāśhano mahā-pāpmā viddhyenam iha vairiṇam"],[3,38,"धूमेनाव्रियते वह्निर्यथाऽऽदर्शो मलेन च।\nयथोल्बेनावृतो गर्भस्तथा तेनेदमावृतम्॥","dhūmenāvriyate vahnir yathādarśho malena cha\nyatholbenāvṛito garbhas tathā tenedam āvṛitam"],[3,39,"आवृतं ज्ञानमेतेन ज्ञानिनो नित्यवैरिणा।\nकामरूपेण कौन्तेय दुष्पूरेणानलेन च॥","āvṛitaṁ jñānam etena jñānino nitya-vairiṇā\nkāma-rūpeṇa kaunteya duṣhpūreṇānalena cha"],[3,40,"इन्द्रियाणि मनो बुद्धिरस्याधिष्ठानमुच्यते।\nएतैर्विमोहयत्येष ज्ञानमावृत्य देहिनम्॥","indriyāṇi mano buddhir asyādhiṣhṭhānam uchyate\netair vimohayatyeṣha jñānam āvṛitya dehinam"],[3,41,"तस्मात्त्वमिन्द्रियाण्यादौ नियम्य भरतर्षभ।\nपाप्मानं प्रजहि ह्येनं ज्ञानविज्ञाननाशनम्॥","tasmāt tvam indriyāṇyādau niyamya bharatarṣhabha\npāpmānaṁ prajahi hyenaṁ jñāna-vijñāna-nāśhanam"],[3,42,"इन्द्रियाणि पराण्याहुरिन्द्रियेभ्यः परं मनः।\nमनसस्तु परा बुद्धिर्यो बुद्धेः परतस्तु सः॥","indriyāṇi parāṇyāhur indriyebhyaḥ paraṁ manaḥ\nmanasas tu parā buddhir yo buddheḥ paratas tu saḥ"],[3,43,"एवं बुद्धेः परं बुद्ध्वा संस्तभ्यात्मानमात्मना।\nजहि शत्रुं महाबाहो कामरूपं दुरासदम्॥","evaṁ buddheḥ paraṁ buddhvā sanstabhyātmānam ātmanā\njahi śhatruṁ mahā-bāho kāma-rūpaṁ durāsadam"],[4,1,"श्री भगवानुवाच\nइमं विवस्वते योगं प्रोक्तवानहमव्ययम्।\nविवस्वान् मनवे प्राह मनुरिक्ष्वाकवेऽब्रवीत्॥","śhrī bhagavān uvācha\nimaṁ vivasvate yogaṁ proktavān aham avyayam\nvivasvān manave prāha manur ikṣhvākave ’bravīt"],[4,2,"एवं परम्पराप्राप्तमिमं राजर्षयो विदुः।\nस कालेनेह महता योगो नष्टः परन्तप॥","evaṁ paramparā-prāptam imaṁ rājarṣhayo viduḥ\nsa kāleneha mahatā yogo naṣhṭaḥ parantapa"],[4,3,"स एवायं मया तेऽद्य योगः प्रोक्तः पुरातनः।\nभक्तोऽसि मे सखा चेति रहस्यं ह्येतदुत्तमम्॥","sa evāyaṁ mayā te ’dya yogaḥ proktaḥ purātanaḥ\nbhakto ’si me sakhā cheti rahasyaṁ hyetad uttamam"],[4,4,"अर्जुन उवाच\nअपरं भवतो जन्म परं जन्म विवस्वतः।\nकथमेतद्विजानीयां त्वमादौ प्रोक्तवानिति॥","arjuna uvācha\naparaṁ bhavato janma paraṁ janma vivasvataḥ\nkatham etad vijānīyāṁ tvam ādau proktavān iti"],[4,5,"श्री भगवानुवाच\nबहूनि मे व्यतीतानि जन्मानि तव चार्जुन।\nतान्यहं वेद सर्वाणि न त्वं वेत्थ परन्तप॥","śhrī bhagavān uvācha\nbahūni me vyatītāni janmāni tava chārjuna\ntānyahaṁ veda sarvāṇi na tvaṁ vettha parantapa"],[4,6,"अजोऽपि सन्नव्ययात्मा भूतानामीश्वरोऽपि सन्।\nप्रकृतिं स्वामधिष्ठाय संभवाम्यात्ममायया॥","ajo ’pi sannavyayātmā bhūtānām īśhvaro ’pi san\nprakṛitiṁ svām adhiṣhṭhāya sambhavāmyātma-māyayā"],[4,7,"यदा यदा हि धर्मस्य ग्लानिर्भवति भारत।\nअभ्युत्थानमधर्मस्य तदाऽऽत्मानं सृजाम्यहम्॥","yadā yadā hi dharmasya glānir bhavati bhārata\nabhyutthānam adharmasya tadātmānaṁ sṛijāmyaham"],[4,8,"परित्राणाय साधूनां विनाशाय च दुष्कृताम्।\nधर्मसंस्थापनार्थाय संभवामि युगे युगे॥","paritrāṇāya sādhūnāṁ vināśhāya cha duṣhkṛitām\ndharma-sansthāpanārthāya sambhavāmi yuge yuge"],[4,9,"जन्म कर्म च मे दिव्यमेवं यो वेत्ति तत्त्वतः।\nत्यक्त्वा देहं पुनर्जन्म नैति मामेति सोऽर्जुन॥","janma karma cha me divyam evaṁ yo vetti tattvataḥ\ntyaktvā dehaṁ punar janma naiti mām eti so ’rjuna"],[4,10,"वीतरागभयक्रोधा मन्मया मामुपाश्रिताः।\nबहवो ज्ञानतपसा पूता मद्भावमागताः॥","vīta-rāga-bhaya-krodhā man-mayā mām upāśhritāḥ\nbahavo jñāna-tapasā pūtā mad-bhāvam āgatāḥ"],[4,11,"ये यथा मां प्रपद्यन्ते तांस्तथैव भजाम्यहम्।\nमम वर्त्मानुवर्तन्ते मनुष्याः पार्थ सर्वशः॥","ye yathā māṁ prapadyante tāns tathaiva bhajāmyaham\nmama vartmānuvartante manuṣhyāḥ pārtha sarvaśhaḥ"],[4,12,"काङ्क्षन्तः कर्मणां सिद्धिं यजन्त इह देवताः।\nक्षिप्रं हि मानुषे लोके सिद्धिर्भवति कर्मजा॥","kāṅkṣhantaḥ karmaṇāṁ siddhiṁ yajanta iha devatāḥ\nkṣhipraṁ hi mānuṣhe loke siddhir bhavati karmajā"],[4,13,"चातुर्वर्ण्यं मया सृष्टं गुणकर्मविभागशः।\nतस्य कर्तारमपि मां विद्ध्यकर्तारमव्ययम्॥","chātur-varṇyaṁ mayā sṛiṣhṭaṁ guṇa-karma-vibhāgaśhaḥ\ntasya kartāram api māṁ viddhyakartāram avyayam"],[4,14,"न मां कर्माणि लिम्पन्ति न मे कर्मफले स्पृहा।\nइति मां योऽभिजानाति कर्मभिर्न स बध्यते॥","na māṁ karmāṇi limpanti na me karma-phale spṛihā\niti māṁ yo ’bhijānāti karmabhir na sa badhyate"],[4,15,"एवं ज्ञात्वा कृतं कर्म पूर्वैरपि मुमुक्षुभिः।\nकुरु कर्मैव तस्मात्त्वं पूर्वैः पूर्वतरं कृतम्॥","evaṁ jñātvā kṛitaṁ karma pūrvair api mumukṣhubhiḥ\nkuru karmaiva tasmāttvaṁ pūrvaiḥ pūrvataraṁ kṛitam"],[4,16,"किं कर्म किमकर्मेति कवयोऽप्यत्र मोहिताः।\nतत्ते कर्म प्रवक्ष्यामि यज्ज्ञात्वा मोक्ष्यसेऽशुभात्॥","kiṁ karma kim akarmeti kavayo ’pyatra mohitāḥ\ntat te karma pravakṣhyāmi yaj jñātvā mokṣhyase ’śhubhāt"],[4,17,"कर्मणो ह्यपि बोद्धव्यं बोद्धव्यं च विकर्मणः।\nअकर्मणश्च बोद्धव्यं गहना कर्मणो गतिः॥","karmaṇo hyapi boddhavyaṁ boddhavyaṁ cha vikarmaṇaḥ\nakarmaṇaśh cha boddhavyaṁ gahanā karmaṇo gatiḥ"],[4,18,"कर्मण्यकर्म यः पश्येदकर्मणि च कर्म यः।\nस बुद्धिमान् मनुष्येषु स युक्तः कृत्स्नकर्मकृत्॥","karmaṇyakarma yaḥ paśhyed akarmaṇi cha karma yaḥ\nsa buddhimān manuṣhyeṣhu sa yuktaḥ kṛitsna-karma-kṛit"],[4,19,"यस्य सर्वे समारम्भाः कामसङ्कल्पवर्जिताः।\nज्ञानाग्निदग्धकर्माणं तमाहुः पण्डितं बुधाः॥","yasya sarve samārambhāḥ kāma-saṅkalpa-varjitāḥ\njñānāgni-dagdha-karmāṇaṁ tam āhuḥ paṇḍitaṁ budhāḥ"],[4,20,"त्यक्त्वा कर्मफलासङ्गं नित्यतृप्तो निराश्रयः।\nकर्मण्यभिप्रवृत्तोऽपि नैव किञ्चित्करोति सः॥","tyaktvā karma-phalāsaṅgaṁ nitya-tṛipto nirāśhrayaḥ\nkarmaṇyabhipravṛitto ’pi naiva kiñchit karoti saḥ"],[4,21,"निराशीर्यतचित्तात्मा त्यक्तसर्वपरिग्रहः।\nशारीरं केवलं कर्म कुर्वन्नाप्नोति किल्बिषम्॥","nirāśhīr yata-chittātmā tyakta-sarva-parigrahaḥ\nśhārīraṁ kevalaṁ karma kurvan nāpnoti kilbiṣham"],[4,22,"यदृच्छालाभसन्तुष्टो द्वन्द्वातीतो विमत्सरः।\nसमः सिद्धावसिद्धौ च कृत्वापि न निबध्यते॥","yadṛichchhā-lābha-santuṣhṭo dvandvātīto vimatsaraḥ\nsamaḥ siddhāvasiddhau cha kṛitvāpi na nibadhyate"],[4,23,"गतसङ्गस्य मुक्तस्य ज्ञानावस्थितचेतसः।\nयज्ञायाचरतः कर्म समग्रं प्रविलीयते॥","gata-saṅgasya muktasya jñānāvasthita-chetasaḥ\nyajñāyācharataḥ karma samagraṁ pravilīyate"],[4,24,"ब्रह्मार्पणं ब्रह्महविर्ब्रह्माग्नौ ब्रह्मणा हुतम्।\nब्रह्मैव तेन गन्तव्यं ब्रह्मकर्मसमाधिना॥","brahmārpaṇaṁ brahma havir brahmāgnau brahmaṇā hutam\nbrahmaiva tena gantavyaṁ brahma-karma-samādhinā"],[4,25,"दैवमेवापरे यज्ञं योगिनः पर्युपासते।\nब्रह्माग्नावपरे यज्ञं यज्ञेनैवोपजुह्वति॥","daivam evāpare yajñaṁ yoginaḥ paryupāsate\nbrahmāgnāvapare yajñaṁ yajñenaivopajuhvati"],[4,26,"श्रोत्रादीनीन्द्रियाण्यन्ये संयमाग्निषु जुह्वति।\nशब्दादीन्विषयानन्य इन्द्रियाग्निषु जुह्वति॥","śhrotrādīnīndriyāṇyanye sanyamāgniṣhu juhvati\nśhabdādīn viṣhayānanya indriyāgniṣhu juhvati"],[4,27,"सर्वाणीन्द्रियकर्माणि प्राणकर्माणि चापरे।\nआत्मसंयमयोगाग्नौ जुह्वति ज्ञानदीपिते॥","sarvāṇīndriya-karmāṇi prāṇa-karmāṇi chāpare\nātma-sanyama-yogāgnau juhvati jñāna-dīpite"],[4,28,"द्रव्ययज्ञास्तपोयज्ञा योगयज्ञास्तथापरे।\nस्वाध्यायज्ञानयज्ञाश्च यतयः संशितव्रताः॥","dravya-yajñās tapo-yajñā yoga-yajñās tathāpare\nswādhyāya-jñāna-yajñāśh cha yatayaḥ sanśhita-vratāḥ"],[4,29,"अपाने जुह्वति प्राण प्राणेऽपानं तथाऽपरे।\nप्राणापानगती रुद्ध्वा प्राणायामपरायणाः॥","apāne juhvati prāṇaṁ prāṇe ’pānaṁ tathāpare\nprāṇāpāna-gatī ruddhvā prāṇāyāma-parāyaṇāḥ\n apare niyatāhārāḥ prāṇān prāṇeṣhu juhvati\nsarve ’pyete yajña-vido yajña-kṣhapita-kalmaṣhāḥ"],[4,30,"अपरे नियताहाराः प्राणान्प्राणेषु जुह्वति।\nसर्वेऽप्येते यज्ञविदो यज्ञक्षपितकल्मषाः॥","apare niyatāhārāḥ prāṇān  prāṇeṣu juhvati\nsarve py 'ete yajña-vido yajña-kṣapita-kalmaṣāḥ"],[4,31,"यज्ञशिष्टामृतभुजो यान्ति ब्रह्म सनातनम्।\nनायं लोकोऽस्त्ययज्ञस्य कुतो़ऽन्यः कुरुसत्तम॥","yajña-śhiṣhṭāmṛita-bhujo yānti brahma sanātanam\nnāyaṁ loko ’styayajñasya kuto ’nyaḥ kuru-sattama"],[4,32,"एवं बहुविधा यज्ञा वितता ब्रह्मणो मुखे।\nकर्मजान्विद्धि तान्सर्वानेवं ज्ञात्वा विमोक्ष्यसे॥","evaṁ bahu-vidhā yajñā vitatā brahmaṇo mukhe\nkarma-jān viddhi tān sarvān evaṁ jñātvā vimokṣhyase"],[4,33,"श्रेयान्द्रव्यमयाद्यज्ञाज्ज्ञानयज्ञः परन्तप।\nसर्वं कर्माखिलं पार्थ ज्ञाने परिसमाप्यते॥","śhreyān dravya-mayād yajñāj jñāna-yajñaḥ parantapa\nsarvaṁ karmākhilaṁ pārtha jñāne parisamāpyate"],[4,34,"तद्विद्धि प्रणिपातेन परिप्रश्नेन सेवया।\nउपदेक्ष्यन्ति ते ज्ञानं ज्ञानिनस्तत्त्वदर्शिनः॥","tad viddhi praṇipātena paripraśhnena sevayā\nupadekṣhyanti te jñānaṁ jñāninas tattva-darśhinaḥ"],[4,35,"यज्ज्ञात्वा न पुनर्मोहमेवं यास्यसि पाण्डव।\nयेन भूतान्यशेषेण द्रक्ष्यस्यात्मन्यथो मयि॥","yaj jñātvā na punar moham evaṁ yāsyasi pāṇḍava\nyena bhūtānyaśheṣheṇa drakṣhyasyātmanyatho mayi"],[4,36,"अपि चेदसि पापेभ्यः सर्वेभ्यः पापकृत्तमः।\nसर्वं ज्ञानप्लवेनैव वृजिनं सन्तरिष्यसि॥","api ched asi pāpebhyaḥ sarvebhyaḥ pāpa-kṛit-tamaḥ\nsarvaṁ jñāna-plavenaiva vṛijinaṁ santariṣhyasi"],[4,37,"यथैधांसि समिद्धोऽग्निर्भस्मसात्कुरुतेऽर्जुन।\nज्ञानाग्निः सर्वकर्माणि भस्मसात्कुरुते तथा॥","yathaidhānsi samiddho ’gnir bhasma-sāt kurute ’rjuna\njñānāgniḥ sarva-karmāṇi bhasma-sāt kurute tathā"],[4,38,"न हि ज्ञानेन सदृशं पवित्रमिह विद्यते।\nतत्स्वयं योगसंसिद्धः कालेनात्मनि विन्दति॥","na hi jñānena sadṛiśhaṁ pavitramiha vidyate\ntatsvayaṁ yogasansiddhaḥ kālenātmani vindati"],[4,39,"श्रद्धावाँल्लभते ज्ञानं तत्परः संयतेन्द्रियः।\nज्ञानं लब्ध्वा परां शान्तिमचिरेणाधिगच्छति॥","śhraddhāvān labhate jñānaṁ tat-paraḥ sanyatendriyaḥ\njñānaṁ labdhvā parāṁ śhāntim achireṇādhigachchhati"],[4,40,"अज्ञश्चाश्रद्दधानश्च संशयात्मा विनश्यति।\nनायं लोकोऽस्ति न परो न सुखं संशयात्मनः॥","ajñaśh chāśhraddadhānaśh cha sanśhayātmā vinaśhyati\nnāyaṁ loko ’sti na paro na sukhaṁ sanśhayātmanaḥ"],[4,41,"योगसंन्यस्तकर्माणं ज्ञानसंछिन्नसंशयम्।\nआत्मवन्तं न कर्माणि निबध्नन्ति धनञ्जय॥","yoga-sannyasta-karmāṇaṁ jñāna-sañchhinna-sanśhayam\nātmavantaṁ na karmāṇi nibadhnanti dhanañjaya"],[4,42,"तस्मादज्ञानसंभूतं हृत्स्थं ज्ञानासिनाऽऽत्मनः।\nछित्त्वैनं संशयं योगमातिष्ठोत्तिष्ठ भारत॥","tasmād ajñāna-sambhūtaṁ hṛit-sthaṁ jñānāsinātmanaḥ\nchhittvainaṁ sanśhayaṁ yogam ātiṣhṭhottiṣhṭha bhārata"],[5,1,"अर्जुन उवाच\nसंन्यासं कर्मणां कृष्ण पुनर्योगं च शंससि।\nयच्छ्रेय एतयोरेकं तन्मे ब्रूहि सुनिश्िचतम्॥","arjuna uvācha\nsannyāsaṁ karmaṇāṁ kṛiṣhṇa punar yogaṁ cha śhansasi\nyach chhreya etayor ekaṁ tan me brūhi su-niśhchitam"],[5,2,"श्री भगवानुवाच\nसंन्यासः कर्मयोगश्च निःश्रेयसकरावुभौ।\nतयोस्तु कर्मसंन्यासात्कर्मयोगो विशिष्यते॥","śhrī bhagavān uvācha\nsannyāsaḥ karma-yogaśh cha niḥśhreyasa-karāvubhau\ntayos tu karma-sannyāsāt karma-yogo viśhiṣhyate"],[5,3,"ज्ञेयः स नित्यसंन्यासी यो न द्वेष्टि न काङ्क्षति।\nनिर्द्वन्द्वो हि महाबाहो सुखं बन्धात्प्रमुच्यते॥","jñeyaḥ sa nitya-sannyāsī yo na dveṣhṭi na kāṅkṣhati\nnirdvandvo hi mahā-bāho sukhaṁ bandhāt pramuchyate"],[5,4,"सांख्ययोगौ पृथग्बालाः प्रवदन्ति न पण्डिताः।\nएकमप्यास्थितः सम्यगुभयोर्विन्दते फलम्॥","sānkhya-yogau pṛithag bālāḥ pravadanti na paṇḍitāḥ\nekamapyāsthitaḥ samyag ubhayor vindate phalam"],[5,5,"यत्सांख्यैः प्राप्यते स्थानं तद्योगैरपि गम्यते।\nएकं सांख्यं च योगं च यः पश्यति स पश्यति॥","yat sānkhyaiḥ prāpyate sthānaṁ tad yogair api gamyate\nekaṁ sānkhyaṁ cha yogaṁ cha yaḥ paśhyati sa paśhyati"],[5,6,"संन्यासस्तु महाबाहो दुःखमाप्तुमयोगतः।\nयोगयुक्तो मुनिर्ब्रह्म नचिरेणाधिगच्छति॥","sannyāsas tu mahā-bāho duḥkham āptum ayogataḥ\nyoga-yukto munir brahma na chireṇādhigachchhati"],[5,7,"योगयुक्तो विशुद्धात्मा विजितात्मा जितेन्द्रियः।\nसर्वभूतात्मभूतात्मा कुर्वन्नपि न लिप्यते॥","yoga-yukto viśhuddhātmā vijitātmā jitendriyaḥ\nsarva-bhūtātma-bhūtātmā kurvann api na lipyate"],[5,8,"नैव किंचित्करोमीति युक्तो मन्येत तत्त्ववित्।\nपश्यन् श्रृणवन्स्पृशञ्जिघ्रन्नश्नन्गच्छन्स्वपन् श्वसन्॥","naiva kiñchit karomīti yukto manyeta tattva-vit\npaśhyañ śhṛiṇvan spṛiśhañjighrann aśhnangachchhan svapañśhvasan\n pralapan visṛijan gṛihṇann unmiṣhan nimiṣhann api\nindriyāṇīndriyārtheṣhu vartanta iti dhārayan"],[5,9,"प्रलपन्विसृजन्गृह्णन्नुन्मिषन्निमिषन्नपि।\nइन्द्रियाणीन्द्रियार्थेषु वर्तन्त इति धारयन्॥","pralapan visṛjan gṛhṇann unmiṣan nimiṣann api indriyāṇīndriyārtheṣu vartanta iti dhārayan"],[5,10,"ब्रह्मण्याधाय कर्माणि सङ्गं त्यक्त्वा करोति यः।\nलिप्यते न स पापेन पद्मपत्रमिवाम्भसा॥","brahmaṇyādhāya karmāṇi saṅgaṁ tyaktvā karoti yaḥ\nlipyate na sa pāpena padma-patram ivāmbhasā"],[5,11,"कायेन मनसा बुद्ध्या केवलैरिन्द्रियैरपि।\nयोगिनः कर्म कुर्वन्ति सङ्गं त्यक्त्वाऽऽत्मशुद्धये॥","kāyena manasā buddhyā kevalair indriyair api\nyoginaḥ karma kurvanti saṅgaṁ tyaktvātma-śhuddhaye"],[5,12,"युक्तः कर्मफलं त्यक्त्वा शान्तिमाप्नोति नैष्ठिकीम्।\nअयुक्तः कामकारेण फले सक्तो निबध्यते॥","yuktaḥ karma-phalaṁ tyaktvā śhāntim āpnoti naiṣhṭhikīm\nayuktaḥ kāma-kāreṇa phale sakto nibadhyate"],[5,13,"सर्वकर्माणि मनसा संन्यस्यास्ते सुखं वशी।\nनवद्वारे पुरे देही नैव कुर्वन्न कारयन्॥","sarva-karmāṇi manasā sannyasyāste sukhaṁ vaśhī\nnava-dvāre pure dehī naiva kurvan na kārayan"],[5,14,"न कर्तृत्वं न कर्माणि लोकस्य सृजति प्रभुः।\nन कर्मफलसंयोगं स्वभावस्तु प्रवर्तते॥","na kartṛitvaṁ na karmāṇi lokasya sṛijati prabhuḥ\nna karma-phala-saṅyogaṁ svabhāvas tu pravartate"],[5,15,"नादत्ते कस्यचित्पापं न चैव सुकृतं विभुः।\nअज्ञानेनावृतं ज्ञानं तेन मुह्यन्ति जन्तवः॥","nādatte kasyachit pāpaṁ na chaiva sukṛitaṁ vibhuḥ\najñānenāvṛitaṁ jñānaṁ tena muhyanti jantavaḥ"],[5,16,"ज्ञानेन तु तदज्ञानं येषां नाशितमात्मनः।\nतेषामादित्यवज्ज्ञानं प्रकाशयति तत्परम्॥","jñānena tu tad ajñānaṁ yeṣhāṁ nāśhitam ātmanaḥ\nteṣhām āditya-vaj jñānaṁ prakāśhayati tat param"],[5,17,"तद्बुद्धयस्तदात्मानस्तन्निष्ठास्तत्परायणाः।\nगच्छन्त्यपुनरावृत्तिं ज्ञाननिर्धूतकल्मषाः॥","tad-buddhayas tad-ātmānas tan-niṣhṭhās tat-parāyaṇāḥ\ngachchhantyapunar-āvṛittiṁ jñāna-nirdhūta-kalmaṣhāḥ"],[5,18,"विद्याविनयसंपन्ने ब्राह्मणे गवि हस्तिनि।\nशुनि चैव श्वपाके च पण्डिताः समदर्शिनः॥","vidyā-vinaya-sampanne brāhmaṇe gavi hastini\nśhuni chaiva śhva-pāke cha paṇḍitāḥ sama-darśhinaḥ"],[5,19,"इहैव तैर्जितः सर्गो येषां साम्ये स्थितं मनः।\nनिर्दोषं हि समं ब्रह्म तस्माद्ब्रह्मणि ते स्थिताः॥","ihaiva tair jitaḥ sargo yeṣhāṁ sāmye sthitaṁ manaḥ\nnirdoṣhaṁ hi samaṁ brahma tasmād brahmaṇi te sthitāḥ"],[5,20,"न प्रहृष्येत्प्रियं प्राप्य नोद्विजेत्प्राप्य चाप्रियम्।\nस्थिरबुद्धिरसम्मूढो ब्रह्मविद्ब्रह्मणि स्थितः॥","na prahṛiṣhyet priyaṁ prāpya nodvijet prāpya chāpriyam\nsthira-buddhir asammūḍho brahma-vid brahmaṇi sthitaḥ"],[5,21,"बाह्यस्पर्शेष्वसक्तात्मा विन्दत्यात्मनि यत्सुखम्।\nस ब्रह्मयोगयुक्तात्मा सुखमक्षयमश्नुते॥","bāhya-sparśheṣhvasaktātmā vindatyātmani yat sukham\nsa brahma-yoga-yuktātmā sukham akṣhayam aśhnute"],[5,22,"ये हि संस्पर्शजा भोगा दुःखयोनय एव ते।\nआद्यन्तवन्तः कौन्तेय न तेषु रमते बुधः॥","ye hi sansparśha-jā bhogā duḥkha-yonaya eva te\nādyantavantaḥ kaunteya na teṣhu ramate budhaḥ"],[5,23,"शक्नोतीहैव यः सोढुं प्राक्शरीरविमोक्षणात्।\nकामक्रोधोद्भवं वेगं स युक्तः स सुखी नरः॥","śhaknotīhaiva yaḥ soḍhuṁ prāk śharīra-vimokṣhaṇāt\nkāma-krodhodbhavaṁ vegaṁ sa yuktaḥ sa sukhī naraḥ"],[5,24,"योऽन्तःसुखोऽन्तरारामस्तथान्तर्ज्योतिरेव यः।\nस योगी ब्रह्मनिर्वाणं ब्रह्मभूतोऽधिगच्छति॥","yo 'ntaḥ-sukho 'ntar-ārāmas tathāntar-jyotir eva yaḥ\nsa yogī brahma-nirvāṇaṁ brahma-bhūto 'dhigachchhati"],[5,25,"लभन्ते ब्रह्मनिर्वाणमृषयः क्षीणकल्मषाः।\nछिन्नद्वैधा यतात्मानः सर्वभूतहिते रताः॥","labhante brahma-nirvāṇam ṛiṣhayaḥ kṣhīṇa-kalmaṣhāḥ\nchhinna-dvaidhā yatātmānaḥ sarva-bhūta-hite ratāḥ"],[5,26,"कामक्रोधवियुक्तानां यतीनां यतचेतसाम्।\nअभितो ब्रह्मनिर्वाणं वर्तते विदितात्मनाम्॥","kāma-krodha-viyuktānāṁ yatīnāṁ yata-chetasām\nabhito brahma-nirvāṇaṁ vartate viditātmanām"],[5,27,"स्पर्शान्कृत्वा बहिर्बाह्यांश्चक्षुश्चैवान्तरे भ्रुवोः।\nप्राणापानौ समौ कृत्वा नासाभ्यन्तरचारिणौ॥","sparśhān kṛitvā bahir bāhyānśh chakṣhuśh chaivāntare bhruvoḥ\nprāṇāpānau samau kṛitvā nāsābhyantara-chāriṇau\n yatendriya-mano-buddhir munir mokṣha-parāyaṇaḥ\nvigatechchhā-bhaya-krodho yaḥ sadā mukta eva saḥ"],[5,28,"यतेन्द्रियमनोबुद्धिर्मुनिर्मोक्षपरायणः।\nविगतेच्छाभयक्रोधो यः सदा मुक्त एव सः॥","yatendriya-mano-buddhir  munir   mokṣa-parāyaṇaḥ vigatecchā-bhaya-krodho yaḥ sadā    mukta   eva saḥ"],[5,29,"भोक्तारं यज्ञतपसां सर्वलोकमहेश्वरम्।\nसुहृदं सर्वभूतानां ज्ञात्वा मां शान्तिमृच्छति॥","bhoktāraṁ yajña-tapasāṁ sarva-loka-maheśhvaram\nsuhṛidaṁ sarva-bhūtānāṁ jñātvā māṁ śhāntim ṛichchhati"],[6,1,"श्री भगवानुवाच\nअनाश्रितः कर्मफलं कार्यं कर्म करोति यः।\nस संन्यासी च योगी च न निरग्निर्न चाक्रियः॥","śhrī bhagavān uvācha\nanāśhritaḥ karma-phalaṁ kāryaṁ karma karoti yaḥ\nsa sannyāsī cha yogī cha na niragnir na chākriyaḥ"],[6,2,"यं संन्यासमिति प्राहुर्योगं तं विद्धि पाण्डव।\nन ह्यसंन्यस्तसङ्कल्पो योगी भवति कश्चन॥","yaṁ sannyāsam iti prāhur yogaṁ taṁ viddhi pāṇḍava\nna hyasannyasta-saṅkalpo yogī bhavati kaśhchana"],[6,3,"आरुरुक्षोर्मुनेर्योगं कर्म कारणमुच्यते।\nयोगारूढस्य तस्यैव शमः कारणमुच्यते॥","ārurukṣhor muner yogaṁ karma kāraṇam uchyate\nyogārūḍhasya tasyaiva śhamaḥ kāraṇam uchyate"],[6,4,"यदा हि नेन्द्रियार्थेषु न कर्मस्वनुषज्जते।\nसर्वसङ्कल्पसंन्यासी योगारूढस्तदोच्यते॥","yadā hi nendriyārtheṣhu na karmasv-anuṣhajjate\nsarva-saṅkalpa-sannyāsī yogārūḍhas tadochyate"],[6,5,"उद्धरेदात्मनाऽऽत्मानं नात्मानमवसादयेत्।\nआत्मैव ह्यात्मनो बन्धुरात्मैव रिपुरात्मनः॥","uddhared ātmanātmānaṁ nātmānam avasādayet\nātmaiva hyātmano bandhur ātmaiva ripur ātmanaḥ"],[6,6,"बन्धुरात्माऽऽत्मनस्तस्य येनात्मैवात्मना जितः।\nअनात्मनस्तु शत्रुत्वे वर्तेतात्मैव शत्रुवत्॥","bandhur ātmātmanas tasya yenātmaivātmanā jitaḥ\nanātmanas tu śhatrutve vartetātmaiva śhatru-vat"],[6,7,"जितात्मनः प्रशान्तस्य परमात्मा समाहितः।\nशीतोष्णसुखदुःखेष
