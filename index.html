<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prime Home Decor</title>
<meta name="description" content="Stock, purchases, sales, partners and promotion for Prime Home Decor.">
<meta name="theme-color" content="#0D6A62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prime Decor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --surface2:#F6F8F7; --line:#D8DEDB;
  --ink:#1B2627; --muted:#5B6868; --faint:#8A9695;
  --accent:#0D6A62; --accent-ink:#FFFFFF; --accent-soft:#DCEDEA;
  --gold:#B57A12; --gold-soft:#F6EAD2;
  --good:#1F7A3E; --good-soft:#DFF1E5; --warn:#9A6100; --warn-soft:#FBEBCB; --bad:#B3261E; --bad-soft:#F8DEDB;
  --shadow:0 1px 2px rgba(20,40,40,.06),0 6px 20px rgba(20,40,40,.06);
  --display:"Marcellus","Palatino Linotype",Georgia,serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1616; --surface:#172020; --surface2:#1C2727; --line:#2A3736;
    --ink:#E4ECEA; --muted:#9DAEAC; --faint:#6F807E;
    --accent:#44B3A5; --accent-ink:#0B1414; --accent-soft:#16332F;
    --gold:#E0A745; --gold-soft:#3A2E17;
    --good:#5CC983; --good-soft:#15301F; --warn:#E6B04A; --warn-soft:#382A10; --bad:#F08A80; --bad-soft:#3A1C19;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1616; --surface:#172020; --surface2:#1C2727; --line:#2A3736;
  --ink:#E4ECEA; --muted:#9DAEAC; --faint:#6F807E;
  --accent:#44B3A5; --accent-ink:#0B1414; --accent-soft:#16332F;
  --gold:#E0A745; --gold-soft:#3A2E17;
  --good:#5CC983; --good-soft:#15301F; --warn:#E6B04A; --warn-soft:#382A10; --bad:#F08A80; --bad-soft:#3A1C19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#d9dfdd 35%,#9aa6a4 70%,#6e7a78 100%);display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#233;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 2px 6px rgba(0,0,0,.15)}
.brand h1{font-size:24px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12.5px;letter-spacing:.04em}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:8px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab:hover:not([aria-selected="true"]){background:var(--surface2);color:var(--ink)}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}

.banner{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--gold-soft);color:var(--ink);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{margin:0;max-width:70ch}

section.view{padding-top:18px;display:grid;gap:18px}
.row-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.row-head h2{font-size:26px}
.row-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select.sel,input.search{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h3{font-size:18px;margin-bottom:10px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:24px;font-weight:600;margin-top:4px}
.kpi em{font-style:normal;font-size:12.5px;color:var(--muted)}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero span,.kpi.hero em{color:inherit;opacity:.85}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.sub{color:var(--muted);font-size:12.5px}
.empty{padding:28px;text-align:center;color:var(--muted)}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.plain{background:var(--surface2);color:var(--muted)}

.list{display:grid;gap:0}
.list .li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:center}
.list .li:last-child{border-bottom:0}

/* products */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.pcard:hover{border-color:var(--faint)}
.pimg{aspect-ratio:4/3;max-width:100%;background:linear-gradient(135deg,var(--surface2),var(--line));display:grid;place-items:center;color:var(--faint);font-family:var(--display);font-size:30px;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}
.pbody{padding:12px 14px;display:grid;gap:6px}
.pbody h4{margin:0;font-size:15.5px;font-weight:600}
.pmeta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.pmeta b{color:var(--ink);font-weight:600}

/* orders + gantt */
section.view>*{min-width:0}
.norate .item-row{grid-template-columns:2fr 90px 32px}
.norate .item-row label:nth-of-type(3){display:none}
.places{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.place{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:6px;align-content:start;text-align:left;cursor:pointer}
.place:hover{border-color:var(--faint)}
.place.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.place h4{margin:0;font-size:16px;font-weight:600}
.place .big{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.place .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.gantt{max-width:100%}
.grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px}
.smart h4{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.gantt{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.ghead,.grow,.gover{display:grid;grid-template-columns:minmax(170px,230px) minmax(420px,1fr)}
.ghead{position:sticky;top:0;background:var(--surface2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.ghead .glabel{padding:8px 12px}
.gscale{position:relative;height:30px}
.gtick{position:absolute;top:8px;transform:translateX(-50%);font-variant-numeric:tabular-nums;white-space:nowrap}
.gtick.m{font-weight:700;color:var(--ink)}
.gbody{position:relative}
.grow{border-bottom:1px solid var(--line);min-height:64px}
.grow:last-of-type{border-bottom:0}
.grow.late .glabel{box-shadow:inset 3px 0 0 var(--bad)}
.glabel{padding:8px 12px;position:sticky;left:0;background:var(--surface);z-index:2;border-right:1px solid var(--line);display:grid;gap:3px;min-width:0}
.glabel .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gname{font-weight:600;text-align:left;text-decoration:none;color:var(--ink)}
.gact{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.gtrack{position:relative;cursor:pointer;background-image:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/var(--days) - 1px),var(--line) calc(100%/var(--days) - 1px),var(--line) calc(100%/var(--days)))}
.gtrack:hover{background-color:var(--surface2)}
.gseg{position:absolute;top:22px;height:20px;border-radius:5px;z-index:1}
.gseg.s0{background:#9aa6a4}.gseg.s1{background:var(--gold)}.gseg.s2{background:#3b7fc4}.gseg.s3{background:var(--good)}
.gplan{position:absolute;top:18px;height:28px;border-radius:7px;border:1.5px dashed var(--faint);background:transparent}
.gplan.late{border-color:var(--bad)}
.gdue{position:absolute;top:26px;width:12px;height:12px;margin-left:-6px;transform:rotate(45deg);background:var(--ink);z-index:2;border:2px solid var(--surface)}
.gdue.late{background:var(--bad)}
.gover{position:absolute;inset:0;pointer-events:none}
.gtodaywrap{position:relative}
.gtoday{position:absolute;top:0;bottom:0;border-left:2px solid var(--bad);z-index:3}
.gtoday span{position:absolute;top:2px;left:4px;font-size:10.5px;font-weight:700;color:var(--bad);background:var(--surface);padding:0 3px;border-radius:4px}
.gkey{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.gkey.s0{background:#9aa6a4}.gkey.s1{background:var(--gold)}.gkey.s2{background:#3b7fc4}.gkey.s3{background:var(--good)}
.gkey.plan{border:1.5px dashed var(--faint)}.gkey.due{width:10px;height:10px;transform:rotate(45deg);background:var(--ink)}
.stages{display:flex;gap:6px;flex-wrap:wrap}
.stages label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--muted)}
.stages input{accent-color:var(--accent)}
.stages label:has(input:checked){border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* catalogue */
.catsec{display:grid;gap:10px}
.catsec h3{font-size:21px;display:flex;align-items:baseline;gap:10px}
.catsec h3 em{font-style:normal;font-family:var(--body);font-size:13px;color:var(--muted)}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
.ccard:hover{border-color:var(--faint)}
.ccard .pimg{aspect-ratio:1/1;border:0;padding:0;width:100%;cursor:pointer;font:inherit;font-family:var(--display);font-size:30px;color:var(--faint)}
.rtin{display:flex;align-items:center;gap:4px;margin-top:4px;border:1px solid var(--line);border-radius:9px;padding:2px 8px;background:var(--surface2)}
.rtin span{font-weight:700;color:var(--accent)}
.rtin input{border:0;background:transparent;width:100%;font-size:18px;font-weight:700;color:var(--accent);padding:4px 0;font-variant-numeric:tabular-nums}
.rtin input:focus{outline:none}.rtin:focus-within{border-color:var(--accent)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}
.cbody .btn.small{margin-top:6px;justify-content:center}
.ccard .pimg img{object-fit:contain;background:var(--surface)}
.cbody{padding:9px 11px 11px;display:grid;gap:2px;flex:1}
.cbody .code{font-size:11px;letter-spacing:.1em;color:var(--faint);font-variant-numeric:tabular-nums}
.cbody .nm{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}
.cbody .rt{margin-top:auto;padding-top:4px;font-size:19px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.cbody .rt.ask{font-size:13.5px;font-weight:600;color:var(--muted)}
.cbody .was{font-size:12px;color:var(--faint)}
.catset{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.catset label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* partners */
.partners{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.partner{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.partner h3{font-size:21px}
.partner .phone{font-size:13px;color:var(--muted)}
.partner .bal{font-size:28px;font-weight:600}
.partner .split{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13.5px}
.partner .split span:nth-child(odd){color:var(--muted)}

/* promote */
.posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;align-content:start}
.post-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.score{display:flex;align-items:baseline;gap:4px;font-family:var(--display)}
.score b{font-size:30px;color:var(--accent);font-weight:400}
.score span{color:var(--muted);font-size:14px}
.post pre{white-space:pre-wrap;font-family:var(--body);font-size:14px;margin:0;background:var(--surface2);border-radius:10px;padding:12px;max-height:320px;overflow:auto}
.post .hook{font-weight:600}
details.card{font-size:13px}
details.card summary{cursor:pointer;color:var(--muted);font-weight:600}
details.card table{min-width:0;font-size:13px;margin-top:8px}
details.card td,details.card th{padding:6px 8px}
.fest{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.fest div{background:var(--surface2);border-radius:10px;padding:10px 12px}
.fest b{display:block;font-family:var(--display);font-weight:400;font-size:17px}
.fest span{font-size:12.5px;color:var(--muted)}
.fest .soon{background:var(--gold-soft)}
.idea{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line)}
.idea:last-child{border-bottom:0}
.idea p{margin:0}

/* dialog */
dialog{border:0;border-radius:16px;padding:0;width:min(640px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,20,.45)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-head h3{font-size:21px}
.dlg-body{padding:16px 18px;display:grid;gap:12px}
.dlg-foot{display:flex;justify-content:space-between;gap:8px;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 10px;font-weight:400;font-size:15px;color:var(--ink);width:100%}
label.f.wide{grid-column:1/-1}
.items{display:grid;gap:8px}
.item-row{display:grid;grid-template-columns:2fr 70px 100px 32px;gap:8px;align-items:end}
@media (max-width:480px){.item-row{grid-template-columns:1fr 64px 90px 32px}}
.x{border:1px solid var(--line);background:var(--surface2);border-radius:8px;height:38px;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.segb{border:0;background:none;padding:8px 14px;font-weight:600;color:var(--muted);cursor:pointer}
.segb[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
table.sheet{min-width:0;font-variant-numeric:tabular-nums}
@media (max-width:560px){table.sheet{font-size:13px}table.sheet td,table.sheet th{padding:6px 7px!important}table.sheet th{letter-spacing:0}}
table.sheet td{padding:6px 12px;border-bottom:1px solid var(--line)}
table.sheet td+td,table.sheet th+th{border-left:1px solid var(--line)}
table.sheet tr.sh-head td{background:var(--accent-soft);color:var(--ink);padding-block:9px}
table.sheet tr.sh-sub td{border-top:1px solid var(--muted)}
table.sheet tr.sh-total td{background:var(--surface2)}
table.sheet tr.sh-paid td{border-bottom:2px solid var(--line);padding-bottom:10px}
table.sheet tr.sh-grand td{background:var(--accent);color:var(--accent-ink);border-bottom:0}
table.sheet tr.sh-grand .sub{color:inherit;opacity:.85}
.paybox{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--surface2)}
.paybox label.f input{background:var(--surface)}
.calc{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.calc b{font-variant-numeric:tabular-nums;text-align:right}
.imgprev{display:flex;gap:12px;align-items:center}
.imgprev img{width:84px;height:64px;object-fit:cover;border-radius:8px}
.gate{min-height:100%;display:grid;place-items:center;padding-block:40px}

/* ---------- calculations ---------- */
/* A purchase is a bill: several items, bill-level charges, and payments split between payers.
   Older single-item rows (productId/qty/rate/paidBy) are read as one-item bills. */
function normPurchase(u){
  if (Array.isArray(u.items)) return {...u, payments: u.payments || {}};
  const t = n(u.qty)*n(u.rate)+n(u.transport)+n(u.handling)+n(u.other);
  return {...u, items:[{productId:u.productId,qty:n(u.qty),rate:n(u.rate)}], payments:{[u.paidBy||'Firm']:t}};
}
function purchCalc(u){
  const items = u.items||[];
  const itemsVal = items.reduce((a,it)=>a+n(it.qty)*n(it.rate),0);
  const qtyAll = items.reduce((a,it)=>a+n(it.qty),0);
  const charges = n(u.transport)+n(u.handling)+n(u.gst)+n(u.other);
  const total = itemsVal+charges;
  const pays = u.payments||{};
  const paid = PAYERS.reduce((a,k)=>a+n(pays[k]),0);
  const landed = it => n(it.qty)*n(it.rate) + charges*(itemsVal>0 ? n(it.qty)*n(it.rate)/itemsVal : (qtyAll? n(it.qty)/qtyAll : 0));
  return {itemsVal,charges,total,paid,due:total-paid,landed,qty:qtyAll};
}
const supKey = s => String(s||'').trim().toLowerCase();
/* ---------- places: where stock is kept ---------- */
const slugify = x => String(x||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
function places(V){
  const out = [{key:'godown', name: settings.godownName || 'Main godown', kind:'godown'}];
  (settings.extraPlaces||[]).forEach(nm=>{ if (String(nm).trim()) out.push({key:'loc:'+slugify(nm), name:String(nm).trim(), kind:'godown'}); });
  PARTNERS.forEach(pt=>out.push({key:'home:'+pt.key, name:`${pt.key}'s home`, kind:'home'}));
  (V.parties||[]).filter(p=>p.type==='Reseller').sort((a,b)=>String(a.name).localeCompare(String(b.name))).forEach(p=>out.push({key:'p:'+p.id, name:p.name, kind:'reseller', partyId:p.id}));
  return out;
}
const placeName = (V,k) => (places(V).find(x=>x.key===k)||{name: k==='godown'?'Main godown':'Removed place'}).name;
function resellerPlaceFor(V,partyId){ const p = (V.parties||[]).find(x=>x.id===partyId); return p && p.type==='Reseller' ? 'p:'+p.id : null; }
function calc(V){
  const P = {};
  V.products.forEach(p=>P[p.id]={...p,inQty:0,inCost:0,soldQty:0,soldVal:0});
  const purchases = V.purchases.map(normPurchase);
  Object.values(P).forEach(p=>{ p.transit=0; p.booked=0; p.sold30=0; });
  purchases.forEach(u=>{ const pc=purchCalc(u); const moving = u.status==='In transit'; (u.items||[]).forEach(it=>{ const p=P[it.productId]; if(!p) return; if (moving){ p.transit+=n(it.qty); return; } p.inQty+=n(it.qty); p.inCost+=pc.landed(it); }); });
  const since30 = (()=>{ const x=new Date(); x.setDate(x.getDate()-30); return x.toISOString().slice(0,10); })();
  V.sales.forEach(s=>{ if ((s.date||'')>=since30) (s.items||[]).forEach(it=>{ const p=P[it.productId]; if(p) p.sold30+=n(it.qty); }); });
  (V.orders||[]).forEach(o=>{ if (stageIdx(o.stage)<STAGE_DELIVERED) (o.items||[]).forEach(it=>{ const p=P[it.productId]; if(p) p.booked+=n(it.qty); }); });
  Object.values(P).forEach(p=>{ p.avgCost = p.inQty>0 ? p.inCost/p.inQty : n(p.cost); });
  V.sales.forEach(s=>(s.items||[]).forEach(it=>{ const p=P[it.productId]; if(!p) return; p.soldQty+=n(it.qty); p.soldVal+=n(it.qty)*n(it.rate); }));
  Object.values(P).forEach(p=>{ p.qty = n(p.opening)+p.inQty-p.soldQty; p.value = Math.max(p.qty,0)*p.avgCost; p.free = p.qty-p.booked; });
  // where each piece is: opening stock and received purchases start in a place, sales leave from one, moves shift between two
  Object.values(P).forEach(p=>{ p.loc = {godown: n(p.opening)}; });
  const add = (pid,k,q) => { const p=P[pid]; if(!p) return; p.loc[k] = (p.loc[k]||0) + q; };
  purchases.forEach(u=>{ if (u.status==='In transit') return; (u.items||[]).forEach(it=>add(it.productId, u.location||'godown', n(it.qty))); });
  V.sales.forEach(s=>(s.items||[]).forEach(it=>add(it.productId, s.fromLoc||'godown', -n(it.qty))));
  (V.moves||[]).forEach(m=>(m.items||[]).forEach(it=>{ add(it.productId, m.from||'godown', -n(it.qty)); add(it.productId, m.to||'godown', n(it.qty)); }));
  const saleCalc = s => {
    const gross = (s.items||[]).reduce((a,it)=>a+n(it.qty)*n(it.rate),0);
    const net = gross - n(s.discount);
    const cogs = (s.items||[]).reduce((a,it)=>a+n(it.qty)*(P[it.productId]?.avgCost||0),0);
    const costs = n(s.transport)+n(s.handling);
    return {gross,net,cogs,costs,profit:net-cogs-costs,due:net-n(s.received)};
  };
  return {P,saleCalc,purchases};
}
function inPeriod(date, p){
  if (p==='all' || !date) return true;
  const d = new Date(date+'T00:00:00'), now = new Date();
  if (p==='month') return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  if (p==='last'){ const l=new Date(now.getFullYear(),now.getMonth()-1,1); return d.getFullYear()===l.getFullYear() && d.getMonth()===l.getMonth(); }
  if (p==='fy'){ const fyStart = new Date(now.getMonth()>=3?now.getFullYear():now.getFullYear()-1,3,1); return d>=fyStart; }
  return true;
}
const PERIODS = {month:'This month',last:'Last month',fy:'This financial year',all:'All time'};

      <div class="controls"><input class="search" id="fixCode" placeholder="Code" autocomplete="off" autocapitalize="characters" style="width:130px;text-transform:uppercase" aria-label="Code"><button class="btn small primary" id="fixGo">Apply</button></div></div>`;

  }

  const V = view(), C = calc(V);

}

function periodSelect(){ return `<select class="sel" id="periodSel" aria-label="Period">${Object.entries(PERIODS).map(([k,l])=>`<option value="${k}" ${k===period?'selected':''}>${l}</option>`).join('')}</select>`; }

function dash(V,C){
  const S = V.sales.filter(s=>inPeriod(s.date,period));
  let net=0,cogs=0,saleCosts=0,disc=0,cust=0,resl=0;
  S.forEach(s=>{ const c=C.saleCalc(s); net+=c.net; cogs+=c.cogs; saleCosts+=c.costs; disc+=n(s.discount); if(partyType(V,s.partyId)==='Reseller') resl+=c.net; else cust+=c.net; });
  const exp = V.expenses.filter(e=>inPeriod(e.date,period)).reduce((a,e)=>a+n(e.amount),0);
  const gross = net-cogs, netProfit = gross-saleCosts-exp;
  const stockVal = Object.values(C.P).reduce((a,p)=>a+p.value,0);
  const recv = V.sales.reduce((a,s)=>a+Math.max(C.saleCalc(s).due,0),0);
  const margin = net>0 ? Math.round(gross/net*100) : 0;

  // monthly series, last 6 months
  const now = new Date(); const months=[];
  for(let i=5;i>=0;i--){ const m=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({y:m.getFullYear(),m:m.getMonth(),sales:0,profit:0}); }
  V.sales.forEach(s=>{ const d=new Date(s.date+'T00:00:00'); const b=months.find(x=>x.y===d.getFullYear()&&x.m===d.getMonth()); if(b){const c=C.saleCalc(s); b.sales+=c.net; b.profit+=c.profit;} });
  V.expenses.forEach(e=>{ const d=new Date(e.date+'T00:00:00'); const b=months.find(x=>x.y===d.getFullYear()&&x.m===d.getMonth()); if(b) b.profit-=n(e.amount); });

  const top = {}; S.forEach(s=>(s.items||[]).forEach(it=>{ top[it.productId]=(top[it.productId]||0)+n(it.qty)*n(it.rate); }));
  const topList = Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const low = Object.values(C.P).filter(p=>p.qty<=n(p.reorder)).sort((a,b)=>a.qty-b.qty);

function splitBar(c,r){
  const t=c+r, pc = t? Math.round(c/t*100):0;
  return `<div style="display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2)"><div style="width:${pc}%;background:var(--accent)"></div><div style="width:${100-pc}%;background:var(--gold)"></div></div>
  <div class="list" style="margin-top:6px"><div class="li"><span><span class="pill acc">Customers</span></span><b class="num">${rs(c)} · ${pc}%</b></div><div class="li"><span><span class="pill gold">Resellers</span></span><b class="num">${rs(r)} · ${100-pc}%</b></div></div>`;
}
function chart(months){
  const W=560,H=230,L=58,R=12,T=14,B=28, iw=W-L-R, ih=H-T-B;
  const maxV = Math.max(1,...months.map(m=>Math.max(m.sales,m.profit)));
  const minV = Math.min(0,...months.map(m=>m.profit));
  const step = niceStep((maxV-minV)/4);
  const top = Math.ceil(maxV/step)*step, bot = Math.floor(minV/step)*step;
  const y = v => T + ih - (v-bot)/(top-bot)*ih;
  const bw = iw/months.length;
  let g='';
  for(let v=bot; v<=top+0.001; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`; }
  let bars='', pts=[];
  months.forEach((m,i)=>{ const x=L+i*bw; const h=y(bot<0?0:bot)-y(m.sales);
    bars+=`<rect x="${x+bw*.2}" y="${y(Math.max(m.sales,0))}" width="${bw*.6}" height="${Math.max(h,0)}" rx="4" fill="var(--accent)" opacity=".85"><title>${MONTHS[m.m]}: sales ${rs(m.sales)}, profit ${rs(m.profit)}</title></rect>`;
    bars+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${MONTHS[m.m]}</text>`;
    pts.push([x+bw/2,y(m.profit)]); });
  const line = `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>` + pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3.5}" fill="var(--gold)" stroke="var(--surface)" stroke-width="2"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly net sales and net profit">${g}${bars}${line}</svg>`;
}
function niceStep(x){ if(x<=0) return 1000; const p=Math.pow(10,Math.floor(Math.log10(x))); const f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function short(v){ const a=Math.abs(v); const s=v<0?'-':''; if(a>=100000) return s+'₹'+(a/100000).toFixed(a%100000?1:0)+'L'; if(a>=1000) return s+'₹'+(a/1000).toFixed(a%1000?1:0)+'k'; return s+'₹'+a; }
function stockPill(p){ const q=p.qty; return q<=0?`<span class="pill bad">Out · ${q}</span>`: q<=n(p.reorder)?`<span class="pill warn">Low · ${q}</span>`:`<span class="pill good">${q} in stock</span>`; }

/* ---------- orders: customer orders, Gantt timeline, smart alerts ---------- */
const STAGES = ['Taken','Packed','Dispatched','Delivered','Paid'];
const STAGE_LABEL = {Taken:'Order taken',Packed:'Packed',Dispatched:'Dispatched',Delivered:'Delivered',Paid:'Paid'};
const STAGE_DELIVERED = 3;
const stageIdx = st => Math.max(0, STAGES.indexOf(st||'Taken'));
const dayMs = 864e5;
const toDay = s => s ? Math.round(new Date(s+'T00:00:00').getTime()/dayMs) : null;
const fromDay = d => new Date(d*dayMs).toISOString().slice(0,10);
const addDays = (s,k) => fromDay(toDay(s)+k);
let orderFilter = 'open', ganttDays = 30, ganttStart = null;
try { const g = +localStorage.getItem('phd-gdays'); if ([14,30,90].includes(g)) ganttDays = g; } catch(e){}
function orderTotal(o){ return (o.items||[]).reduce((a,it)=>a+n(it.qty)*n(it.rate),0) - n(o.discount); }
function orderInfo(o){
  const i = stageIdx(o.stage), t = toDay(today()), due = toDay(o.dueDate);
  const open = i < STAGE_DELIVERED;
  const late = open && due!=null && due < t;
  const lateBy = late ? t-due : 0;
  const soon = open && !late && due!=null && due-t <= 2;
  return {i, open, late, lateBy, soon, unpaid: i===STAGE_DELIVERED};
}
function orderName(V,o){ return partyName(V,o.partyId); }
function itemsShort(C,o){ const it=o.items||[]; return it.slice(0,2).map(x=>`${prodName(C,x.productId)} × ${n(x.qty)}`).join(', ') + (it.length>2?` +${it.length-2} more`:''); }

/* how late a purchase is: in transit past its expected date, or waiting a week with no date */
function purchDelay(u){
  const t = toDay(today());
  if (u.status==='In transit'){
    if (u.eta){ const d = t - toDay(u.eta); return {open:true, late:d>0, lateBy:Math.max(d,0), soon:d<=0 && d>=-2, noDate:false, waited:t-(toDay(u.date)??t)}; }
    const w = t-(toDay(u.date)??t); return {open:true, late:false, lateBy:0, soon:false, noDate:w>=7, waited:w};
  }
  const came = u.receivedOn && u.eta ? toDay(u.receivedOn)-toDay(u.eta) : 0;
  return {open:false, cameLate: came>0 ? came : 0};
}
/* the sale that a delivered order turns into: it reduces stock and records the money */
function orderSale(o){
  return {id:'so-'+o.id, date:(o.stageDates||{}).Delivered || today(), partyId:o.partyId||'', items:(o.items||[]).map(x=>({...x})),
    discount:n(o.discount), transport:n(o.transport), handling:0, received:n(o.received), receivedBy:o.receivedBy||'', mode:o.mode||'UPI', fromLoc:o.fromLoc||'godown',
    note:`From order of ${dmy(o.orderDate)}`, fromOrder:o.id};
}
async function syncOrderSale(o){
  const i = stageIdx(o.stage);
  if (i >= STAGE_DELIVERED){ await saveDoc('sales', orderSale(o)); }
  else if (data.sales.some(s=>s.id==='so-'+o.id)){ await delDoc('sales','so-'+o.id); }
}
async function advanceOrder(id){
  const o = data.orders.find(x=>x.id===id); if (!o) return;
  const i = stageIdx(o.stage); if (i >= STAGES.length-1) return;
  const next = STAGES[i+1];
  if (next==='Paid'){ openForm('orders', id, 'Paid'); return; }  // asks how much and who got the money
  const upd = {...o, stage:next, stageDates:{...(o.stageDates||{}), [next]:today()}};
  await saveDoc('orders', upd); await syncOrderSale(upd);
  toast(next==='Delivered' ? 'Delivered. Stock reduced and the sale is recorded.' : `Moved to ${STAGE_LABEL[next]}`);
}

/* smart lists, shared by the Dashboard and the Orders tab */
function smartLists(V,C){
  const t = toDay(today());
  const late = (V.orders||[]).map(o=>({o,f:orderInfo(o)})).filter(x=>x.f.late).sort((a,b)=>b.f.lateBy-a.f.lateBy);
  const soon = (V.orders||[]).map(o=>({o,f:orderInfo(o)})).filter(x=>x.f.soon);
  const pd = C.purchases.map(u=>({u, d:purchDelay(u)})).filter(x=>x.d.open);
  const transitLate = pd.filter(x=>x.d.late).sort((a,b)=>b.d.lateBy-a.d.lateBy);
  const transitNoDate = pd.filter(x=>x.d.noDate).sort((a,b)=>b.d.waited-a.d.waited);
  const transitSoon = pd.filter(x=>x.d.soon);
  const reorder = Object.values(C.P).filter(p=>p.catalogue!=='No').map(p=>{
    const perDay = p.sold30/30, have = p.free + p.transit;
    const cover = perDay>0 ? have/perDay : Infinity;
    const want = Math.max(Math.ceil(perDay*45 - have), 0);
    const short = Math.max(-have, 0);                      // booked orders that stock + transit can't cover
    const need = (perDay>0 && cover < 21 && want>0) || short>0;
    return {p, perDay, have, cover, buy: Math.max(want, short), need};
  }).filter(x=>x.need && x.buy>0).sort((a,b)=>a.cover-b.cover).slice(0,8);
  const resellers = V.parties.filter(p=>p.type==='Reseller').map(p=>{
    const bills = V.sales.filter(s=>s.partyId===p.id);
    let due = 0, oldest = null;
    bills.forEach(s=>{ const d = C.saleCalc(s).due; if (d>0.5){ due+=d; if(!oldest || s.date<oldest) oldest=s.date; } });
    const last = bills.reduce((a,s)=>(s.date||'')>a?s.date:a,'');
    const daysDue = oldest ? t-toDay(oldest) : 0, quiet = last ? t-toDay(last) : null;
    let why = '';
    const key = 'p:'+p.id, held = Object.values(C.P).reduce((a,x)=>a+Math.max(x.loc?.[key]||0,0),0), since = heldSince(V,key,C.P), heldDays = since ? t-toDay(since) : 0;
    if (due>0.5 && daysDue>=15) why = `${rs(due)} unpaid for ${daysDue} days`;
    else if (held && heldDays>=30) why = `Holding ${held} pcs for ${heldDays} days`;
    else if (quiet!=null && quiet>=45) why = `No order for ${quiet} days`;
    return {p, due, daysDue, quiet, why};
  }).filter(x=>x.why).sort((a,b)=>b.due-a.due || (b.quiet||0)-(a.quiet||0));
  return {late, soon, transitLate, transitNoDate, transitSoon, reorder, resellers};
}

  const li = (a,b) => `<div class="li"><span>${a}</span>${b}</div>`;

  <div class="grid-3">

      ${L.soon.length?L.soon.slice(0,3).map(x=>li(`<button type="button" class="linkbtn" data-edit="orders" data-id="${x.o.id}">${esc(orderName(V,x.o))}</button><div class="sub">due ${dmy(x.o.dueDate)}</div>`,'<span class="pill warn">Due soon</span>')).join(''):''}
      </div></div>
    <div><h4>Purchase delays</h4><div class="list">${(L.transitLate.length||L.transitNoDate.length)? L.transitLate.map(x=>li(`<button type="button" class="linkbtn" data-edit="purchases" data-id="${x.u.id}">${esc(x.u.supplier||'Supplier')}</button><div class="sub">${esc(itemsOf(x.u))} · expected ${dmy(x.u.eta)}</div>`,`<span class="pill bad">${x.d.lateBy} day${x.d.lateBy===1?'':'s'} late</span>`)).join('') + L.transitNoDate.map(x=>li(`<button type="button" class="linkbtn" data-edit="purchases" data-id="${x.u.id}">${esc(x.u.supplier||'Supplier')}</button><div class="sub">${esc(itemsOf(x.u))} · ordered ${dmy(x.u.date)}</div>`,`<span class="pill warn">${x.d.waited} days, no arrival date</span>`)).join('') : '<p class="sub">All goods on the way are on time.</p>'}
      ${L.transitSoon.map(x=>li(`<button type="button" class="linkbtn" data-edit="purchases" data-id="${x.u.id}">${esc(x.u.supplier||'Supplier')}</button><div class="sub">expected ${dmy(x.u.eta)}</div>`,'<span class="pill acc">Arriving soon</span>')).join('')}
      ${compact?'':'<p class="sub" style="margin:6px 0 0">Call the supplier for anything late. Goods without an expected date are flagged after a week: open the bill and add one.</p>'}</div></div>
    <div><h4>Reorder suggestions</h4><div class="list">${L.reorder.length? L.reorder.map(x=>li(`${esc(x.p.name)}<div class="sub">${x.perDay>0?`sells ${(x.perDay*7).toFixed(1)} a week · ${x.have<=0?'none free':Number.isFinite(x.cover)?`${Math.floor(x.cover)} days left`:''}`:`${x.p.booked} booked, only ${Math.max(x.p.qty,0)} in stock`}</div>`,`<span class="pill acc">Buy ${x.buy}</span>`)).join('') : '<p class="sub">Stock, orders and goods on the way cover the next 3 weeks of sales.</p>'}</div>
      ${compact?'':'<p class="sub" style="margin:6px 0 0">Based on the last 30 days of sales, free stock (stock minus booked orders) and goods in transit. Suggested to cover 45 days.</p>'}</div>
    <div><h4>Reseller follow-ups</h4><div class="list">${L.resellers.length? L.resellers.slice(0,6).map(x=>li(`${esc(x.p.name)}${x.p.phone?`<div class="sub num">${esc(x.p.phone)}</div>`:''}`,`<span class="pill ${x.due>0.5?'warn':'plain'}">${x.why}</span>`)).join('') : '<p class="sub">No reseller owes money for 15+ days, holds stock for 30+ days, or has gone quiet for 45+ days.</p>'}</div></div>
  </div></div>`;

function ganttHtml(V,C,list){
  const t = toDay(today());
  if (ganttStart==null) ganttStart = t - Math.round(ganttDays*0.3);
  const s0 = ganttStart, s1 = s0 + ganttDays;
  const pct = d => (Math.min(Math.max(d,s0),s1)-s0)/ganttDays*100;
  const step = ganttDays<=14?1:ganttDays<=30?2:7;
  let ticks='';
  for (let d=s0; d<=s1; d++){
    const dt = new Date(d*dayMs), first = dt.getUTCDate()===1;
    if ((d-s0)%step===0 || first) ticks += `<span class="gtick${first?' m':''}" style="left:${(d-s0)/ganttDays*100}%">${first?MONTHS[dt.getUTCMonth()]:dt.getUTCDate()}</span>`;
  }
  const todayLine = (t>=s0&&t<=s1)?`<div class="gtoday" style="left:${pct(t)}%"><span>Today</span></div>`:'';
  const rows = list.map(o=>{
    const f = orderInfo(o), sd = o.stageDates||{};
    const start = toDay(o.orderDate) ?? t;
    const endDone = f.i>=STAGE_DELIVERED ? (toDay(sd.Delivered)??t) : Math.max(t, toDay(o.dueDate)??t);
    let segs=''; 
    for (let k=0;k<=Math.min(f.i,STAGE_DELIVERED);k++){
      const a = toDay(sd[STAGES[k]]) ?? (k===0?start:null); if (a==null) continue;
      let b = null; for (let m=k+1;m<=STAGE_DELIVERED;m++){ if (sd[STAGES[m]]) { b = toDay(sd[STAGES[m]]); break; } }
      if (b==null) b = k===f.i ? (f.open ? t : a) : a;
      const L = pct(a), R = pct(Math.max(b,a)+ (k===f.i&&!f.open?1:0));
      if (R>L || k===f.i) segs += `<span class="gseg s${k}" style="left:${L}%;width:${Math.max(R-L,0.8)}%" title="${STAGE_LABEL[STAGES[k]]} from ${dmy(fromDay(a))}"></span>`;
    }
    const plan = toDay(o.dueDate);
    const planBar = plan!=null && f.open ? `<span class="gplan${f.late?' late':''}" style="left:${pct(start)}%;width:${Math.max(pct(plan+1)-pct(start),0.8)}%"></span>` : '';
    const dueMark = plan!=null && plan>=s0 && plan<=s1 ? `<span class="gdue${f.late?' late':''}" style="left:${pct(plan)}%" title="Promised for ${dmy(o.dueDate)}"></span>` : '';
    const next = f.i < STAGES.length-1 ? STAGES[f.i+1] : null;
    const tag = f.late?`<span class="pill bad">${f.lateBy}d late</span>`: f.soon?'<span class="pill warn">Due soon</span>': f.unpaid?'<span class="pill warn">Payment due</span>': f.i===4?'<span class="pill good">Done</span>':`<span class="pill plain">${STAGE_LABEL[o.stage||'Taken']}</span>`;
    return `<div class="grow${f.late?' late':''}">
      <div class="glabel"><button type="button" class="linkbtn gname" data-edit="orders" data-id="${o.id}">${esc(orderName(V,o))}</button>
        <div class="sub">${esc(itemsShort(C,o))} · ${rs(orderTotal(o))}</div>
        <div class="gact">${tag}${next?`<button type="button" class="btn small" data-advance="${o.id}">→ ${STAGE_LABEL[next]}</button>`:''}</div></div>
      <div class="gtrack" data-edit="orders" data-id="${o.id}" role="button" tabindex="0" aria-label="Open order for ${esc(orderName(V,o))}">${planBar}${segs}${dueMark}</div></div>`;
  }).join('');

function catRate(p){
  if (n(p.catRate) > 0) return n(p.catRate);

function squareJpeg(src, size){
  return new Promise(res=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); c.width=c.height=size; const g=c.getContext('2d'); g.fillStyle='#ffffff'; g.fillRect(0,0,size,size);
    const s=Math.min(size/im.naturalWidth,size/im.naturalHeight); const w=im.naturalWidth*s,h=im.naturalHeight*s; g.drawImage(im,(size-w)/2,(size-h)/2,w,h); try{res(c.toDataURL('image/jpeg',.82));}catch(e){res(null);} }; im.onerror=()=>res(null); im.src=src; });
}

function supplierList(C){

  C.purchases.forEach(u=>{ const k=supKey(u.supplier); const e=m.get(k)||{key:k,names:{},bills:0,total:0}; const nm=String(u.supplier||'').trim(); e.names[nm]=(e.names[nm]||0)+1; e.bills++; e.total+=purchCalc(u).total; m.set(k,e); });
  return [...m.values()].map(e=>({...e,name:Object.entries(e.names).sort((a,b)=>b[1]-a[1])[0][0]||'No supplier name'})).sort((a,b)=>a.name.localeCompare(b.name));
}

/* Statement: the notebook layout. Each bill = date, item lines (qty x rate = amount), subtotal,

const CHARGE_LINES = [['transport','Shipping / courier'],['handling','Packing / handling'],['gst','GST'],['other','Other charges']];
function statementRows(bills, C){
  const out = []; // {kind, ...}
  [...bills].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(u=>{
    const pc = purchCalc(u), p = u.payments||{};
    out.push({kind:'head', id:u.id, date:u.date, supplier:u.supplier||'', billNo:u.billNo||''});
    (u.items||[]).forEach((it,i)=>out.push({kind:'item', no:i+1, name:prodName(C,it.productId), qty:n(it.qty), rate:n(it.rate), amt:n(it.qty)*n(it.rate)}));
    out.push({kind:'sub', amt:pc.itemsVal});
    CHARGE_LINES.forEach(([k,l])=>{ if (n(u[k])) out.push({kind:'charge', name:l, amt:n(u[k])}); });
    out.push({kind:'total', amt:pc.total});
    out.push({kind:'paid', text:PAYERS.filter(k=>n(p[k])>0).map(k=>`${k} ${rs(p[k])}`).join(' · ') || 'Not paid', due:pc.due});
  });
  return out;
}

/* pieces this record takes out of a place that the place doesn't have (counting the record's old version back in when editing) */
function shortAt(o, from, col){
  const V = {...data, [col]: (data[col]||[]).filter(x=>x.id!==o.id)}; const C = calc(V);
  const want = {}; (o.items||[]).forEach(i=>{ want[i.productId]=(want[i.productId]||0)+n(i.qty); });
  return Object.entries(want).map(([pid,w])=>({pid, name:C.P[pid]?.name||'Product', want:w, have:Math.max(C.P[pid]?.loc?.[from]||0,0)})).filter(x=>x.want>x.have);
}

function readForm(){
  const o = {...current.rec};
  form.querySelectorAll('[name]').forEach(el=>{ if (el.type==='radio'){ if (el.checked) o[el.name]=el.value; return; } o[el.name] = el.type==='number' ? (el.value===''? '' : n(el.value)) : el.value; });
  if (current.col==='purchases'){
    o.supplier = String(o.supplier||'').trim();
    o.payments = {};
    [['Anita','payAnita'],['Neha','payNeha'],['Firm','payFirm']].forEach(([k,f])=>{ if(n(o[f])>0) o.payments[k]=n(o[f]); delete o[f]; });
    ['productId','qty','rate','paidBy'].forEach(k=>delete o[k]);
  }
  if (current.col==='sales' || current.col==='purchases' || current.col==='orders' || current.col==='moves'){
    o.items = [...form.querySelectorAll('.item-row')].map(r=>({productId:r.querySelector('[data-k=productId]').value, qty:n(r.querySelector('[data-k=qty]').value), rate:n(r.querySelector('[data-k=rate]').value)})).filter(i=>i.qty>0);
  }
  return o;
}
function defaultRate(pid){
  const p = data.products.find(x=>x.id===pid); if(!p) return '';
  if (current?.col==='purchases'){
    // last rate paid for this product, else its cost
    let last=null; data.purchases.map(normPurchase).forEach(u=>(u.items||[]).forEach(it=>{ if(it.productId===pid && n(it.rate)>0 && (!last || (u.date||'')>=last.date)) last={date:u.date||'',rate:n(it.rate)}; }));
    return last ? last.rate : (n(p.cost)||'');
  }
  const party = data.parties.find(x=>x.id===form.querySelector('[name=partyId]')?.value);
  return party?.type==='Reseller' && n(p.resellerPrice) ? n(p.resellerPrice) : n(p.price);
}
function fillRates(force){
  form.querySelectorAll('.item-row').forEach(r=>{ const rate=r.querySelector('[data-k=rate]'); if(force || rate.value===''){ const d=defaultRate(r.querySelector('[data-k=productId]').value); if(d) rate.value=d; } });
}
function updateCalc(){
  const box = document.getElementById('calcBox'); if(!box || !current) return;
  const o = readForm();
  if (current.col==='purchases'){
    const pc = purchCalc(o);
    const bal = pc.due>0.5 ? `<span>Still owed to supplier</span><b style="color:var(--warn)">${rs(pc.due)}</b>` : pc.due<-0.5 ? `<span>Paid more than the bill</span><b style="color:var(--bad)">${rs(-pc.due)}</b>` : `<span>Bill fully paid</span><b style="color:var(--good)">✓</b>`;
    box.innerHTML = `<span>Items value</span><b>${rs(pc.itemsVal)}</b><span>Shipping, packing, GST, other</span><b>${rs(pc.charges)}</b><span>Bill total</span><b>${rs(pc.total)}</b><span>Paid (Anita ${rs(o.payments.Anita)} + Neha ${rs(o.payments.Neha)}${o.payments.Firm?` + firm ${rs(o.payments.Firm)}`:''})</span><b>${rs(pc.paid)}</b>${bal}<span class="sub">Charges are spread over the items by value, so each piece's landed cost includes its share.</span><span></span>`;
  } else if (current.col==='moves'){
    const short = shortAt(o, o.from, 'moves');
    box.innerHTML = `<span>Pieces moving</span><b>${(o.items||[]).reduce((a,i)=>a+n(i.qty),0)}</b><span>${esc(placeName(data,o.from))} → ${esc(placeName(data,o.to))}</span><b></b>${short.map(x=>`<span style="color:var(--bad)">Only ${x.have} of ${esc(x.name)} at ${esc(placeName(data,o.from))}</span><b style="color:var(--bad)">need ${x.want}</b>`).join('')}`;
  } else if (current.col==='orders'){
    const tot = orderTotal(o);
    box.innerHTML = `<span>Order value</span><b>${rs(tot)}</b><span>Received so far</span><b>${rs(o.received)}</b><span>Still to collect</span><b>${rs(Math.max(tot-n(o.received),0))}</b>`;
  } else if (current.col==='sales'){

function shrink(file, max, q){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = ()=>{ const s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      const dataUrl=c.toDataURL('image/jpeg',q); c.toBlob(b=>res({blob:b,url:URL.createObjectURL(b),dataUrl}),'image/jpeg',q); URL.revokeObjectURL(url); };
    im.onerror = rej; im.src = url;
  });
}

/* Old single-item purchase rows from the same date and supplier become one bill,
   with each partner's share kept as their payment. Same ids every time, so restoring twice replaces, not duplicates. */
function groupRows(rows){
  const bills = new Map(), out = [];
  rows.forEach(u=>{
    if (!u || Array.isArray(u.items)) { if(u) out.push(u); return; }
    const k = (u.date||'') + '|' + supKey(u.supplier);
    const slug = supKey(u.supplier).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'nosupplier';
    let b = bills.get(k);
    if (!b){ b = {id:`b-${u.date}-${slug}`,date:u.date,supplier:String(u.supplier||'').trim(),billNo:'',items:[],transport:0,handling:0,other:0,payments:{},note:'',sourceRows:[]}; bills.set(k,b); }
    const t = n(u.qty)*n(u.rate)+n(u.transport)+n(u.handling)+n(u.other);
    const who = u.paidBy||'Firm'; b.payments[who] = Math.round(((b.payments[who]||0)+t)*100)/100;
    b.items.push({productId:u.productId,qty:n(u.qty),rate:n(u.rate)});
    b.transport+=n(u.transport); b.handling+=n(u.handling); b.other+=n(u.other); b.sourceRows.push(u.id);
  });
  return [...out, ...bills.values()];
}
/* Restore a backup file: adds its records, replacing any with the same id. Nothing is deleted. */
let pendingImport = null;
function readImport(file){
  const r = new FileReader();
  r.onload = () => {
    let j; try { j = JSON.parse(r.result); } catch(e){ toast('That file is not a Prime Home Decor backup.'); return; }
    const counts = COLS.map(c=>[c, !Array.isArray(j[c]) ? 0 : (c==='purchases' ? groupRows(j[c]) : j[c]).filter(x=>x&&x.id).length]).filter(x=>x[1]);
    if (!counts.length){ toast('That file has no records to restore.'); return; }
    pendingImport = j; current = null;
    form.innerHTML = `<div class="dlg-head"><h3>Restore backup</h3><button type="button" class="btn small" id="dlgClose">Close</button></div>
      <div class="dlg-body"><p style="margin:0">This adds the records below to the shared books. A record that's already here with the same id is replaced. Nothing else is deleted.</p>
      <div class="calc">${counts.map(([c,k])=>`<span>${c[0].toUpperCase()+c.slice(1)}</span><b>${k}</b>`).join('')}<span>Product photos</span><b>${Object.keys(j.images||{}).length}</b></div>
      ${j.images ? '' : `<p class="sub" style="margin:0">This file was made before photos were included in backups, so it has no photos. Products keep any photo that's already in this app.</p>`}
      <p class="sub" id="impProg" style="margin:0"></p></div>
      <div class="dlg-foot"><span></span><button type="button" class="btn primary" id="impGo">Restore ${counts.reduce((a,x)=>a+x[1],0)} records</button></div>`;
    dlg.showModal();
  };
  r.readAsText(file);

/* ---------- photos: read them out for a backup, put them back on restore ---------- */
const blobToDataUrl = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); });
async function dataUrlToBlob(u){ const [h,b64]=u.split(','); const mime=(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg'; const bin=atob(b64); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type:mime}); }
function imgToDataUrl(src){ // fallback when fetch can't read the photo: draw it and re-save as JPEG
  return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; c.getContext('2d').drawImage(im,0,0); try{res(c.toDataURL('image/jpeg',.9));}catch(e){rej(e);} }; im.onerror=rej; im.src=src; });
}
async function readPhoto(p){
  if (p.img) return p.img;                       // photo kept inside the record (browser-only mode)
  if (!p.imageId) return null;
  return await getPhotoUrl(p.imageId);
}
async function photoExists(id){ return !!(await getPhotoUrl(id)); }
async function shrinkDataUrl(u, max, q){ const b = await dataUrlToBlob(u); return (await shrink(b, max, q)).dataUrl; }

async function runImport(btn){
  const j = pendingImport; if (!j) return;
  btn.disabled = true; demo = false;
  const prog = document.getElementById('impProg');
  const photos = j.images || {};
  let photoOk = 0, photoSkip = 0;
  // put photos back first, so the products point at photos that exist here
  const prods = (j.products||[]).filter(p=>p&&p.id).map(p=>({...p}));
  for (const p of prods){
    const d = p.imageId && photos[p.imageId]; if (!d) continue;
    prog.textContent = `Restoring photos ${photoOk+photoSkip+1}…`;
    if (await photoExists(p.imageId)) { photoOk++; continue; }
    try {
      if (assets){ const r = await assets.upload(await dataUrlToBlob(d), {type:(d.match(/data:([^;]+)/)||[])[1]||'image/jpeg'}); p.imageId = r.id; delete p.img; photoOk++; }
      else { p.img = await shrinkDataUrl(d, 480, .7); delete p.imageId; photoOk++; }
    } catch(e){ photoSkip++; }
  }
  const all = []; COLS.forEach(c=>(c==='products' ? prods : c==='purchases' ? groupRows(j[c]||[]) : (j[c]||[])).forEach(x=>{ if(x&&x.id) all.push([c,x]); })); (j.orders||[]).forEach(x=>{ if(x&&x.id) all.push(['orders',x]); }); (j.moves||[]).forEach(x=>{ if(x&&x.id) all.push(['moves',x]); });
  let done = 0;
  for (const [c,x] of all){
    if (!(await saveDoc(c,x))) { prog.textContent = `Stopped after ${done} of ${all.length}. Try again to finish.`; btn.disabled=false; return; }
    done++; if (done%5===0) prog.textContent = `Restored ${done} of ${all.length}…`;
  }
  if (j.settings){ settings = {shareAnita:50,...j.settings}; await saveSettings(); }
  pendingImport = null; dlg.close();
  toast(`Restored ${done} records${photoOk?` and ${photoOk} photos`:''}${photoSkip?`. ${photoSkip} photos could not be restored`:''}`);
}

let busy = false;
async function backup(){
  if (busy) return; busy = true;
  const btn = document.getElementById('backupBtn'); const label = btn.textContent;
  try {
    const images = {}; let missing = 0, i = 0;
    // photos stored as assets are read out here; a photo kept inside a product record (p.img) is already in the record
    const withPhoto = data.products.filter(p=>p.imageId);
    for (const p of withPhoto){
      btn.textContent = `Packing photos ${++i}/${withPhoto.length}`;
      const d = await readPhoto({imageId:p.imageId}); if (d) images[p.imageId] = d; else missing++;
    }
    btn.textContent = 'Saving…';
    const payload = JSON.stringify({app:'Prime Home Decor Desk', version:2, exported:new Date().toISOString(), ...data, settings, images});
    await downloads.save({filename:`prime-home-decor-backup-${today()}.json`, data:new Blob([payload],{type:'application/json'})});
    toast(`Backup saved with ${Object.keys(images).length} photos${missing?`. ${missing} photos could not be read`:''}`);
  } catch(e){ toast(e?.code==='declined' ? 'Backup was not saved.' : 'Backup could not be made. Try again.'); }
  finally { btn.textContent = label; busy = false; }
}

/* A ZIP of every product photo, named "Product - Rs price.jpg", ready for WhatsApp or Instagram. */
async function photoZip(btn){
  if (busy) return;
  if (!window.JSZip){ toast('The photo packer did not load. Check your connection and reload.'); return; }
  busy = true; const label = btn.textContent;
  try {
    const zip = new JSZip(); const used = new Set(); let n2 = 0, missing = 0;
    const withPhoto = data.products.filter(p=>p.imageId || p.img);
    for (const p of withPhoto){
      btn.textContent = `Packing ${n2+missing+1}/${withPhoto.length}`;
      const d = await readPhoto(p); if (!d){ missing++; continue; }
      const ext = /image\/png/.test(d)?'png':/image\/webp/.test(d)?'webp':'jpg';
      let base = (p.name||'Product').trim().replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ') + (n(p.price)?` - Rs ${n(p.price)}`:'');
      let name = base, k = 2; while (used.has(name.toLowerCase())) name = `${base} (${k++})`; used.add(name.toLowerCase());
      zip.file(`${name}.${ext}`, d.split(',')[1], {base64:true}); n2++;
    }
    if (!n2){ toast('No product photos to download yet.'); return; }
    btn.textContent = 'Zipping…';
    const blob = await zip.generateAsync({type:'blob'});
    await downloads.save({filename:`prime-home-decor-photos-${today()}.zip`, data:blob});
    toast(`${n2} photos saved${missing?`. ${missing} could not be read`:''}`);
  } catch(e){ toast(e?.code==='declined' ? 'Photos were not saved.' : 'Photos could not be packed. Try again.'); }
  finally { btn.textContent = label; busy = false; }
}

// cloud sync light: green = saved to the cloud, amber = waiting, red = refused (with the reason)
let pendingW = 0, lastErr = null, waitT = null;
function syncLight(){
  const el = document.getElementById('syncPill'); if (!el) return;
  if (lastErr){ el.className = 'pill bad'; el.textContent = 'Not syncing: ' + lastErr; return; }
  if (!navigator.onLine){ el.className = 'pill warn'; el.textContent = 'Offline, will sync later'; return; }
  if (pendingW > 0){ el.className = 'pill warn'; el.textContent = 'Saving to cloud…'; return; }
  el.className = 'pill good'; el.textContent = 'Synced';
}
function track(p){
  pendingW++; syncLight();
  clearTimeout(waitT); waitT = setTimeout(() => { if (pendingW > 0 && !lastErr){ const el = document.getElementById('syncPill'); if (el){ el.className='pill warn'; el.textContent='Still waiting for the cloud…'; } } }, 15000);
  return p.then(r => { pendingW--; lastErr = null; syncLight(); return r; }, e => { pendingW--; lastErr = (e && e.code) || 'error'; syncLight(); throw e; });
}
async function checkCloud(){
  try { await getDocFromServer(doc(fs,'config','settings')); lastErr = null; }

}

async function fitPhoto(blob){
  for (const [max,q] of [[1000,.8],[800,.72],[640,.65]]){ const r = await shrink(blob, max, q); if (r.dataUrl.length < 900000) return r.dataUrl; }
  throw {code:'too_large'};
}

// saving a file: iPhone/Android get the share sheet ("Save to Files", WhatsApp…), computers get a download.
// The final tap happens inside a small "ready" dialog, because phones only allow sharing straight after a tap.
downloads = {
  save: ({filename, data:payload}) => new Promise((resolve, reject) => {
    const blob = payload instanceof Blob ? payload : new Blob([payload]);
    const kb = blob.size/1024, size = kb>1024 ? (kb/1024).toFixed(1)+' MB' : Math.max(1,Math.round(kb))+' KB';
    current = null;
    form.innerHTML = `<div class="dlg-head"><h3>File ready</h3><button type="button" class="btn small" id="dlCancel">Cancel</button></div>
      <div class="dlg-body"><p style="margin:0"><b>${esc(filename)}</b> · ${size}</p><p class="sub" style="margin:0">On iPhone, choose <b>Save to Files</b> in the next screen.</p></div>
      <div class="dlg-foot"><span></span><button type="button" class="btn primary" id="dlGo">Save file</button></div>`;
    dlg.showModal();
    form.querySelector('#dlCancel').onclick = () => { dlg.close(); reject({code:'declined'}); };
    form.querySelector('#dlGo').onclick = async () => {
      const file = new File([blob], filename, {type: blob.type || (filename.endsWith('.zip')?'application/zip':'application/json')});
      const phone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      try {
        if (phone && navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file]});
        else { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 4000); }
        dlg.close(); resolve({status:'saved'});
      } catch(e){ dlg.close(); reject({code: e && e.name==='AbortError' ? 'declined' : 'unavailable'}); }
    };
  })
};

render();
showGate('loading');
onAuthStateChanged(auth, u => enter(u));

/* owner manages who can sign in */
async function addMember(email){
  email = email.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('That email address doesn\'t look right.'); return; }
  if (email===OWNER){ toast('You can always sign in.'); return; }
  try { await setDoc(doc(fs,'members',email), {email, added: today()}); toast(`${email} can now sign in`); } catch(e){ fail(e); }
}
async function removeMember(email){ try { await deleteDoc(doc(fs,'members',email)); toast(`${email} removed`); } catch(e){ fail(e); } }
window.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id==='memAdd'){ const i = document.getElementById('memEmail'); addMember(i.value); i.value=''; }
  if (t.dataset.memRm){
    if (!t.classList.contains('armed')){ t.classList.add('armed'); t.textContent='Tap again to remove'; setTimeout(()=>{ if(t.isConnected){t.classList.remove('armed'); t.textContent='Remove';} },3000); return; }
    removeMember(t.dataset.memRm);
  }
  if (t.id==='signOutBtn') signOut(auth);
  if (t.id==='fixGo') applyFix(t);
});
window.addEventListener('online', () => toast('Back online. Changes are syncing.'));
window.addEventListener('offline', () => toast('Offline. You can keep working; changes save when you\'re back online.'));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
