<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prime Home Decor</title>
<meta name="description" content="Stock, purchases, sales, partners and promotion for Prime Home Decor.">
<meta name="theme-color" content="#0D6A62">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prime Decor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EEF1EF; --surface:#FFFFFF; --surface2:#F6F8F7; --line:#D8DEDB;
  --ink:#1B2627; --muted:#5B6868; --faint:#8A9695;
  --accent:#0D6A62; --accent-ink:#FFFFFF; --accent-soft:#DCEDEA;
  --gold:#B57A12; --gold-soft:#F6EAD2;
  --good:#1F7A3E; --good-soft:#DFF1E5; --warn:#9A6100; --warn-soft:#FBEBCB; --bad:#B3261E; --bad-soft:#F8DEDB;
  --shadow:0 1px 2px rgba(20,40,40,.06),0 6px 20px rgba(20,40,40,.06);
  --display:"Marcellus","Palatino Linotype",Georgia,serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1616; --surface:#172020; --surface2:#1C2727; --line:#2A3736;
    --ink:#E4ECEA; --muted:#9DAEAC; --faint:#6F807E;
    --accent:#44B3A5; --accent-ink:#0B1414; --accent-soft:#16332F;
    --gold:#E0A745; --gold-soft:#3A2E17;
    --good:#5CC983; --good-soft:#15301F; --warn:#E6B04A; --warn-soft:#382A10; --bad:#F08A80; --bad-soft:#3A1C19;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1616; --surface:#172020; --surface2:#1C2727; --line:#2A3736;
  --ink:#E4ECEA; --muted:#9DAEAC; --faint:#6F807E;
  --accent:#44B3A5; --accent-ink:#0B1414; --accent-soft:#16332F;
  --gold:#E0A745; --gold-soft:#3A2E17;
  --good:#5CC983; --good-soft:#15301F; --warn:#E6B04A; --warn-soft:#382A10; --bad:#F08A80; --bad-soft:#3A1C19;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.num,td.n,.kpi b{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#d9dfdd 35%,#9aa6a4 70%,#6e7a78 100%);display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#233;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6),0 2px 6px rgba(0,0,0,.15)}
.brand h1{font-size:24px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12.5px;letter-spacing:.04em}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:8px;border-bottom:1px solid var(--line);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab:hover:not([aria-selected="true"]){background:var(--surface2);color:var(--ink)}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}

.banner{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--gold-soft);color:var(--ink);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{margin:0;max-width:70ch}

section.view{padding-top:18px;display:grid;gap:18px}
.row-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.row-head h2{font-size:26px}
.row-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select.sel,input.search{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h3{font-size:18px;margin-bottom:10px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi span{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi b{display:block;font-size:24px;font-weight:600;margin-top:4px}
.kpi em{font-style:normal;font-size:12.5px;color:var(--muted)}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero span,.kpi.hero em{color:inherit;opacity:.85}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.sub{color:var(--muted);font-size:12.5px}
.empty{padding:28px;text-align:center;color:var(--muted)}

.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.plain{background:var(--surface2);color:var(--muted)}

.list{display:grid;gap:0}
.list .li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:center}
.list .li:last-child{border-bottom:0}

/* products */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.pcard:hover{border-color:var(--faint)}
.pimg{aspect-ratio:4/3;max-width:100%;background:linear-gradient(135deg,var(--surface2),var(--line));display:grid;place-items:center;color:var(--faint);font-family:var(--display);font-size:30px;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}
.pbody{padding:12px 14px;display:grid;gap:6px}
.pbody h4{margin:0;font-size:15.5px;font-weight:600}
.pmeta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.pmeta b{color:var(--ink);font-weight:600}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* partners */
.partners{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.partner{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.partner h3{font-size:21px}
.partner .phone{font-size:13px;color:var(--muted)}
.partner .bal{font-size:28px;font-weight:600}
.partner .split{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13.5px}
.partner .split span:nth-child(odd){color:var(--muted)}

/* promote */
.posts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:16px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;align-content:start}
.post-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.score{display:flex;align-items:baseline;gap:4px;font-family:var(--display)}
.score b{font-size:30px;color:var(--accent);font-weight:400}
.score span{color:var(--muted);font-size:14px}
.post pre{white-space:pre-wrap;font-family:var(--body);font-size:14px;margin:0;background:var(--surface2);border-radius:10px;padding:12px;max-height:320px;overflow:auto}
.post .hook{font-weight:600}
details.card{font-size:13px}
details.card summary{cursor:pointer;color:var(--muted);font-weight:600}
details.card table{min-width:0;font-size:13px;margin-top:8px}
details.card td,details.card th{padding:6px 8px}
.fest{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.fest div{background:var(--surface2);border-radius:10px;padding:10px 12px}
.fest b{display:block;font-family:var(--display);font-weight:400;font-size:17px}
.fest span{font-size:12.5px;color:var(--muted)}
.fest .soon{background:var(--gold-soft)}
.idea{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--line)}
.idea:last-child{border-bottom:0}
.idea p{margin:0}

/* dialog */
dialog{border:0;border-radius:16px;padding:0;width:min(640px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,20,20,.45)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.dlg-head h3{font-size:21px}
.dlg-body{padding:16px 18px;display:grid;gap:12px}
.dlg-foot{display:flex;justify-content:space-between;gap:8px;padding:14px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface);flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 10px;font-weight:400;font-size:15px;color:var(--ink);width:100%}
label.f.wide{grid-column:1/-1}
.items{display:grid;gap:8px}
.item-row{display:grid;grid-template-columns:2fr 70px 100px 32px;gap:8px;align-items:end}
@media (max-width:480px){.item-row{grid-template-columns:1fr 64px 90px 32px}}
.x{border:1px solid var(--line);background:var(--surface2);border-radius:8px;height:38px;cursor:pointer}
.paybox{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--surface2)}
.paybox label.f input{background:var(--surface)}
.calc{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.calc b{font-variant-numeric:tabular-nums;text-align:right}
.imgprev{display:flex;gap:12px;align-items:center}
.imgprev img{width:84px;height:64px;object-fit:cover;border-radius:8px}
.gate{min-height:100%;display:grid;place-items:center;padding-block:40px}
.gate-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 22px;display:grid;gap:10px;justify-items:center;text-align:center}
.gate-logo{border-radius:18px}
.gate-card h1{font-size:28px}
.gate-body{width:100%;display:grid;gap:12px;margin-top:10px;text-align:left}
.gate-form{display:grid;gap:12px}
.gate-form .btn,.gate-body>.btn{justify-content:center;padding-block:12px}
.gate-err{color:var(--bad);margin:0}
.gate-links{display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:center}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
html,body{height:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:50}
@media (prefers-reduced-motion:no-preference){.tab,.btn,.pcard{transition:background .15s,border-color .15s,color .15s}}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate-card">
    <img src="icons/icon-192.png" alt="" width="72" height="72" class="gate-logo">

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2600); }

/* ---------- calculations ---------- */
/* A purchase is a bill: several items, bill-level charges, and payments split between payers.
   Older single-item rows (productId/qty/rate/paidBy) are read as one-item bills. */
function normPurchase(u){
  if (Array.isArray(u.items)) return {...u, payments: u.payments || {}};
  const t = n(u.qty)*n(u.rate)+n(u.transport)+n(u.handling)+n(u.other);
  return {...u, items:[{productId:u.productId,qty:n(u.qty),rate:n(u.rate)}], payments:{[u.paidBy||'Firm']:t}};
}
function purchCalc(u){
  const items = u.items||[];
  const itemsVal = items.reduce((a,it)=>a+n(it.qty)*n(it.rate),0);
  const qtyAll = items.reduce((a,it)=>a+n(it.qty),0);
  const charges = n(u.transport)+n(u.handling)+n(u.other);
  const total = itemsVal+charges;
  const pays = u.payments||{};
  const paid = PAYERS.reduce((a,k)=>a+n(pays[k]),0);
  const landed = it => n(it.qty)*n(it.rate) + charges*(itemsVal>0 ? n(it.qty)*n(it.rate)/itemsVal : (qtyAll? n(it.qty)/qtyAll : 0));
  return {itemsVal,charges,total,paid,due:total-paid,landed,qty:qtyAll};
}
const supKey = s => String(s||'').trim().toLowerCase();
function calc(V){
  const P = {};
  V.products.forEach(p=>P[p.id]={...p,inQty:0,inCost:0,soldQty:0,soldVal:0});
  const purchases = V.purchases.map(normPurchase);
  purchases.forEach(u=>{ const pc=purchCalc(u); (u.items||[]).forEach(it=>{ const p=P[it.productId]; if(!p) return; p.inQty+=n(it.qty); p.inCost+=pc.landed(it); }); });
  Object.values(P).forEach(p=>{ p.avgCost = p.inQty>0 ? p.inCost/p.inQty : n(p.cost); });
  V.sales.forEach(s=>(s.items||[]).forEach(it=>{ const p=P[it.productId]; if(!p) return; p.soldQty+=n(it.qty); p.soldVal+=n(it.qty)*n(it.rate); }));
  Object.values(P).forEach(p=>{ p.qty = n(p.opening)+p.inQty-p.soldQty; p.value = Math.max(p.qty,0)*p.avgCost; });
  const saleCalc = s => {
    const gross = (s.items||[]).reduce((a,it)=>a+n(it.qty)*n(it.rate),0);
    const net = gross - n(s.discount);
    const cogs = (s.items||[]).reduce((a,it)=>a+n(it.qty)*(P[it.productId]?.avgCost||0),0);
    const costs = n(s.transport)+n(s.handling);
    return {gross,net,cogs,costs,profit:net-cogs-costs,due:net-n(s.received)};
  };
  return {P,saleCalc,purchases};
}
function inPeriod(date, p){
  if (p==='all' || !date) return true;
  const d = new Date(date+'T00:00:00'), now = new Date();
  if (p==='month') return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  if (p==='last'){ const l=new Date(now.getFullYear(),now.getMonth()-1,1); return d.getFullYear()===l.getFullYear() && d.getMonth()===l.getMonth(); }
  if (p==='fy'){ const fyStart = new Date(now.getMonth()>=3?now.getFullYear():now.getFullYear()-1,3,1); return d>=fyStart; }
  return true;
}
const PERIODS = {month:'This month',last:'Last month',fy:'This financial year',all:'All time'};
const partyName = (V,id) => V.parties.find(p=>p.id===id)?.name || 'Walk-in customer';
const partyType = (V,id) => V.parties.find(p=>p.id===id)?.type || 'Customer';
const prodName = (C,id) => C.P[id]?.name || 'Deleted product';

function periodSelect(){ return `<select class="sel" id="periodSel" aria-label="Period">${Object.entries(PERIODS).map(([k,l])=>`<option value="${k}" ${k===period?'selected':''}>${l}</option>`).join('')}</select>`; }

function dash(V,C){
  const S = V.sales.filter(s=>inPeriod(s.date,period));
  let net=0,cogs=0,saleCosts=0,disc=0,cust=0,resl=0;
  S.forEach(s=>{ const c=C.saleCalc(s); net+=c.net; cogs+=c.cogs; saleCosts+=c.costs; disc+=n(s.discount); if(partyType(V,s.partyId)==='Reseller') resl+=c.net; else cust+=c.net; });
  const exp = V.expenses.filter(e=>inPeriod(e.date,period)).reduce((a,e)=>a+n(e.amount),0);
  const gross = net-cogs, netProfit = gross-saleCosts-exp;
  const stockVal = Object.values(C.P).reduce((a,p)=>a+p.value,0);
  const recv = V.sales.reduce((a,s)=>a+Math.max(C.saleCalc(s).due,0),0);
  const margin = net>0 ? Math.round(gross/net*100) : 0;

  // monthly series, last 6 months
  const now = new Date(); const months=[];
  for(let i=5;i>=0;i--){ const m=new Date(now.getFullYear(),now.getMonth()-i,1); months.push({y:m.getFullYear(),m:m.getMonth(),sales:0,profit:0}); }
  V.sales.forEach(s=>{ const d=new Date(s.date+'T00:00:00'); const b=months.find(x=>x.y===d.getFullYear()&&x.m===d.getMonth()); if(b){const c=C.saleCalc(s); b.sales+=c.net; b.profit+=c.profit;} });
  V.expenses.forEach(e=>{ const d=new Date(e.date+'T00:00:00'); const b=months.find(x=>x.y===d.getFullYear()&&x.m===d.getMonth()); if(b) b.profit-=n(e.amount); });

  const top = {}; S.forEach(s=>(s.items||[]).forEach(it=>{ top[it.productId]=(top[it.productId]||0)+n(it.qty)*n(it.rate); }));
  const topList = Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const low = Object.values(C.P).filter(p=>p.qty<=n(p.reorder)).sort((a,b)=>a.qty-b.qty);
  const dues = {}; V.sales.forEach(s=>{ const d=C.saleCalc(s).due; if(d>0.5) dues[s.partyId||'_']=(dues[s.partyId||'_']||0)+d; });
  const dueList = Object.entries(dues).sort((a,b)=>b[1]-a[1]).slice(0,5);

  return `
  <div class="row-head"><div><h2>How the business is doing</h2><p>${PERIODS[period]} · stock and dues are as of today</p></div><div class="controls">${periodSelect()}</div></div>
  <div class="kpis">
    <div class="kpi hero"><span>Net sales</span><b>${rs(net)}</b><em>${S.length} bill${S.length===1?'':'s'} · discount ${rs(disc)}</em></div>
    <div class="kpi"><span>Gross profit</span><b>${rs(gross)}</b><em>${margin}% margin on landed cost</em></div>
    <div class="kpi"><span>Expenses</span><b>${rs(exp+saleCosts)}</b><em>incl. delivery ${rs(saleCosts)}</em></div>
    <div class="kpi"><span>Net profit</span><b style="color:${netProfit<0?'var(--bad)':'inherit'}">${rs(netProfit)}</b><em>after all costs</em></div>
    <div class="kpi"><span>Stock value</span><b>${rs(stockVal)}</b><em>${Object.values(C.P).reduce((a,p)=>a+Math.max(p.qty,0),0)} pieces</em></div>
    <div class="kpi"><span>To collect</span><b style="color:${recv>0?'var(--warn)':'inherit'}">${rs(recv)}</b><em>unpaid bills</em></div>
  </div>
  <div class="grid-2">
    <div class="panel"><h3>Last 6 months</h3>${chart(months)}
      <div class="legend"><span><i style="background:var(--accent)"></i>Net sales</span><span><i style="background:var(--gold)"></i>Net profit</span></div></div>
    <div class="panel"><h3>Where sales came from</h3>
      ${net>0 ? splitBar(cust,resl) : `<p class="sub">No sales in this period yet.</p>`}
      <h3 style="margin-top:18px">Best sellers</h3>
      <div class="list">${topList.length? topList.map(([id,v])=>`<div class="li"><span>${esc(prodName(C,id))}</span><b class="num">${rs(v)}</b></div>`).join('') : '<p class="sub">Nothing sold in this period.</p>'}</div>
    </div>
  </div>
  <div class="grid-2">
    <div class="panel"><h3>Reorder soon</h3><div class="list">${low.length? low.map(p=>`<div class="li"><span>${esc(p.name)}</span>${stockPill(p)}</div>`).join('') : '<p class="sub">Every product is above its reorder level.</p>'}</div></div>
    <div class="panel"><h3>Money to collect</h3><div class="list">${dueList.length? dueList.map(([id,v])=>`<div class="li"><span>${esc(id==='_'?'Walk-in customers':partyName(V,id))}</span><b class="num" style="color:var(--warn)">${rs(v)}</b></div>`).join('') : '<p class="sub">All bills are fully paid.</p>'}</div></div>
  </div>`;
}
function splitBar(c,r){
  const t=c+r, pc = t? Math.round(c/t*100):0;
  return `<div style="display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface2)"><div style="width:${pc}%;background:var(--accent)"></div><div style="width:${100-pc}%;background:var(--gold)"></div></div>
  <div class="list" style="margin-top:6px"><div class="li"><span><span class="pill acc">Customers</span></span><b class="num">${rs(c)} · ${pc}%</b></div><div class="li"><span><span class="pill gold">Resellers</span></span><b class="num">${rs(r)} · ${100-pc}%</b></div></div>`;
}
function chart(months){
  const W=560,H=230,L=58,R=12,T=14,B=28, iw=W-L-R, ih=H-T-B;
  const maxV = Math.max(1,...months.map(m=>Math.max(m.sales,m.profit)));
  const minV = Math.min(0,...months.map(m=>m.profit));
  const step = niceStep((maxV-minV)/4);
  const top = Math.ceil(maxV/step)*step, bot = Math.floor(minV/step)*step;
  const y = v => T + ih - (v-bot)/(top-bot)*ih;
  const bw = iw/months.length;
  let g='';
  for(let v=bot; v<=top+0.001; v+=step){ g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`; }
  let bars='', pts=[];
  months.forEach((m,i)=>{ const x=L+i*bw; const h=y(bot<0?0:bot)-y(m.sales);
    bars+=`<rect x="${x+bw*.2}" y="${y(Math.max(m.sales,0))}" width="${bw*.6}" height="${Math.max(h,0)}" rx="4" fill="var(--accent)" opacity=".85"><title>${MONTHS[m.m]}: sales ${rs(m.sales)}, profit ${rs(m.profit)}</title></rect>`;
    bars+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${MONTHS[m.m]}</text>`;
    pts.push([x+bw/2,y(m.profit)]); });
  const line = `<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>` + pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3.5}" fill="var(--gold)" stroke="var(--surface)" stroke-width="2"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly net sales and net profit">${g}${bars}${line}</svg>`;
}
function niceStep(x){ if(x<=0) return 1000; const p=Math.pow(10,Math.floor(Math.log10(x))); const f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function short(v){ const a=Math.abs(v); const s=v<0?'-':''; if(a>=100000) return s+'₹'+(a/100000).toFixed(a%100000?1:0)+'L'; if(a>=1000) return s+'₹'+(a/1000).toFixed(a%1000?1:0)+'k'; return s+'₹'+a; }
function stockPill(p){ const q=p.qty; return q<=0?`<span class="pill bad">Out · ${q}</span>`: q<=n(p.reorder)?`<span class="pill warn">Low · ${q}</span>`:`<span class="pill good">${q} in stock</span>`; }

function stock(V,C){
  const list = Object.values(C.P).filter(p=>!stockQ || (p.name+' '+p.category).toLowerCase().includes(stockQ.toLowerCase()));
  const total = list.reduce((a,p)=>a+p.value,0);
  return `<div class="row-head"><div><h2>Stock</h2><p>${list.length} products · stock value ${rs(total)} at landed cost</p></div>
  <div class="controls"><input class="search" id="stockQ" placeholder="Search products" value="${esc(stockQ)}" aria-label="Search products">${downloads && !demo ? `<button class="btn" id="photoZipBtn">Download all photos</button>`:''}<button class="btn primary" data-add="products">+ Product</button></div></div>
  ${list.length? `<div class="cards">${list.map(p=>{
    const m = n(p.price)>0 ? Math.round((n(p.price)-p.avgCost)/n(p.price)*100) : 0;
    return `<button type="button" class="pcard" data-edit="products" data-id="${p.id}">
      <div class="pimg" data-img="${esc(p.imageId||'')}" data-src="${esc(p.img||'')}">${esc((p.name||'?')[0])}</div>
      <div class="pbody"><div class="pmeta"><span class="pill plain">${esc(p.category||'Other')}</span>${stockPill(p)}</div>
      <h4>${esc(p.name)}</h4>
      <div class="pmeta"><span>Retail <b>${rs(p.price)}</b></span><span>Reseller <b>${rs(p.resellerPrice)}</b></span></div>
      <div class="pmeta"><span>Landed cost <b>${rs(p.avgCost)}</b></span><span>Margin <b>${m}%</b></span></div></div></button>`; }).join('')}</div>`
  : `<div class="panel empty">No products yet. Add your first product with a photo, price and reseller price.</div>`}`;
}
function hydrateImages(){
  document.querySelectorAll('.pimg').forEach(el=>{
    const id = el.dataset.img, src = el.dataset.src;
    const show = url => { if(!url || !el.isConnected) return; const im=new Image(); im.alt=''; im.onload=()=>{el.textContent='';el.appendChild(im);}; im.src=url; };

  });
}

function supplierList(C){
  const m = new Map();
  C.purchases.forEach(u=>{ const k=supKey(u.supplier); const e=m.get(k)||{key:k,names:{},bills:0,total:0}; const nm=String(u.supplier||'').trim(); e.names[nm]=(e.names[nm]||0)+1; e.bills++; e.total+=purchCalc(u).total; m.set(k,e); });
  return [...m.values()].map(e=>({...e,name:Object.entries(e.names).sort((a,b)=>b[1]-a[1])[0][0]||'No supplier name'})).sort((a,b)=>a.name.localeCompare(b.name));
}
const PAY_FILTERS = [['all','Anyone paid'],['Anita','Anita paid'],['Neha','Neha paid'],['Firm','Firm paid'],['shared','Both partners paid'],['due','Not fully paid']];
function payPills(u){
  const p=u.payments||{}; const out=PAYERS.filter(k=>n(p[k])>0).map(k=>`<span class="pill ${k==='Anita'?'acc':k==='Neha'?'gold':'plain'}">${k} ${rs(p[k])}</span>`);
  return out.length? out.join(' ') : '<span class="sub">Not paid</span>';
}
function purchasesV(V,C){
  const sups = supplierList(C);
  if (supFilter!=='all' && !sups.some(s=>s.key===supFilter)) supFilter='all';
  const rows = C.purchases.filter(u=>{
    if (supFilter!=='all' && supKey(u.supplier)!==supFilter) return false;
    if (!inPeriod(u.date,purchPeriod)) return false;
    const p=u.payments||{}, pc=purchCalc(u);
    if (payFilter==='shared') return n(p.Anita)>0 && n(p.Neha)>0;
    if (payFilter==='due') return pc.due>0.5;
    if (payFilter!=='all') return n(p[payFilter])>0;
    return true;
  }).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const S = {total:0,A:0,N:0,F:0,due:0,charges:0};
  rows.forEach(u=>{ const pc=purchCalc(u), p=u.payments||{}; S.total+=pc.total; S.charges+=pc.charges; S.A+=n(p.Anita); S.N+=n(p.Neha); S.F+=n(p.Firm); S.due+=Math.max(pc.due,0); });
  const supName = supFilter==='all' ? 'All suppliers' : (sups.find(s=>s.key===supFilter)?.name || 'No supplier name');
  return `<div class="row-head"><div><h2>Purchases</h2><p>${esc(supName)} · ${rows.length} bill${rows.length===1?'':'s'} · ${PERIODS[purchPeriod]}</p></div>
  <div class="controls">
    <select class="sel" id="supSel" aria-label="Supplier"><option value="all">All suppliers (${sups.length})</option>${sups.map(s=>`<option value="${esc(s.key)}" ${s.key===supFilter?'selected':''}>${esc(s.name)} · ${s.bills} bill${s.bills===1?'':'s'}</option>`).join('')}</select>
    <select class="sel" id="paySel" aria-label="Paid by">${PAY_FILTERS.map(([k,l])=>`<option value="${k}" ${k===payFilter?'selected':''}>${l}</option>`).join('')}</select>
    <select class="sel" id="purchPeriodSel" aria-label="Period">${Object.entries(PERIODS).map(([k,l])=>`<option value="${k}" ${k===purchPeriod?'selected':''}>${l}</option>`).join('')}</select>
    <button class="btn primary" data-add="purchases">+ Purchase bill</button></div></div>
  <div class="kpis">
    <div class="kpi hero"><span>Bills total</span><b>${rs(S.total)}</b><em>incl. ${rs(S.charges)} transport &amp; handling</em></div>
    <div class="kpi"><span>Paid by Anita</span><b>${rs(S.A)}</b></div>
    <div class="kpi"><span>Paid by Neha</span><b>${rs(S.N)}</b></div>
    ${S.F>0.5?`<div class="kpi"><span>Paid by firm</span><b>${rs(S.F)}</b></div>`:''}
    <div class="kpi"><span>Unpaid to supplier</span><b style="color:${S.due>0.5?'var(--warn)':'inherit'}">${rs(S.due)}</b></div>
  </div>
  ${table(['Date','Supplier','Items','Items value','Charges','Bill total','Paid by','Status'],
    rows.map(u=>{ const pc=purchCalc(u); const it=u.items||[];
      const list = it.slice(0,3).map(i=>`${esc(prodName(C,i.productId))} <span class="sub">${n(i.qty)} × ${rs(i.rate)}</span>`).join('<br>') + (it.length>3?`<div class="sub">and ${it.length-3} more</div>`:'');
      const status = pc.due>0.5?`<span class="pill warn">Due ${rs(pc.due)}</span>`: pc.due<-0.5?`<span class="pill bad">Overpaid ${rs(-pc.due)}</span>`:`<span class="pill good">Paid</span>`;
      return `<tr class="click" data-edit="purchases" data-id="${u.id}"><td>${dmy(u.date)}</td><td><b>${esc(u.supplier||'')}</b>${u.billNo?`<div class="sub">Bill ${esc(u.billNo)}</div>`:''}</td><td>${list}</td><td class="n">${rs(pc.itemsVal)}</td><td class="n">${rs(pc.charges)}</td><td class="n"><b>${rs(pc.total)}</b><div class="sub">${pc.qty} pcs</div></td><td>${payPills(u)}</td><td>${status}</td></tr>`; }),
    'No purchase bills match these filters.',[3,4,5])}`;
}
function salesV(V,C){

function partiesV(V,C){
  const stats={}; V.sales.forEach(s=>{ const c=C.saleCalc(s); const k=s.partyId||'_'; stats[k]=stats[k]||{bought:0,due:0,bills:0,last:''}; stats[k].bought+=c.net; stats[k].due+=c.due; stats[k].bills++; if((s.date||'')>stats[k].last) stats[k].last=s.date; });
  const rows = V.parties.filter(p=>partyFilter==='all'||p.type===partyFilter).sort((a,b)=>(stats[b.id]?.bought||0)-(stats[a.id]?.bought||0));
  return `<div class="row-head"><div><h2>Customers &amp; resellers</h2><p>${V.parties.filter(p=>p.type==='Customer').length} customers · ${V.parties.filter(p=>p.type==='Reseller').length} resellers</p></div>

  ${table(['Name','Type','Phone','City','Bills','Total bought','Due','Last bought'],
    rows.map(p=>{ const s=stats[p.id]||{bought:0,due:0,bills:0,last:''};
      return `<tr class="click" data-edit="parties" data-id="${p.id}"><td><b>${esc(p.name)}</b>${p.note?`<div class="sub">${esc(p.note)}</div>`:''}</td><td><span class="pill ${p.type==='Reseller'?'gold':'acc'}">${p.type}</span></td><td class="num">${esc(p.phone||'')}</td><td>${esc(p.city||'')}</td><td class="n">${s.bills}</td><td class="n">${rs(s.bought)}</td><td class="n" style="color:${s.due>0.5?'var(--warn)':'inherit'}">${rs(Math.max(s.due,0))}</td><td>${dmy(s.last)}</td></tr>`; }),
    'No customers or resellers yet.',[4,5,6])}`;

function partnerBooks(V,C){
  let net=0,cogs=0,costs=0; V.sales.forEach(s=>{const c=C.saleCalc(s); net+=c.net; cogs+=c.cogs; costs+=c.costs;});
  const exp = V.expenses.reduce((a,e)=>a+n(e.amount),0);
  const profit = net-cogs-costs-exp;
  const shareA = n(settings.shareAnita)/100;
  return PARTNERS.map(pt=>{
    const cap = V.ledger.filter(l=>l.partner===pt.key&&l.kind==='Capital in').reduce((a,l)=>a+n(l.amount),0);
    const wd = V.ledger.filter(l=>l.partner===pt.key&&l.kind==='Withdrawal').reduce((a,l)=>a+n(l.amount),0);
    const paidP = C.purchases.reduce((a,u)=>a+n((u.payments||{})[pt.key]),0);
    const paidE = V.expenses.filter(e=>e.paidBy===pt.key).reduce((a,e)=>a+n(e.amount),0);
    const share = profit*(pt.key==='Anita'?shareA:1-shareA);
    return {...pt,cap,wd,paid:paidP+paidE,share,bal:cap+paidP+paidE+share-wd};
  });
}

function expensesV(V){
  const rows=[...V.expenses].filter(e=>inPeriod(e.date,period)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const by={}; rows.forEach(e=>by[e.category]=(by[e.category]||0)+n(e.amount));

  return `<div class="row-head"><div><h2>Expenses</h2><p>${PERIODS[period]} · ${rs(tot)}. Delivery costs on bills are counted in Sales.</p></div><div class="controls">${periodSelect()}<button class="btn primary" data-add="expenses">+ Expense</button></div></div>
  ${Object.keys(by).length?`<div class="kpis">${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="kpi"><span>${esc(k)}</span><b>${rs(v)}</b></div>`).join('')}</div>`:''}
  ${table(['Date','Category','Amount','Paid by','Note'],
    rows.map(e=>`<tr class="click" data-edit="expenses" data-id="${e.id}"><td>${dmy(e.date)}</td><td>${esc(e.category)}</td><td class="n">${rs(e.amount)}</td><td>${esc(e.paidBy||'Firm')}</td><td>${esc(e.note||'')}</td></tr>`),
    'No expenses in this period.',[2])}`;
}
function table(heads, rows, emptyMsg, numCols=[]){
  return `<div class="tbl-wrap"><table><thead><tr>${heads.map((h,i)=>`<th class="${numCols.includes(i)?'n':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${heads.length}" class="empty">${emptyMsg}</td></tr>`}</tbody></table></div>`;
}

function shrink(file, max, q){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file); const im = new Image();
    im.onload = ()=>{ const s=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      const dataUrl=c.toDataURL('image/jpeg',q); c.toBlob(b=>res({blob:b,url:URL.createObjectURL(b),dataUrl}),'image/jpeg',q); URL.revokeObjectURL(url); };
    im.onerror = rej; im.src = url;
  });
}

/* Old single-item purchase rows from the same date and supplier become one bill,
   with each partner's share kept as their payment. Same ids every time, so restoring twice replaces, not duplicates. */
function groupRows(rows){
  const bills = new Map(), out = [];
  rows.forEach(u=>{
    if (!u || Array.isArray(u.items)) { if(u) out.push(u); return; }
    const k = (u.date||'') + '|' + supKey(u.supplier);
    const slug = supKey(u.supplier).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'nosupplier';
    let b = bills.get(k);
    if (!b){ b = {id:`b-${u.date}-${slug}`,date:u.date,supplier:String(u.supplier||'').trim(),billNo:'',items:[],transport:0,handling:0,other:0,payments:{},note:'',sourceRows:[]}; bills.set(k,b); }
    const t = n(u.qty)*n(u.rate)+n(u.transport)+n(u.handling)+n(u.other);
    const who = u.paidBy||'Firm'; b.payments[who] = Math.round(((b.payments[who]||0)+t)*100)/100;
    b.items.push({productId:u.productId,qty:n(u.qty),rate:n(u.rate)});
    b.transport+=n(u.transport); b.handling+=n(u.handling); b.other+=n(u.other); b.sourceRows.push(u.id);
  });
  return [...out, ...bills.values()];
}

      <div class="calc">${counts.map(([c,k])=>`<span>${c[0].toUpperCase()+c.slice(1)}</span><b>${k}</b>`).join('')}<span>Product photos</span><b>${Object.keys(j.images||{}).length}</b></div>

const blobToDataUrl = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); });
async function dataUrlToBlob(u){ const [h,b64]=u.split(','); const mime=(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg'; const bin=atob(b64); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type:mime}); }
function imgToDataUrl(src){ // fallback when fetch can't read the photo: draw it and re-save as JPEG
  return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; c.getContext('2d').drawImage(im,0,0); try{res(c.toDataURL('image/jpeg',.9));}catch(e){rej(e);} }; im.onerror=rej; im.src=src; });
}
async function readPhoto(p){
  if (p.img) return p.img;                       // photo kept inside the record (browser-only mode)
  if (!p.imageId) return null;
  return await getPhotoUrl(p.imageId);
}
async function photoExists(id){ return !!(await getPhotoUrl(id)); }
async function shrinkDataUrl(u, max, q){ const b = await dataUrlToBlob(u); return (await shrink(b, max, q)).dataUrl; }

async function runImport(btn){

  // put photos back first, so the products point at photos that exist here
  const prods = (j.products||[]).filter(p=>p&&p.id).map(p=>({...p}));
  for (const p of prods){
    const d = p.imageId && photos[p.imageId]; if (!d) continue;
    prog.textContent = `Restoring photos ${photoOk+photoSkip+1}…`;
    if (await photoExists(p.imageId)) { photoOk++; continue; }
    try {
      if (assets){ const r = await assets.upload(await dataUrlToBlob(d), {type:(d.match(/data:([^;]+)/)||[])[1]||'image/jpeg'}); p.imageId = r.id; delete p.img; photoOk++; }
      else { p.img = await shrinkDataUrl(d, 480, .7); delete p.imageId; photoOk++; }
    } catch(e){ photoSkip++; }
  }
  const all = []; COLS.forEach(c=>(c==='products' ? prods : c==='purchases' ? groupRows(j[c]||[]) : (j[c]||[])).forEach(x=>{ if(x&&x.id) all.push([c,x]); }));
  let done = 0;
  for (const [c,x] of all){
    if (!(await saveDoc(c,x))) { prog.textContent = `Stopped after ${done} of ${all.length}. Try again to finish.`; btn.disabled=false; return; }
    done++; if (done%5===0) prog.textContent = `Restored ${done} of ${all.length}…`;
  }
  if (j.settings){ settings = {shareAnita:50,...j.settings}; await saveSettings(); }
  pendingImport = null; dlg.close();
  toast(`Restored ${done} records${photoOk?` and ${photoOk} photos`:''}${photoSkip?`. ${photoSkip} photos could not be restored`:''}`);
}

let busy = false;
async function backup(){
  if (busy) return; busy = true;
  const btn = document.getElementById('backupBtn'); const label = btn.textContent;
  try {
    const images = {}; let missing = 0, i = 0;
    // photos stored as assets are read out here; a photo kept inside a product record (p.img) is already in the record
    const withPhoto = data.products.filter(p=>p.imageId);
    for (const p of withPhoto){
      btn.textContent = `Packing photos ${++i}/${withPhoto.length}`;
      const d = await readPhoto({imageId:p.imageId}); if (d) images[p.imageId] = d; else missing++;
    }
    btn.textContent = 'Saving…';
    const payload = JSON.stringify({app:'Prime Home Decor Desk', version:2, exported:new Date().toISOString(), ...data, settings, images});
    await downloads.save({filename:`prime-home-decor-backup-${today()}.json`, data:new Blob([payload],{type:'application/json'})});
    toast(`Backup saved with ${Object.keys(images).length} photos${missing?`. ${missing} photos could not be read`:''}`);
  } catch(e){ toast(e?.code==='declined' ? 'Backup was not saved.' : 'Backup could not be made. Try again.'); }
  finally { btn.textContent = label; busy = false; }
}

/* A ZIP of every product photo, named "Product - Rs price.jpg", ready for WhatsApp or Instagram. */
async function photoZip(btn){
  if (busy) return;
  if (!window.JSZip){ toast('The photo packer did not load. Check your connection and reload.'); return; }
  busy = true; const label = btn.textContent;
  try {
    const zip = new JSZip(); const used = new Set(); let n2 = 0, missing = 0;
    const withPhoto = data.products.filter(p=>p.imageId || p.img);
    for (const p of withPhoto){
      btn.textContent = `Packing ${n2+missing+1}/${withPhoto.length}`;
      const d = await readPhoto(p); if (!d){ missing++; continue; }
      const ext = /image\/png/.test(d)?'png':/image\/webp/.test(d)?'webp':'jpg';
      let base = (p.name||'Product').trim().replace(/[\\/:*?"<>|]+/g,' ').replace(/\s+/g,' ') + (n(p.price)?` - Rs ${n(p.price)}`:'');
      let name = base, k = 2; while (used.has(name.toLowerCase())) name = `${base} (${k++})`; used.add(name.toLowerCase());
      zip.file(`${name}.${ext}`, d.split(',')[1], {base64:true}); n2++;
    }
    if (!n2){ toast('No product photos to download yet.'); return; }
    btn.textContent = 'Zipping…';
    const blob = await zip.generateAsync({type:'blob'});
    await downloads.save({filename:`prime-home-decor-photos-${today()}.zip`, data:blob});
    toast(`${n2} photos saved${missing?`. ${missing} could not be read`:''}`);
  } catch(e){ toast(e?.code==='declined' ? 'Photos were not saved.' : 'Photos could not be packed. Try again.'); }
  finally { btn.textContent = label; busy = false; }
}

    doc: id => ({ set: o => setDoc(doc(fs,c,id), o), delete: () => deleteDoc(doc(fs,c,id)) }),
    onSnapshot: (next, err) => onSnapshot(collection(fs,c), s => next({docs: s.docs.map(d=>({id:d.id, data:()=>d.data()}))}), err)
  }),
  doc: path => { const r = doc(fs, ...path.split('/')); return {
    set: o => setDoc(r, o),
    onSnapshot: (next, err) => onSnapshot(r, s => next({exists: s.exists(), data: () => s.data()}), err) }; }
};

// photos live in their own "photos" records, made small enough to fit (under 1 MB each)
const photoCache = new Map();
async function getPhotoUrl(id){
  if (!id) return null;
  if (photoCache.has(id)) return photoCache.get(id);
  const p = getDoc(doc(fs,'photos',id)).then(s => s.exists() ? (s.data().data || null) : null).catch(()=>null);
  photoCache.set(id, p);
  const v = await p; if (!v) photoCache.delete(id); return v;
}
function removePhoto(id){ photoCache.delete(id); deleteDoc(doc(fs,'photos',id)).catch(()=>{}); }
async function fitPhoto(blob){
  for (const [max,q] of [[1000,.8],[800,.72],[640,.65]]){ const r = await shrink(blob, max, q); if (r.dataUrl.length < 900000) return r.dataUrl; }
  throw {code:'too_large'};
}
assets = {
  upload: async (blob) => {
    const dataUrl = await fitPhoto(blob);
    const id = uid();
    photoCache.set(id, Promise.resolve(dataUrl));
    setDoc(doc(fs,'photos',id), {data: dataUrl, created: new Date().toISOString()}).catch(fail);
    return {id, url: dataUrl};
  }
};

// saving a file: iPhone/Android get the share sheet ("Save to Files", WhatsApp…), computers get a download.
// The final tap happens inside a small "ready" dialog, because phones only allow sharing straight after a tap.
downloads = {
  save: ({filename, data:payload}) => new Promise((resolve, reject) => {
    const blob = payload instanceof Blob ? payload : new Blob([payload]);
    const kb = blob.size/1024, size = kb>1024 ? (kb/1024).toFixed(1)+' MB' : Math.max(1,Math.round(kb))+' KB';
    current = null;
    form.innerHTML = `<div class="dlg-head"><h3>File ready</h3><button type="button" class="btn small" id="dlCancel">Cancel</button></div>
      <div class="dlg-body"><p style="margin:0"><b>${esc(filename)}</b> · ${size}</p><p class="sub" style="margin:0">On iPhone, choose <b>Save to Files</b> in the next screen.</p></div>
      <div class="dlg-foot"><span></span><button type="button" class="btn primary" id="dlGo">Save file</button></div>`;
    dlg.showModal();
    form.querySelector('#dlCancel').onclick = () => { dlg.close(); reject({code:'declined'}); };
    form.querySelector('#dlGo').onclick = async () => {
      const file = new File([blob], filename, {type: blob.type || (filename.endsWith('.zip')?'application/zip':'application/json')});
      const phone = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      try {
        if (phone && navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file]});
        else { const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 4000); }
        dlg.close(); resolve({status:'saved'});
      } catch(e){ dlg.close(); reject({code: e && e.name==='AbortError' ? 'declined' : 'unavailable'}); }
    };
  })
};

/* sign-in screen */
const gate = document.getElementById('gate');
function showGate(state, email){
  gate.hidden = false; document.querySelector('.wrap').hidden = true;
  const body = document.getElementById('gateBody');
  if (state==='loading'){ body.innerHTML = `<p class="sub">Opening the books…</p>`; return; }
  if (state==='signin' || state==='signup'){
    const up = state==='signup';
    body.innerHTML = `<form id="authForm" class="gate-form" novalidate>
      <label class="f">Email<input id="authEmail" type="email" autocomplete="email" inputmode="email" required value="${esc(email||'')}"></label>
      <label class="f">Password<input id="authPass" type="password" autocomplete="${up?'new-password':'current-password'}" required minlength="6"></label>
      <p class="sub gate-err" id="authErr" hidden></p>
      <button class="btn primary" type="submit" id="authGo">${up?'Create account':'Sign in'}</button>
      <div class="gate-links">${up?`<button type="button" class="linkbtn" data-gate="signin">I already have an account</button>`:`<button type="button" class="linkbtn" data-gate="signup">New here? Create an account</button><button type="button" class="linkbtn" id="forgot">Forgot password</button>`}</div>
    </form>`;
    body.querySelector('#authForm').dataset.mode = state;
    return;
  }
  if (state==='verify'){
    body.innerHTML = `<p style="margin:0">We sent a link to <b>${esc(email)}</b>. Open that email, tap the link, then come back here.</p>
      <p class="sub" style="margin:0">Can't see it? Check the Spam folder.</p>
      <button class="btn primary" id="verDone">I've tapped the link</button>
      <div class="gate-links"><button type="button" class="linkbtn" id="verResend">Send the email again</button><button type="button" class="linkbtn" id="gateOut">Use a different email</button></div>`;
    return;
  }
  if (state==='notmember'){
    body.innerHTML = `<p style="margin:0">You're signed in as <b>${esc(email)}</b>, but this email isn't on the list of people who can open Prime Home Decor's books.</p>
      <p class="sub" style="margin:0">Ask Ankur to add this email in the app: Partners tab, "Who can use the app". Then tap Try again.</p>
      <button class="btn primary" id="tryAgain">Try again</button>
      <div class="gate-links"><button type="button" class="linkbtn" id="gateOut">Sign out</button></div>`;
    return;
  }
  if (state==='offline'){
    body.innerHTML = `<p style="margin:0">Couldn't reach the books. Check the internet connection.</p><button class="btn primary" id="tryAgain">Try again</button>`;
  }
}
function hideGate(){ gate.hidden = true; document.querySelector('.wrap').hidden = false; }
const AUTH_MSG = {
  'auth/invalid-credential':'Email or password is wrong.', 'auth/wrong-password':'Email or password is wrong.', 'auth/user-not-found':'No account with this email. Tap "Create an account".',
  'auth/email-already-in-use':'This email already has an account. Sign in instead.', 'auth/weak-password':'Use a password of at least 6 characters.',
  'auth/invalid-email':'That email address doesn\'t look right.', 'auth/too-many-requests':'Too many tries. Wait a few minutes and try again.',
  'auth/network-request-failed':'No internet connection. Connect and try again.', 'auth/operation-not-allowed':'Email sign-in is switched off in Firebase. Turn on Email/Password under Authentication, Sign-in method.'
};
gate.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, email = f.querySelector('#authEmail').value.trim(), pass = f.querySelector('#authPass').value;
  const err = f.querySelector('#authErr'), go = f.querySelector('#authGo');
  if (!email || pass.length < 6){ err.textContent = 'Enter your email and a password of at least 6 characters.'; err.hidden = false; return; }
  go.disabled = true; err.hidden = true;
  try {
    if (f.dataset.mode==='signup'){ const c = await createUserWithEmailAndPassword(auth, email, pass); await sendEmailVerification(c.user); }
    else await signInWithEmailAndPassword(auth, email, pass);
  } catch(x){ err.textContent = AUTH_MSG[x.code] || 'Something went wrong. Try again.'; err.hidden = false; go.disabled = false; }
});
gate.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.gate){ const em = gate.querySelector('#authEmail')?.value; showGate(t.dataset.gate, em); }
  if (t.id==='forgot'){
    const em = gate.querySelector('#authEmail').value.trim(); const err = gate.querySelector('#authErr');
    if (!em){ err.textContent = 'Type your email first, then tap Forgot password.'; err.hidden = false; return; }
    try { await sendPasswordResetEmail(auth, em); err.textContent = `A reset link was sent to ${em}.`; err.hidden = false; } catch(x){ err.textContent = AUTH_MSG[x.code] || 'Could not send the link.'; err.hidden = false; }
  }
  if (t.id==='verDone'){ t.disabled = true; try { await auth.currentUser.reload(); await auth.currentUser.getIdToken(true); } catch(x){} t.disabled = false; enter(auth.currentUser, true); }
  if (t.id==='verResend'){ try { await sendEmailVerification(auth.currentUser); toast('Email sent again'); } catch(x){ toast(AUTH_MSG[x.code] || 'Could not send the email.'); } }
  if (t.id==='tryAgain') enter(auth.currentUser);
  if (t.id==='gateOut') signOut(auth);
});

function stopBooks(){ unsubs.forEach(u=>{ try{u();}catch(e){} }); unsubs = []; }
function startBooks(){
  stopBooks(); mode = 'db'; loadedCount = 0;
  const seen = new Set();
  const done = () => { if (seen.size >= COLS.length+1 && loadedCount===0){ loadedCount=1; demo = COLS.every(c=>!data[c].length); } render(); };
  const onErr = c => e => { seen.add(c); if (e && e.code==='permission-denied'){ stopBooks(); showGate('notmember', me); } else done(); };
  COLS.forEach(c => unsubs.push(db.collection(c).onSnapshot(snap=>{ data[c]=snap.docs.map(d=>({...d.data(),id:d.id})); if (data[c].length) demo=false; seen.add(c); done(); }, onErr(c))));
  unsubs.push(db.doc('config/settings').onSnapshot(s=>{ if(s.exists) settings={shareAnita:50,...s.data()}; seen.add('settings'); done(); }, onErr('settings')));
  if (isOwnerUser) unsubs.push(onSnapshot(collection(fs,'members'), s=>{ members = s.docs.map(d=>({id:d.id,...d.data()})); render(); }, ()=>{}));
}
async function enter(user, fromVerify){
  if (!user){ stopBooks(); me = null; COLS.forEach(c=>data[c]=[]); showGate('signin'); return; }
  me = (user.email||'').toLowerCase();
  if (!user.emailVerified){ showGate('verify', user.email); if (fromVerify) toast('Not verified yet. Tap the link in the email first.'); return; }
  isOwnerUser = me === OWNER;
  if (!isOwnerUser){
    showGate('loading');
    try { const m = await getDoc(doc(fs,'members',me)); if (!m.exists()){ showGate('notmember', me); return; } }
    catch(e){ if (e.code==='permission-denied'){ showGate('notmember', me); return; } /* offline: try the saved copy */ }
  }
  hideGate(); startBooks(); render();
}
render();
showGate('loading');
onAuthStateChanged(auth, u => enter(u));

/* owner manages who can sign in */
async function addMember(email){
  email = email.trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('That email address doesn\'t look right.'); return; }
  if (email===OWNER){ toast('You can always sign in.'); return; }
  try { await setDoc(doc(fs,'members',email), {email, added: today()}); toast(`${email} can now sign in`); } catch(e){ fail(e); }
}
async function removeMember(email){ try { await deleteDoc(doc(fs,'members',email)); toast(`${email} removed`); } catch(e){ fail(e); } }
window.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id==='memAdd'){ const i = document.getElementById('memEmail'); addMember(i.value); i.value=''; }
  if (t.dataset.memRm){
    if (!t.classList.contains('armed')){ t.classList.add('armed'); t.textContent='Tap again to remove'; setTimeout(()=>{ if(t.isConnected){t.classList.remove('armed'); t.textContent='Remove';} },3000); return; }
    removeMember(t.dataset.memRm);
  }
  if (t.id==='signOutBtn') signOut(auth);
});
window.addEventListener('online', () => toast('Back online. Changes are syncing.'));
window.addEventListener('offline', () => toast('Offline. You can keep working; changes save when you\'re back online.'));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
